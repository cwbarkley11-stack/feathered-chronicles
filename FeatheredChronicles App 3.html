was wrong, but because something larger required all seven to be held at once. The sword is in every peace that holds not because the grievances resolved but because someone stood between them.", "quote": "Peace is not the absence of conflict. Peace is the active maintenance of the space between conflicts."}, {"name": "Sacrifice", "bearer": "Mara", "epithet": "who gave in the exact right moment", "lore": "Not sacrifice for its own sake. The exact right moment \u2014 the giving that was the next thing, made by the person who was still the person who did the next thing. The sword is in every act of precise giving that lands exactly where it needs to.", "quote": "The giving that is not the right moment is waste. The giving that is the right moment is everything."}, {"name": "Memory", "bearer": "Talen", "epithet": "who moved through the burning building reading", "lore": "Moved through the burning building not away from it. Reading as it burned. Taking what could be taken. The sword is in the specific kind of love that moves toward rather than away from the thing being lost.", "quote": "The building is burning. This is the reason to read, not the reason to leave."}, {"name": "Defiance", "bearer": "Rukar", "epithet": "who refused the thing that would have saved him", "lore": "Refused the thing that would have saved him in order to hold the thing that mattered more. Not death-seeking. Holding-seeking. The sword is in every determination that costs what it costs and is maintained anyway.", "quote": "The cost is the proof that the holding is real."}, {"name": "Mercy", "bearer": "Elyra", "epithet": "who spared them not because they deserved it", "lore": "Spared them not because they deserved it. Because mercy that requires deserving it is not mercy \u2014 it is justice with a different name. The sword is in every act of mercy that preserved the capacity for mercy rather than exhausting it.", "quote": "Mercy given to the undeserving is the only mercy. The rest is just reward."}, {"name": "Dominion", "bearer": "Kael V", "epithet": "who built for people who would not know to thank him", "lore": "Built for people not yet born. The work was real, the recipients were not present, the gratitude was impossible. The sword is in every act of building that assumes the future and acts accordingly.", "quote": "The people who will need this have not been born yet. Build it anyway."}, {"name": "Renewal", "bearer": "Thren", "epithet": "who burned the field so it could grow", "lore": "Burned the field for a growth the burner would not see. The loss was complete. The renewal was certain. The sword is in every act of deliberate ending that makes space for what could not otherwise exist.", "quote": "The field that will not burn cannot grow. The burning is the care."}, {"name": "Silence", "bearer": "Veyne", "epithet": "who ceased from speech and found the substance", "lore": "Ceased from speech and found, in the silence, the thing that the speaking had been obscuring. The sword is in every silence in which the substance resides \u2014 not absence but presence of a different kind.", "quote": "The speaking was real. The silence was what the speaking had been trying to say."}, {"name": "Eternity", "bearer": "Aral", "epithet": "who chose permanently", "lore": "Chose permanently. Not once \u2014 permanently. Every moment after the choosing was the choosing maintained. The sword is in every permanent choice that is not a past event but an ongoing act, present tense, in every subsequent moment.", "quote": "I chose it. I choose it. There is no tense in which I am not choosing it."}]</script>
<script type="application/json" id="CREATURES_DATA">[{"name": "Tome Golem", "kingdom": "Lalaka", "type": "Constructed Archive", "danger": 2, "symbol": "\u229b", "desc": "Three to four meters of continuously active ancient stone, each carrying in its operational memory the complete record of everything it has ever catalogued. 847 active units. They do not sleep. They do not tire. They have been operational for between sixty and four hundred and sixty years.", "lore": "Destroying a Tome Golem is a capital offense under the Golem Compact of Year 44 \u2014 each Golem's memory is an irreplaceable archive. One Golem in the commercial district has had one entry that cannot be closed for 263 years. The entry: 'entity with non-standard temporal signature. Status: ongoing.' The subject: Leiren Thorne.", "sightings": ["Library of Life and Death, Lalaka (847 active)", "Canal District commercial quarter"]}, {"name": "Mist Sprite", "kingdom": "Nebel", "type": "Atmospheric Intelligence", "danger": 1, "symbol": "\u25ce", "desc": "Non-human intelligence that inhabits and is the fog's maintenance layer. Pre-date recorded history. Have been maintaining the three-thousand-year atmospheric archive since before the first human settlement of Nebel. They do not communicate in any human language.", "lore": "Trained fog-readers develop, over years of practice, a partial capacity to receive atmospheric intent from the Sprites \u2014 not words, but directional pressure in the fog's layers that conveys something like meaning. They have never answered a direct question about the deep strata's oldest records. They maintain the archive regardless of whether anyone reads it.", "sightings": ["Nebel fog valleys (all depths)", "Karev's Crossing atmospheric layers"]}, {"name": "Hungerwing", "kingdom": "Wanoon", "type": "Thermal-Soaring Avian", "danger": 3, "symbol": "\u25c8", "desc": "Wingspan: four to six meters. Weight: forty to sixty kilograms. The largest flying creatures in the eight kingdoms. Not tame. Never tamed. They nest in the Thermal Fields southeast of the Spire City and have done so since before the first human settlement of the Wanoon highlands.", "lore": "Full wingspan extended into the thermal, edge to edge, no portion held back. The Wanoon theological tradition reads them as the Fury Authority's influence on the local ecology \u2014 the quality expressed in the creatures that live in the kingdom's spiritual center. The Hungerwings Regiment of the Flame Vanguard cooperates with them using specific sound frequencies discovered in Year 261. Cooperation, not domestication.", "sightings": ["Thermal Fields, Wanoon Highlands (permanent nesting)", "Spire City thermals", "Wanoon-Clevel border passes"]}, {"name": "Mnemovore", "kingdom": "Laba (Forbidden Forest)", "type": "Consuming Assessor", "danger": 5, "symbol": "\u25d0", "desc": "The Forest's consuming mechanism. They do not attack. They assess. They find what has been held lightly, what is at the edges of what someone is maintaining, what has been slightly abandoned in the architecture of the held things. They take it.", "lore": "The horror of encountering a Mnemovore is not violence \u2014 it is the revelation of what you have not been holding as tightly as you thought you were. They are the Forest's intelligence, its sensing apparatus, its method. You cannot negotiate with them. You can only hold what you hold at the full grip, which is what they test. One member of the heir's team did not exit the Forest.", "sightings": ["Forbidden Forest interior (all zones)", "Forest perimeter (assessment radius)"]}, {"name": "Mirror Hound", "kingdom": "Clevel", "type": "Altitude Navigation Breed", "danger": 1, "symbol": "\u25b3", "desc": "Bred over two hundred years specifically for fog-and-altitude navigation in the Mirror Path conditions. Not large \u2014 their value is precision over strength. Navigate below the fog-line by smell and atmospheric pressure rather than sight. Work alongside the Climbing Eagles.", "lore": "The only domesticated animal breed specifically developed for Mirror Path conditions. Their navigation sense works below the fog-line where visibility drops to near-zero. The breeding program began in Year 203 and has produced a distinct breed unrelated to any lowland dog lineage. They do not get altitude sickness. No one has determined why.", "sightings": ["Mirror Height, Clevel (primary)", "All 14 Mirror Path approach routes"]}, {"name": "Guide-Hound", "kingdom": "Nebel", "type": "Fog Navigation Breed", "danger": 1, "symbol": "\u25ce", "desc": "Bred over two hundred years for fog navigation in the Nebel valley systems. Navigate through dense fog layers by atmospheric pressure sensitivity and smell. Every certified fog-reader works with at least one.", "lore": "The Nebel fog-reading tradition requires a Guide-Hound partnership for all sub-fog-line navigation. The dogs' atmospheric sensitivity appears to be sensitive to the Mist Sprite maintenance activity \u2014 they exhibit specific behaviors in the hours before and after Sprite maintenance events. The mechanism is undocumented.", "sightings": ["All Nebel fog valleys", "Karev's Crossing fog-line approaches"]}, {"id": "cr_quillrat", "name": "Quillrat", "kingdom": "Lalaka", "type": "Archive Forager", "danger": 1, "symbol": "\u229b", "desc": "Palm-sized, copper-furred, social in structure, solitary in acquisition. Has been eating documents in the Library for four centuries and has organized its foraging routes along the Library Board's own archival filing systems.", "lore": "The Quillrat is the Library's unofficial third cataloguing system. The last appointed Archivist noted that Quillrats understood the filing systems better than the Board. Their foraging routes follow a logic that only makes sense if you know what the documents are and why they belong in sequence. The Board filed this under: concerning.", "sightings": ["Library of Life and Death (permanent)", "Canal District document markets", "Sub-levels 1\u20133"], "tags": ["lalaka", "forager", "archive"]}, {"id": "cr_stormkit", "name": "Storm Kit", "kingdom": "Wanoon", "type": "Elemental Companion", "danger": 2, "symbol": "\u25c8", "desc": "Small fox-like creatures with lightning streaks in their fur and tail sparks. Mirror children's anger in harmless storms or crackles of electricity. Navigate the Thermal Fields with the Hungerwings overhead.", "lore": "Storm Kits are native to the thunderstorm belt southeast of Spire City. Flame Vanguard recruits in their first year often find one at their bedroll. The Vanguard has never been able to determine if this is intentional. The Kits do not say.", "sightings": ["Thermal Fields, Wanoon", "Flame Vanguard training grounds", "Spire City eastern quarter"], "tags": ["wanoon", "elemental", "companion"]}, {"id": "cr_glittwisp", "name": "Glittering Wisp", "kingdom": "Lalaka", "type": "Knowledge Collector", "danger": 1, "symbol": "\u229b", "desc": "Tiny glowing birds with gem-like feathers. Collect shiny objects and knowledge fragments, hiding them in secret nooks throughout the Library. Their collection priorities exactly match Crystal's preservation list.", "lore": "The Wisps predate the current Library building by at least 200 years. The Archivists have documented 340 confirmed Wisp nests. Three are in restricted sections. The Archivist who last catalogued them filed their note under: architectural coincidence. The note has been re-filed eleven times since.", "sightings": ["Library of Life and Death sub-levels 1\u20134", "Canal District rooftops at night"], "tags": ["lalaka", "collector", "light"]}, {"id": "cr_goldcrow", "name": "Golden Crow", "kingdom": "Zhala", "type": "Noble Witness", "danger": 2, "symbol": "\u25c9", "desc": "Black crows with golden-tipped feathers who mimic voices with perfect accuracy. Praise children who show bravery and humility. Scold arrogance. Serve as ceremonial witnesses at Zhala noble ceremonies.", "lore": "The Golden Crows have accompanied the Zhala royal family for six generations. Zhala law courts recognize Golden Crow testimony in specific cases \u2014 a precedent established in Year 301 that has never been overturned. The crows are aware of this.", "sightings": ["Zhala royal compounds", "Zhala noble estates throughout the kingdom"], "tags": ["zhala", "noble", "mimic"]}, {"id": "cr_sleepyowl", "name": "Sleepy Owl", "kingdom": "Halak", "type": "Prophetic Watcher", "danger": 1, "symbol": "\u25fc", "desc": "Large, gentle owls with drooping feathers and perpetually half-closed eyes. Observe quietly, giving guidance only when the child is patient. Nest in the meditation groves outside the Still City.", "lore": "The Silent Watchers believe the Sleepy Owls are prophetically aware \u2014 their choice of perch predicts outcomes. Three hundred years of Watcher records document roosting positions before major events. The correlation is significant enough that it's filed under: evidence.", "sightings": ["Still City meditation groves", "High Watcher temple grounds", "Halak plateau edge"], "tags": ["halak", "prophecy", "watcher"]}, {"id": "cr_towersprite", "name": "Tower Sprite", "kingdom": "Yowwed", "type": "Engineering Companion", "danger": 1, "symbol": "\u2696", "desc": "Small nimble creatures with spire-shaped heads and golden fingertips. Mischievously rearrange buildings or objects when humans are careless \u2014 always to structurally superior configurations.", "lore": "Documented in Yowwed construction records since Year 44. The Guild of Engineers has a formal protocol: if a Sprite rearranges your work, that rearrangement is the correct version. This has been disputed internally for 400 years. The disputes end when the Sprite version proves structurally superior.", "sightings": ["All major construction sites, Yowwed", "Skyward City scaffolding and towers", "Bridge maintenance zones"], "tags": ["yowwed", "engineering", "sprite"]}, {"id": "cr_mirrorhttp", "name": "Mirror Imp", "kingdom": "Clevel", "type": "Rivalry Companion", "danger": 2, "symbol": "\u25b3", "desc": "Silvery chameleon-like creatures with reflective skin. Copy children's actions but exaggerate them, showing what could go wrong when one envies others. Found near the Mirror Paths at dawn.", "lore": "Mirror Imps have been on the Mirror Paths since before the first settlers arrived in Clevel. Their exaggerations are precise \u2014 they show specifically the version of an action that would have failed. The Reaching Council uses this for training.", "sightings": ["Mirror Paths, Clevel (dawn hours)", "Clevel guild training grounds"], "tags": ["clevel", "mirror", "rival"]}, {"id": "cr_munchling", "name": "Munchling", "kingdom": "Laba (Forbidden Forest)", "type": "Forest Transformer", "danger": 3, "symbol": "\u25d0", "desc": "Round, soft-bodied creatures with mouths on their hands for nibbling anything edible. Gobble food, names, or small magical objects, then return the lessons learned from what they consumed.", "lore": "Munchlings are related to the Mnemovores but are far smaller and more benign. They consume to learn rather than to take. A Munchling that has eaten a lie returns a truth. The Devourer Clans keep them as memory advisors. Their nibbling sound is the same frequency as a healthy forest.", "sightings": ["Forbidden Forest clearings", "Laba settlement borders", "Feast of the Devoured Name celebrations"], "tags": ["laba", "consumption", "forest"]}]</script>
<script type="application/json" id="LOOPS_DATA">[{"loop": 1, "label": "The Beginning", "date": "Year ~460", "events": ["First death in the borderland field", "First return", "The arcade. The count: one.", "Walks south. The fog. Afraid. Keeps going."], "significance": "The loop begins. He doesn't know yet what it is."}, {"loop": 12, "label": "First Lalaka", "events": ["First time reaching Lalaka City proper", "First sight of the Library from the canal district", "The mark burning harder the closer he gets", "Doesn't know what sub-level seven is yet"], "significance": "He can feel the direction. He doesn't know why yet."}, {"loop": 63, "label": "First Fog", "events": ["First transit of Nebel territory", "First fog-crossing alone", "The fog keeps his passage", "Something in the fog reads him \u2014 he doesn't know it yet"], "significance": "Miren begins reading his traces without his knowledge."}, {"loop": 89, "label": "The Vendor", "events": ["A vendor in the Wanoon market says something", "The Hungerwings carry the rhythm of it in their wingbeat", "He hears it again three loops later", "He stops running that day and listens"], "significance": "The Hungerwings carry his voice at the threshold. Something shifts."}, {"loop": "92 (stable trace)", "label": "The Fog Keeps Him", "events": ["Nebel stable strata: first clean-edged trace", "Loop 92 is bounded, legible, present", "The fog keeps it indefinitely", "Miren will read this trace 341 loops later"], "significance": "The fog archives loop 92. He doesn't know. The archive is building."}, {"loop": 147, "label": "The Library", "events": ["First time reaching the forty-third floor", "The north window", "The bearing it faces", "The mark lines up exactly"], "significance": "He knows the window. He doesn't know what it means."}, {"loop": 214, "label": "The Forest", "events": ["First transit of the Forbidden Forest", "The Forest finds something", "He doesn't lose it \u2014 he holds harder", "He keeps the notebook"], "significance": "He learns what holding hard means. The Forest teaches him the cost of holding lightly."}, {"loop": 283, "label": "The Research", "events": ["Three research streams converge for the first time", "Timeline confirmed across three sources: four months", "Selena on the Mirror Path", "The mechanism is real"], "significance": "The first confirmation. It's not a theory anymore."}, {"loop": 343, "label": "I Believe You", "events": ["Miren in the Nebel fog", "'I believe you.'", "The fog has 341 traces of him by now", "She has been reading him for two years"], "significance": "The most important three words of the six years."}, {"loop": 389, "label": "Sub-Level Seven", "events": ["The ring retrieved", "Cold in the hand", "The entry in the Golem system remains open", "He walks back up 43 floors to the canal district"], "significance": "He has the ring. The vigil is possible now."}, {"loop": 392, "label": "The Last Loop", "events": ["He says the count: 392", "The team is assembled", "They walk south", "The fog. Afraid. He keeps going.", "Loop 392 is the last loop."], "significance": "The last time he dies in the borderland field. The vigil begins."}]</script>

function buildAtmosphere() {
  // Fog layers
  var fc = document.getElementById('fog-cont');
  for (var i = 0; i < 6; i++) {
    var f = document.createElement('div');
    var h = 30 + Math.random()*40;
    var b = Math.random()*60;
    var dur = 18 + Math.random()*25;
    var del = -(Math.random()*30);
    var op = 0.08 + Math.random()*0.12;
    f.style.cssText = 'position:absolute;width:180%;height:'+h+'%;bottom:'+b+'%;left:-40%;border-radius:50%;background:radial-gradient(ellipse,rgba(10,16,40,'+op+') 0%,transparent 60%);animation:fogD '+dur+'s ease-in-out '+del+'s infinite';
    fc.appendChild(f);
  }
  // Candles
  var cc = document.getElementById('candle-cont');
  var cpos = [{l:'6%',b:'23%'},{l:'93%',b:'23%'},{l:'18%',b:'23%'},{l:'82%',b:'23%'},{l:'38%',b:'23%'},{l:'63%',b:'23%'}];
  cpos.forEach(function(p,i) {

function loadCh(i) {
  stopAudio();
  st.ch = i;
  var c = CH[i];
  if (!c) return;
  if (i===0) unlockAch('first_chapter');
  if (i===CH.length-1) unlockAch('day_1097');
  localStorage.setItem('fc_read_'+i,'1');
  var done=0; for(var j=0;j<CH.length;j++){if(localStorage.getItem('fc_read_'+j))done++;} 
  if(done>=CH.length-1) unlockAch('all_chapters');
  var all=document.querySelectorAll('.chi');
  for(var j=0;j<all.length;j++) all[j].classList.remove('on');
  var el=document.getElementById('chi-'+i);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  document.getElementById('pl-lb').textContent=c.lb;
  document.getElementById('pl-ti').textContent=c.ti;
  var h='<div class="ch-read">';
  // Chapter heading
  h+='<div class="ch-head"><div class="ch-label-text">'+c.lb+'</div><div class="ch-title-text">'+c.ti+'</div></div>';
  // Epigraphs
  if(c.eps&&c.eps.length){
    h+='<div class="ch-read epigraphs" style="margin:0">';
    c.eps.forEach(function(ep){h+='<div class="epigraph"><p>'+ep.text+'</p>'+(ep.cite?'<cite>'+ep.cite+'</cite>':'')+'</div>';});
    h+='</div>';
  } else if(c.ep){
    h+='<div style="margin:0 0 2.5rem;padding:0 0 2rem;border-bottom:1px solid rgba(255,255,255,.07);font-style:italic;color:rgba(242,232,213,.5);font-size:.95rem;line-height:1.7">'+c.ep+'</div>';
  }
  // Main content — structured or text
  if(c.paras&&c.paras.length){
    var pIdx=0, secIdx=0;
    var secs=c.secs||[];
    c.paras.forEach(function(p,pi){
      // Insert section markers
      if(secs.length>secIdx&&pi>0&&pi%(Math.ceil(c.paras.length/(secs.length+1)))===0&&secIdx<secs.length){
        h+='<div class="sec-marker">'+secs[secIdx]+'</div>';
        secIdx++;
      }
      var cls=p.dc?'drop-cap':'';
      h+='<p id="pp'+pi+'"'+(cls?' class="'+cls+'"':'')+'>'+p.t+'</p>';
    });
  } else if(c.tx){
    var paras=(c.tx||'').split('  ').filter(function(p){return p.trim();});
    paras.forEach(function(p,pi){h+='<p id="pp'+pi+'"'+(pi===0?' class="drop-cap"':'')+'>'+p.trim()+'</p>';});
  }
  // Ledgers
  if(c.ledgers&&c.ledgers.length){
    c.ledgers.forEach(function(l){h+='<div class="ledger-box"><span class="ledger-head">Archive Record</span><p>'+l+'</p></div>';});
  }
  // Legend (sword story)
  if(c.legend&&c.legend.title){
    h+='<div class="legend-section"><div class="legend-rule">The Book of Thirteen</div>';
    h+='<div class="legend-title">'+c.legend.title+'</div>';
    if(c.legend.sub) h+='<div class="legend-sub">'+c.legend.sub+'</div>';
    if(c.legend.body) h+='<div class="legend-body">'+c.legend.body+'</div>';
    h+='</div>';
  }
  // Closing
  if(c.closing&&c.closing.title){
    h+='<div class="closing-section"><div class="legend-rule">Closing</div>';
    h+='<div class="closing-title">'+c.closing.title+'</div>';
    if(c.closing.sub) h+='<div class="closing-sub">'+c.closing.sub+'</div>';
    if(c.closing.body) h+='<div class="closing-body">'+c.closing.body+'</div>';
    h+='</div>';
  }
  h+='<div class="ch-end-mark">&#10022; &nbsp; '+c.lb+' &nbsp; &#10022;</div>';
  h+='</div>';
  var body=document.getElementById('bk-body');
  if(body){
    // Add reading controls above content
    var ctrl='<div class="read-controls">';
    ctrl+='<button class="font-btn" onclick="adjFont(-1)" title="Smaller">A&#8722;</button>';
    ctrl+='<button class="font-btn" onclick="adjFont(1)" title="Larger">A+</button>';
    ctrl+='<div class="read-progress-bar"><div class="read-progress-fill" id="ch-prog" style="width:0%"></div></div>';
    var wpm=250, words=(c.paras?c.paras.length*15:c.tx?(c.tx.split(/\s+/).length):2000);
    var mins=Math.ceil(words/wpm);
    ctrl+='<span class="reading-time">~'+mins+' min</span>';
    ctrl+='<button class="font-btn" onclick="toggleReadMode()" title="Reading mode">&#9635;</button>';
    ctrl+='</div>';
    body.innerHTML=ctrl+h;
    body.scrollTop=0;
    // Scroll progress tracking
    body.onscroll=function(){
      var pct=body.scrollHeight>body.clientHeight?body.scrollTop/(body.scrollHeight-body.clientHeight):0;
      var prog=document.getElementById('ch-prog');
      if(prog) prog.style.width=(pct*100)+'%';
      saveReadProgress(i,pct);
    };
  }
}

var CHRON_TEXT = "Before the world was, Goola dreamed.\n\nThis is the whole of the beginning. Before the world was, Goola dreamed, and the dream was the world, and the world was real because Goola dreamed it, and Goola dreamed it because the dream was real. This is the paradox at the center of everything. The world is real. The world was dreamed. Both are true.\n\nGoola dreamed the Authorities first. The quality of Judgment, that things might be weighed. The quality of Consumption, that things might be transformed. The quality of Accumulation, that things might be held. The quality of Mimicry, that things might be known from the outside. The quality of Fury, that things might be directed completely. The quality of Desire, that things might be wanted and the wanting might be real. The quality of Stillness, that things might be held in place.\n\nThen Goola dreamed the Boundary.\n\nTHE BOOK OF THE SWORDS\n\nBefore the kingdoms, the world had a wound. The wound was in the substrate. The False God had made it. The world answered with thirteen swords. Not weapons: instruments of covenant.\n\nWill given to Korren, who held the purpose. Fury given to Varkis, who committed completely. Endurance given to Liraeth, who continued past the forgiving point. Clarity given to Soren, who could not stop seeing. Harmony given to Seven of Ashen Vale. Sacrifice given to Mara. Memory given to Talen. Defiance given to Rukar. Mercy given to Elyra. Dominion given to Kael the Fifth. Renewal given to Thren. Silence given to Veyne. Eternity given to Aral, who chose permanently.\n\nTHE BOOK OF THE HEIR\n\nHe was born in the Lalaka canal district. He had the mark from birth. His mother noted the mark, burning north-and-above from the first morning. She held his arm and was quiet and then said: your name is Kola.\n\nThe loop-anomaly began on his eighteenth birthday. He died. He came back. He said the number. He kept doing this for six years. Three hundred and ninety-two times. He was afraid every time. He continued every time.\n\nOn Day 1,097 the ring fused. The fusion was not dramatic. Long processes completing are not dramatic. They are simply complete. The holding holds. The world continues.";

function loadVoices() {
  var vl = synth.getVoices();
  st.voices = [];
  for (var i = 0; i < vl.length; i++) {
    if (vl[i].lang && vl[i].lang.indexOf('en') === 0) st.voices.push(vl[i]);
  }
  var sel = document.getElementById('voice-sel');
  if (!sel) return;
  sel.innerHTML = '';
  for (var i = 0; i < st.voices.length; i++) {
    var o = document.createElement('option');
    o.value = i;
    var nm = st.voices[i].name.replace('(en-US)','').replace('(en-GB)','').trim();
    o.textContent = nm.length > 16 ? nm.slice(0,16) : nm;
    sel.appendChild(o);
  }
  var pref = ['Samantha','Daniel','Karen','Moira','Google UK','Google US'];
  for (var p = 0; p < pref.length && !st.voice; p++) {
    for (var i = 0; i < st.voices.length; i++) {
      if (st.voices[i].name.indexOf(pref[p]) >= 0) { sel.value = i; st.voice = st.voices[i]; break; }
    }
  }
  if (!st.voice && st.voices.length) st.voice = st.voices[0];
}
synth.onvoiceschanged = loadVoices;
[100,500,1500].forEach(function(d){setTimeout(loadVoices,d);});

function startAudio() {
  var body = document.getElementById('bk-body');
  var text = body ? (body.innerText || body.textContent) : '';
  if (!text) return;
  synth.cancel();
  utt = new SpeechSynthesisUtterance(text);
  if (st.voice) utt.voice = st.voice;
  utt.rate = st.rate; utt.pitch = 1;
  var wc = 0, total = text.split(/\s+/).length;
  utt.onboundary = function(e) {
    if (e.name !== 'word') return;
    wc++;
    var pct = total > 0 ? wc/total : 0;
    var fill = document.getElementById('pl-fill');
    if (fill) fill.style.width = (pct*100)+'%';
    var s = Math.floor(wc/Math.max(st.rate*2.5,1));
    var t = document.getElementById('pl-time');
    if (t) t.textContent = Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    if (body && e.charIndex !== undefined) {
      var ci = e.charIndex, ps = body.querySelectorAll('p'), cum = 0;
      for (var pi = 0; pi < ps.length; pi++) {
        var l = (ps[pi].textContent||'').length;
        if (ci >= cum && ci < cum+l) {
          for (var pj=0;pj<ps.length;pj++) ps[pj].classList.remove('reading-hl');
          ps[pi].classList.add('reading-hl');
          ps[pi].scrollIntoView({behavior:'smooth',block:'center'});
          break;
        }
        cum += l+1;
      }
    }
  };
  utt.onend = function() {
    st.playing = false;
    var btn = document.getElementById('pl-play');
    if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('playing'); }
    if (body) { var ps=body.querySelectorAll('p'); for(var i=0;i<ps.length;i++) ps[i].classList.remove('reading-hl'); }
    if (st.ch < CH.length-1) setTimeout(function(){loadCh(st.ch+1);setTimeout(startAudio,800);},400);
  };
  utt.onerror = function() { st.playing = false; };
  synth.speak(utt);
  st.playing = true;
  var btn = document.getElementById('pl-play');
  if (btn) { btn.innerHTML = '&#9646;&#9646;'; btn.classList.add('playing'); }
}

function stopAudio() {
  synth.cancel(); st.playing = false;
  var btn = document.getElementById('pl-play');
  if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('playing'); }
  var fill = document.getElementById('pl-fill');
  if (fill) fill.style.width = '0%';
  var t = document.getElementById('pl-time');
  if (t) t.textContent = '0:00';
  var ps = document.querySelectorAll('.reading-hl');
  for (var i = 0; i < ps.length; i++) ps[i].classList.remove('reading-hl');
}

function unlockAch(id, condition) {

// ─── ENCYCLOPEDIA HELPERS ─────────────────────────────────────
function parseMD(text, accent) {
  var AT2 = AT;
  var lines = text.split('\n');
  var out = '';
  lines.forEach(function(line) {
    var parsed = parseLinks(line, accent);
    if (line.indexOf('### ') === 0) {
      out += '<div style="font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:'+accent+';margin:2rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid '+accent+'22">'+parseLinks(line.slice(4),accent)+'</div>';
    } else if (line.indexOf('## ') === 0) {
      out += '<div style="font-family:Cinzel,serif;font-size:.85rem;color:var(--ivory);font-weight:600;margin:1.75rem 0 .6rem">'+parseLinks(line.slice(3),accent)+'</div>';
    } else if (line.indexOf('- ') === 0 || line.indexOf('\u2022 ') === 0) {
      out += '<div style="display:flex;gap:.6rem;margin-bottom:.35rem"><span style="color:'+accent+';font-size:.58rem;margin-top:.5rem;flex-shrink:0">&#9670;</span><div style="font-size:.98rem;line-height:1.8;color:var(--dim)">'+parseLinks(line.slice(2),accent)+'</div></div>';
    } else if (line.trim() === '') {
      out += '<div style="height:.4rem"></div>';
    } else if (line.indexOf('\u2192') === 0 || line.indexOf('-> ') === 0) {
      out += '<div style="color:'+accent+';font-family:Cinzel,serif;font-size:.6rem;margin-top:2rem;padding:.6rem .85rem;border:1px solid '+accent+'28;border-radius:4px;background:'+accent+'06">'+parsed+'</div>';
    } else if (line.trim()) {
      out += '<p style="font-size:.98rem;line-height:1.88;color:var(--dim);margin-bottom:.4rem">'+parsed+'</p>';
    }
  });
  return out;
}

function parseLinks(text, accent) {
  return text.replace(/\{\{([^|]+)\|(\w+)\}\}/g, function(m, name, type) {
    var at = AT[type]||AT.concept;
    return '<span class="enc-link" style="color:'+at.c+'" onclick="openArcArt(\''+name.replace(/'/g,"\\'")+'\',' + "'" + type + "'" + ')">'+name+'</span>';
  });
}

function loadingHTML(label) {
  var lines = [88,70,80,65,75,60];
  var bars = lines.map(function(w,i){return '<div class="ld-line" style="width:'+w+'%;animation-delay:'+(i*.12)+'s"></div>';}).join('');
  return '<div style="padding:1.5rem 0"><div style="display:flex;align-items:center;margin-bottom:1.25rem"><div class="spin"></div><span style="color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase">Consulting the Archive'+(label?': '+label:'')+'&hellip;</span></div>'+bars+'</div>';
}

async function callAI(prompt, cb) {
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2048,messages:[{role:'user',content:prompt}]})
    });
    var d = await r.json();
    cb(d.content && d.content[0] ? d.content[0].text : 'Content unavailable.');
  } catch(e) { cb('Unable to reach the Archive. Please check your connection.'); }
}

function attachMapHandlers() {
  var regions = document.querySelectorAll('.km-region');
  regions.forEach(function(el) {
    el.addEventListener('click', function() {
      showMapKingdom(this.getAttribute('data-kid'));
    });
    el.addEventListener('mouseenter', function() {
      this.style.filter = 'brightness(1.6)';
    });
    el.addEventListener('mouseleave', function() {
      if (!this.classList.contains('active')) this.style.filter = '';
    });
  });
}

function showMapKingdom(kid) {
  var k = null;
  for (var i=0;i<KM.length;i++){if(KM[i].id===kid){k=KM[i];break;}}
  if (!k) return;
  document.querySelectorAll('.km-region').forEach(function(el){el.style.filter='brightness(.7)';el.classList.remove('active');});
  var sel = document.getElementById('map-km-'+kid);
  if (sel) {sel.style.filter='brightness(2) drop-shadow(0 0 6px '+k.accent+')';sel.classList.add('active');}
  var info = document.getElementById('map-info');
  if (!info) return;
  var h = '<div style="border:1px solid '+k.accent+'38;border-radius:4px;padding:.85rem 1rem;background:'+hexRgba(k.accent,.07)+'">';
  h += '<div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem">';
  h += '<span style="font-size:1.5rem;color:'+k.accent+'">'+k.sym+'</span>';
  h += '<div><div style="font-family:Cinzel,serif;font-size:.82rem;color:var(--ivory)">'+k.name+'</div>';
  h += '<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:'+k.accent+'">'+k.auth+' &bull; Pop. '+k.pop+'</div></div></div>';
  h += '<p style="font-size:.88rem;color:var(--dim);line-height:1.65;margin-bottom:.65rem">'+k.desc+'</p>';
  h += '<div style="display:flex;gap:.4rem;flex-wrap:wrap">';
  h += '<button onclick="openSec(\'atlas\');setTimeout(function(){openKm(\''+kid+'\');},250)" style="background:'+hexRgba(k.accent,.12)+';border:1px solid '+hexRgba(k.accent,.4)+';color:'+k.accent+';font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.08em;padding:.3rem .65rem;border-radius:3px;cursor:pointer">Kingdom Page &#8594;</button>';
  h += '<button onclick="openSec(\'atlas\');setTimeout(function(){openKm(\''+kid+'\');setTimeout(function(){openKmSec(\''+kid+'\',0);},150);},250)" style="background:rgba(255,255,255,.03);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.3rem .65rem;border-radius:3px;cursor:pointer">Encyclopedia</button>';
  h += '</div></div>';
  info.innerHTML = h;
}

// READING PROGRESS

function saveReadProgress(chIdx, scrollPct) {
  if (!CH[chIdx]) return;
  var title = CH[chIdx].lb + ': ' + CH[chIdx].ti;
  localStorage.setItem('fc_progress', JSON.stringify({ch:chIdx, scroll:scrollPct||0, title:title}));
}

function continueReading() {
  var p = JSON.parse(localStorage.getItem('fc_progress')||'null');
  if (!p) return;
  openSec('chronicle');
  setTimeout(function(){
    loadCh(p.ch||0);
    if (p.scroll) setTimeout(function(){
      var b=document.getElementById('bk-body');
      if (b) b.scrollTop = p.scroll*(b.scrollHeight-b.clientHeight);
    },350);
  },220);
}

function checkContinueReading() {
  var p = JSON.parse(localStorage.getItem('fc_progress')||'null');
  var btn=document.getElementById('continue-btn');
  var lbl=document.getElementById('continue-label');
  if (p&&p.title&&btn&&lbl) {
    lbl.textContent = p.title;
    btn.style.display='block';
  }
}

// ─────────────────────────────────────────────────────────────
// BOOKMARKS
// ─────────────────────────────────────────────────────────────
function getBM(){return JSON.parse(localStorage.getItem('fc_bm')||'[]');}
function saveBM(bm){localStorage.setItem('fc_bm',JSON.stringify(bm));}

function addBM(type,id,title,section){
  var bm=getBM();
  if (bm.find(function(b){return b.type===type&&String(b.id)===String(id);})) return;
  bm.unshift({type:type,id:id,title:title,section:section,ts:Date.now()});
  saveBM(bm);
  showAchToast({icon:'&#128278;',title:'Bookmarked'});
  updateBmBtn(type,id);
}

function removeBM(type,id){
  saveBM(getBM().filter(function(b){return !(b.type===type&&String(b.id)===String(id));}));
  updateBmBtn(type,id);
  if (st.sec==='bookmarks') renderBookmarksList();
}

function toggleBM(){
  var bm=getBM();
  var ex=bm.find(function(b){return b.type==='chapter'&&b.id===st.ch;});
  if (ex) removeBM('chapter',st.ch);
  else addBM('chapter',st.ch,CH[st.ch].lb+': '+CH[st.ch].ti,'chronicle');
}

function updateBmBtn(type,id){
  var btn=document.getElementById('bm-toggle');
  if (!btn) return;
  var active=getBM().find(function(b){return b.type==='chapter'&&b.id===st.ch;});
  btn.innerHTML=active?'&#128278;':'&#128279;';
  btn.classList.toggle('active',!!active);
}

function buildBookmarks(){
  var el=document.getElementById('sec-bookmarks');
  el.innerHTML='<div class="sec-head"><div class="sec-title">Bookmarks</div><div class="sec-sub">Saved Entries</div></div><div class="sec-body" id="bm-body"></div>';
  renderBookmarksList();
}

function renderBookmarksList(){
  var b=document.getElementById('bm-body');
  if (!b) return;
  var bm=getBM();
  if (!bm.length){b.innerHTML='<div style="text-align:center;padding:3rem 1rem;color:var(--faint);font-style:italic;font-family:EB Garamond,Georgia,serif;font-size:1rem">No bookmarks yet.<br>Tap &#128279; in the Chronicle to save a chapter.</div>';return;}
  var h='<div style="font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.75rem">'+bm.length+' saved</div>';
  bm.forEach(function(bk){
    var icon=bk.type==='chapter'?'&#128214;':bk.type==='character'?'&#128101;':'&#128218;';
    h+='<div class="bm-item">';
    h+='<span class="bm-icon">'+icon+'</span>';
    h+='<div onclick="goToBM(\''+bk.type+'\',\''+bk.id+'\')" style="flex:1;cursor:pointer"><div style="font-family:Cinzel,serif;font-size:.68rem;color:var(--ivory);line-height:1.35">'+bk.title+'</div><div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:.1rem">'+bk.type+'</div></div>';
    h+='<button class="bm-del" onclick="removeBM(\''+bk.type+'\',\''+bk.id+'\')">&#10005;</button>';
    h+='</div>';
  });
  b.innerHTML=h;
}

function goToBM(type,id){
  if (type==='chapter'){openSec('chronicle');setTimeout(function(){loadCh(parseInt(id));},220);}
  else if (type==='character'){openSec('characters');setTimeout(function(){openChar(id);},220);}
}

var searchIdx=null;

function buildSearchIdx(){
  searchIdx=[];
  CH.forEach(function(c,i){searchIdx.push({type:'Chapter',title:c.lb+': '+c.ti,body:c.tx.slice(0,300),go:function(){openSec('chronicle');setTimeout(function(){loadCh(i);},220);}});});
  CHARS.forEach(function(c){searchIdx.push({type:'Character',title:c.name,body:c.bio,go:function(){openSec('characters');setTimeout(function(){openChar(c.id);},220);}});});
  KM.forEach(function(k){searchIdx.push({type:'Kingdom',title:k.name,body:k.desc,go:function(){openSec('atlas');setTimeout(function(){openKm(k.id);},220);}});});
  CREATURES.forEach(function(c,i){searchIdx.push({type:'Creature',title:c.name,body:c.desc,go:function(){openSec('creatures');setTimeout(function(){openCreature(i);},220);}});});
  SWORDS.forEach(function(s,i){searchIdx.push({type:'Sword',title:s.name+' — '+s.bearer,body:s.lore,go:function(){openSec('swords');setTimeout(function(){openSword(i);},220);}});});
}

function buildSearch(){
  var el=document.getElementById('sec-search');
  el.innerHTML='<div class="sec-head"><div class="sec-title">Search</div><div class="sec-sub">The Archive Remembers All</div></div><div class="sec-body"><input id="search-input" type="text" placeholder="Search chapters, characters, kingdoms&hellip;" autocomplete="off" autocorrect="off"><div id="search-results" style="margin-top:.75rem"></div></div>';
  if (!searchIdx) buildSearchIdx();
  var inp=document.getElementById('search-input');
  inp.addEventListener('input',function(){doSearch(this.value);});
  inp.focus();
}

function doSearch(q){
  var res=document.getElementById('search-results');
  if (!res) return;
  q=(q||'').trim();
  if (q.length<2){res.innerHTML='<div style="text-align:center;padding:2rem;color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase">Begin typing to search</div>';return;}
  var ql=q.toLowerCase();
  var hits=searchIdx.filter(function(item){return item.title.toLowerCase().indexOf(ql)>=0||item.body.toLowerCase().indexOf(ql)>=0;}).slice(0,24);
  if (!hits.length){res.innerHTML='<div style="text-align:center;padding:2rem;color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase">No results for &ldquo;'+q+'&rdquo;</div>';return;}
  var h='<div style="font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.5rem">'+hits.length+' results</div>';
  hits.forEach(function(r){
    var hi=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    var excerpt=r.body.replace(hi,'<mark style="background:rgba(201,168,76,.25);color:var(--ivory)">$1</mark>').slice(0,130);
    h+='<div class="search-result" data-idx="'+searchIdx.indexOf(r)+'"><div class="search-result-type">'+r.type+'</div><div class="search-result-title">'+r.title.replace(hi,'<mark style="background:rgba(201,168,76,.25);color:var(--ivory)">$1</mark>')+'</div><div class="search-result-desc">'+excerpt+'&hellip;</div></div>';
  });
  res.innerHTML=h;
  res.querySelectorAll('.search-result').forEach(function(el){
    var idx=parseInt(el.getAttribute('data-idx'));
    el.onclick=function(){if(searchIdx[idx])searchIdx[idx].go();};
  });
}

{cat:'chronicle',era:'ancient',status:'ancient',km:null,title:'What the Chronicle Does',source:'First Scribe record, Year 0',text:'The Chronicle records. The recording is the purpose. The purpose does not require the recorded events to be bearable. The Chronicle has recorded unbearable things. The Chronicle will record more.',interp:"Written by the First Scribe on the day the Library opened. The shortest entry in the Chronicle's history and the most frequently quoted by subsequent Scribes.",chars:[],events:['The Library','The Chronicle'],loops:[]},
{cat:'chronicle',era:'ancient',status:'fulfilled',km:null,title:'The Wound Does Not Bleed Equally',source:'Chronicle annotation, undated — believed pre-Year 200',text:"The False God's wound does not bleed equally. It bleeds hardest through institutions that have forgotten their purpose. The institution remembers the procedure and forgets the reason.",interp:"The Second Great War begins in Yowwed when the guards forget the reason for the watching. The wound found the forgetting immediately.",chars:[],events:['Second Great War','Yowwed'],loops:[]},
{cat:'chronicle',era:'ancient',status:'ancient',km:null,title:'Before the Beginning',source:'Book of Beginning, first verse',text:'Before the world was, Goola dreamed. This is the whole of the beginning. The world was real because Goola dreamed it, and Goola dreamed it because the dream was real.',interp:"The paradox at the center of the Chronicle. The world is real and the world was dreamed. Both are true. The Chronicle records both as true and lets the recording stand.",chars:[],events:['The First Dreaming'],loops:[]},
{cat:'chronicle',era:'kingdom',status:'pending',km:null,title:'The Seventh Fragment',source:'Chronicle annotation, Scribe Eighteen — restricted',text:"The fragments will be distributed. The one who heals the wound will integrate all seven. The integration will not be an act of power. It will be an act of recognition.",interp:"Seven Authority fragments distributed at the end of the Second Great War. Jhara integrates all seven — not by force, but by recognition. She was already carrying all seven from birth.",chars:["Jhara Kola'rin"],events:['Fragment Distribution','The Healing'],loops:[]},
{cat:'chronicle',era:'second-war',status:'fulfilled',km:null,title:'What Scribe Twenty-Three Reads First',source:'Scribe Eighteen, restricted specification',text:'She will read this specification before she rises from the table on the morning of her coming of age. She will know, before she stands, whose name is the anchor. She will stand anyway.',interp:"Jhara Kola'rin became Scribe Twenty-Three on the morning of her coming of age. She read the specification and understood what was required. She rose from the table. She did not return to sit down again for the rest of her life.",chars:["Jhara Kola'rin"],events:["Jhara's Coming of Age"],loops:[]},
{cat:'lalaka',era:'kingdom',status:'fulfilled',km:'lalaka',title:'Sub-Level Seven Is Sealed',source:"Senior Archivist Record, Year 301 — Crystal's authorization on file",text:"Sub-level seven is sealed. The reason for the sealing will not be clear for 160 years. The reason is this: it is not time yet. When it is time, the heir will retrieve what is inside.",interp:"The ring was placed in sub-level seven in Year 301 and retrieved in loop 389. 160-year review pending throughout. Seventeen requests for status update: all returned 'pending review.' The response was accurate.",chars:['Crystal','Kola Baru'],events:['Sub-Level Seven','Loop 389'],loops:['Loop 389']},
{cat:'lalaka',era:'kingdom',status:'open',km:'lalaka',title:'The Entry That Cannot Be Closed',source:'Tome Golem commercial district unit, Entry 4471-B — open since Year 197',text:"Entity with non-standard temporal signature. Classification: ongoing. The entry cannot be closed. The entry will not be closable until the entity's temporal signature resolves. This may take a very long time.",interp:"263 years open. Subject: Leiren Thorne. The Golem Upgrade Act of Year 392 was designed to resolve the entry. The Golem rejected the upgrade six times. Conclusion: the Golem is not malfunctioning. It is doing something the current classification system cannot describe.",chars:['Leiren Thorne'],events:['Golem Upgrade Act'],loops:[]},
{cat:'lalaka',era:'kingdom',status:'fulfilled',km:'lalaka',title:'The Beginning of the Record',source:'First Archivist Caelen Morra, Year 0 — founding statement',text:'We begin. What is kept from this moment forward will be kept permanently. Everything before this moment was kept by those who came before. We are keeping what comes next.',interp:"The founding statement of the Library. The Library has kept what came next for 460 years. It kept Kola's loops. It kept the stable trace records. It kept sub-level seven sealed at the exact right time.",chars:[],events:['Library Founded'],loops:[]},
{cat:'lalaka',era:'kingdom',status:'fulfilled',km:'lalaka',title:'The Deterrent That Has Never Been Tested',source:'Golem Compact foundational document, Year 44',text:"Destroying a Golem destroys the destroyer's own records in that Golem's memory. No one has tested this. The deterrent has held for 460 years without being tested. A deterrent that has never been tested is proof that it does not need to be.",interp:"847 Tome Golems. 460 years. Zero destructions. Every kingdom's classified documents exist in Golem memory alongside everyone else's. The alignment has been sufficient. Permanent.",chars:[],events:['Golem Compact'],loops:[]},
{cat:'lalaka',era:'kingdom',status:'fulfilled',km:'lalaka',title:'The Botanical Correction',source:'Archivist pending review file, Year 407 — submitted by Rorin Fenne',text:"A correction to the Year 280 botanical catalogue altitude sickness section. It will be reviewed. The correction will be accepted the year after the vigil's completion. 181 years of wrong treatment will end.",interp:"Rorin submitted the correction in Year 407 and was consumed by the Forest before it was reviewed. It was accepted in Year ~464. The person who identified the error did not live to see the acceptance.",chars:['Rorin Fenne'],events:['The Forest','Botanical Correction'],loops:[]},
{cat:'yowwed',era:'kingdom',status:'fulfilled',km:'yowwed',title:'The Crystal Seat Is a Seat of Witnessing',source:'Judgment Council founding document, Year 0',text:'The Crystal Seat is not a seat of power. It is a seat of witnessing. The holder witnesses. The witnessing is the function. When the witnessing fails, the function fails.',interp:"Year 0 through Year ~515: the Crystal Seat's function held. Year ~515: the guards watched and did not act. The witnessing failed through institutional drift that had been accumulating for years before the assassination.",chars:[],events:['Crystal Seat','Second Great War'],loops:[]},
{cat:'yowwed',era:'second-war',status:'fulfilled',km:'yowwed',title:'The Weight of Not-Acting',source:'Judgment Council Record, undated annotation — found in Year ~510',text:'What the guards do not do on the day of the assassination will begin a war. The not-doing is the act. Judgment records the not-doing as an act. This is not metaphor. This is the function of Judgment.',interp:"The guards present. Watching. Not moving. The Judgment Authority's quality applies to not-acting with equal force. The weight of the not-acting on that day triggered the Second Great War.",chars:[],events:['Crystal Candidate Assassination','Second Great War'],loops:[]},
{cat:'yowwed',era:'ancient',status:'ancient',km:'yowwed',title:'The Weight Is Permanent',source:'First Archivist of Yowwed, Year 0',text:'Every act has weight. The weight of not-acting is not zero. This is the most important thing the kingdom knows and the most frequently forgotten. The forgetting is an act. The act has weight.',interp:"Referenced 847 times in the 460-year Judgment record. The most quoted sentence in the Yowwed archive. The forgetting it describes happened anyway.",chars:[],events:['Yowwed Founding'],loops:[]},
{cat:'yowwed',era:'kingdom',status:'fulfilled',km:'yowwed',title:'The Fixed Currency',source:'Yowwed Economic Council founding decree, Year 0',text:"The currency will not fluctuate. A currency that fluctuates admits the world's value is uncertain. The world's value is not uncertain. It is permanently what it is.",interp:"The Solar has been fixed at exactly 500 since Year 0. Never fluctuated. Internally consistent with Judgment theology: every act has a fixed weight.",chars:[],events:['Yowwed Currency'],loops:[]},
{cat:'nebel',era:'ancient',status:'ancient',km:'nebel',title:'The Fog Reads Without Being Asked',source:'Fog Archive founding record, Year 0',text:'The fog has been reading the world since before the first kingdom. The fog will be reading the world after the last kingdom. The reading continues regardless of whether anyone asks for it.',interp:"The Nebel fog-reading tradition is the world's oldest continuously documented knowledge-keeping system. The fog does not ask whether the knowledge is useful.",chars:[],events:['Fog Archive'],loops:[]},
{cat:'nebel',era:'kingdom',status:'fulfilled',km:'nebel',title:'The Heart Remembers You Well',source:'Veiled Hearts founding document, Year 0',text:'To know things from the outside is not deception. It is the accurate reading of what is expressed. The heart remembers you well. This is the greeting. This is also the function.',interp:"The Veiled Hearts operate on this principle: accurate reading of expressed information, not manipulation. The greeting is theologically accurate.",chars:[],events:['Veiled Hearts Founded'],loops:[]},
{cat:'nebel',era:'kingdom',status:'ancient',km:'nebel',title:'What the Sprites Maintain',source:'Mist Sprite correspondence — received by Fog Reader Tael, Year 312',text:'The Sprites do not communicate. They maintain. The maintenance is a form of communication that does not require a receiver. The maintenance continues whether or not anyone is reading.',interp:"Fog Reader Tael spent four years attempting to establish communication with the Sprites. Final assessment: there is no communication to establish. There is only the maintenance.",chars:[],events:['Mist Sprites'],loops:[]},
{cat:'halak',era:'kingdom',status:'fulfilled',km:'halak',title:'Day One',source:'Still City Record, Year approximately 460, Day 1 of the vigil',text:"He put on the ring on Day One. He did not remove it for 1,097 days. The ring did not let him forget what he was holding. This is the ring's function.",interp:"The ring waited in sub-level seven for 160 years. He retrieved it in loop 389. He put it on at the entrance to sub-level seven on Day One. The ring was cold.",chars:['Kola Baru'],events:['Day One','The Vigil'],loops:['Loop 392']},
{cat:'halak',era:'ancient',status:'ancient',km:'halak',title:'Stillness Is the Presence',source:'Still City founding statement, Year 0 — attributed to the First Watcher',text:'Stillness is not the absence of movement. Stillness is the presence of the holding. The distinction is everything. A person who has confused the two is holding nothing.',interp:"The theological distinction that defines Halak. Applied to the Boundary: it is still not because nothing is moving but because something is being held with complete attention.",chars:[],events:['Halak Founding'],loops:[]},
{cat:'halak',era:'kingdom',status:'fulfilled',km:'halak',title:'The Watchers Watch',source:'Silent Watchers founding record, Year 0',text:'We watch. We do not intervene. The watching is the intervention of the specific kind the vigil requires. The watching is not absence of support. It is the specific support that looks like absence.',interp:"The Silent Watchers have maintained vigil-watches for 460 years. The vigil-holder knows they are present. This knowledge is the support. Its form is silence.",chars:[],events:['Silent Watchers'],loops:[]},
{cat:'wanoon',era:'ancient',status:'ancient',km:'wanoon',title:'Give All of It',source:'Flame Vanguard founding oath, Year 0',text:'We give all of it. There is no portion held back. The held-back portion is not safety. It is the reason the direction was not reached. We do not hold back. This is the oath.',interp:"The Flame Vanguard founding oath, recited every morning for 460 years. The clause about the held-back portion was inserted after three years of observing that half-committed operations failed at 100%.",chars:[],events:['Flame Vanguard Founded'],loops:[]},
{cat:'wanoon',era:'burning-heir',status:'fulfilled',km:'wanoon',title:'The Hungerwings Carry What Was Said',source:'Vanguard Registry Entry, Loop 89 — transcribed from atmospheric record',text:"The sound the trainer's cracked horn made in Year 261 has been transmitted student-to-student for 200 years. The birds are not responding to commands. They are responding to an invitation.",interp:'Loop 89: a vendor said something. The Hungerwings flying overhead carried the rhythm of it in their wingbeats. Kola stopped running. He listened. Something shifted.',chars:['Kola Baru'],events:['Loop 89','Hungerwings'],loops:['Loop 89']},
{cat:'wanoon',era:'kingdom',status:'fulfilled',km:'wanoon',title:'The Vanguard Will Not Fight in the Vigil',source:"Vanguard Record, Year 392 — Vanguard Commander's note",text:'The Flame Vanguard will not fight in the vigil. This is not passivity. The vigil is the battle. The battle requires a different kind of soldier: one who holds instead of strikes.',interp:"The Vanguard did not intervene in the vigil or its approach. The vigil required the heir to hold without military support. The holding was the whole of the battle.",chars:['Kola Baru'],events:['The Vigil'],loops:[]},
{cat:'wanoon',era:'kingdom',status:'ancient',km:'wanoon',title:'Thirty-One Words',source:'Wanoon Linguistic Registry, Year 0',text:'We have thirty-one words for commitment. We have no word for hesitation. This is not a coincidence. This is the record of what the kingdom decided was worth naming.',interp:"The most precise commitment vocabulary of any language in the eight kingdoms. The absence of a word for hesitation is documented as deliberate.",chars:[],events:['Wanoon Language'],loops:[]},
{cat:'zhala',era:'ancient',status:'ancient',km:'zhala',title:'The Wanting Is Real',source:'Offering Bowl dedication text, Year 0',text:'The wanting is real. The wanting is received. The wanting is witnessed. The Desire Authority does not give you what you want. It witnesses the wanting as real. The knowing that the wanting is real: this is what it gives back.',interp:"The theology of Zhala. The offering bowl has been touched by thousands of hands across a thousand years. The bowl receives. The bowl has never given anything back. This is not the bowl's failure. This is the bowl's function.",chars:[],events:['Offering Bowl','Zhala Founding'],loops:[]},
{cat:'zhala',era:'burning-heir',status:'fulfilled',km:'zhala',title:'Took You Long Enough',source:"Chronicle annotation — Lyra's entry, Year approximately 460",text:"She had been standing at the threshold of the inside for twelve years. She had watched two mechanisms from the outside. She said: took you long enough. This was the decision.",interp:'Lyra waited twelve years at the threshold. This time she walked in. The Boundary holds with her warmth in it.',chars:['Lyra','Kola Baru'],events:['Team Assembly'],loops:[]},
{cat:'zhala',era:'ancient',status:'ancient',km:'zhala',title:'The Demon Bloodlines Know the Depth',source:'Zhala theological record, undated',text:'The bloodlines closest to the Authority know the wanting at its full depth. They know this is not a blessing. They know it is not a curse. They know it is simply what is true about them.',interp:"Lyra and Veyra carry the demon bloodline — Authority-adjacent, the Desire quality present at a depth most people do not experience. The record notes: they were neither privileged nor burdened. They were informed.",chars:['Lyra','Veyra'],events:[],loops:[]},
{cat:'zhala',era:'burning-heir',status:'fulfilled',km:'zhala',title:'The Geometry Was Hers',source:"Chronicle annotation — Veyra's entry, Year approximately 460",text:'She made the two-finger gesture on Day 98 with no one to receive it. She made it correctly. She held position. Her sister arrived. The geometry was hers.',interp:"Day 98. Veyra was alone. She made the gesture anyway. Lyra arrived. The Boundary holds with her geometry in it — the quality of doing the thing correctly even with no one present to confirm it.",chars:['Veyra','Lyra'],events:['Day 98'],loops:[]},
{cat:'laba',era:'ancient',status:'ancient',km:'laba',title:'What the Forest Takes Continues',source:'Devourer Clan oral record — transcribed Year 0',text:'What the Forest takes continues in the Forest. This is not comfort. This is accurate. Nothing is lost in the consuming.',interp:"Rorin Fenne was consumed by the Forest. His botanical knowledge, his archive work, his tea at the right proportions for three nights — the Forest has all of it. It continues in a form that is the Forest.",chars:['Rorin Fenne'],events:['The Forest'],loops:[]},
{cat:'laba',era:'kingdom',status:'ancient',km:'laba',title:'The Mnemovores Do Not Attack',source:'Forest Compact negotiation record, Year 89',text:'The Mnemovores do not attack. They assess. They find what you are not holding at the full grip. They reveal this to you by taking it. The revelation is their function.',interp:"They find the slightly-abandoned architecture, the portion given less attention — and take it. The taking reveals the quality of the holding.",chars:['Rorin Fenne'],events:['Mnemovores','Forbidden Forest'],loops:[]},
{cat:'laba',era:'kingdom',status:'ancient',km:'laba',title:'The Forest Signed Nothing',source:"Grand Neutrality Compact, Year 187 — margin note by lead Lalaka archivist",text:'All eight kingdoms signed. The Forest signed nothing. The Forest does not sign things. The Forest simply is. The Compact protects the kingdoms from the Forest. The Forest requires no protection from the kingdoms.',interp:"The eight-kingdom Compact of Year 187 included the Forbidden Forest within its scope. The Forest has honored the Compact in the sense that it has continued to simply be without expanding.",chars:[],events:['Forbidden Forest','Grand Neutrality Compact'],loops:[]},
{cat:'clevel',era:'ancient',status:'ancient',km:'clevel',title:'The Paths Were Found, Not Made',source:'Mirror Path Registry, Year 0',text:'Fourteen paths. Material unidentified. After 460 years. The paths were not made by us. They were not made for us. They were found. We use them anyway. This is the whole of the borderland philosophy.',interp:"The Mirror Paths predate human settlement of Clevel. The material has resisted 460 years of identification. The Clevel position: origin is irrelevant, function is real, use is the response to function.",chars:[],events:['Mirror Paths'],loops:[]},
{cat:'clevel',era:'kingdom',status:'fulfilled',km:'clevel',title:'Who Looks Away',source:'Mirror Path maintenance record, Year 250 — 90-year data summary',text:"We have noted who looks at their reflection and who looks away. Ninety years of data. Those who look away do not reach the top. This is not punishment. It is information.",interp:"Selena crossed looking at her reflection for the entire crossing. She did not look away. She was going to finish her translation. She set it aside. She delivered the sentence.",chars:['Selena'],events:['Mirror Path','The Sentence'],loops:[]},
{cat:'clevel',era:'kingdom',status:'fulfilled',km:'clevel',title:'Page Sixty-Two',source:"Chronicle annotation — Selena's entry, Year approximately 460",text:'She was going to finish the translation. She got to page sixty-two. She stayed twelve days. She delivered the sentence. The world finished it.',interp:"Selena's translation was at page sixty-two when she joined the research. She set it aside. The sentence she delivered contained the Founding-Era grammatical structure that made the mechanism work.",chars:['Selena'],events:['The Sentence','Mechanism'],loops:[]},
{cat:'clevel',era:'ancient',status:'ancient',km:'clevel',title:'Whoever Reaches It First',source:'Clevel founding document, Year 0',text:'Whoever reaches the position first has the authority. This is not a metaphor for merit. It is a direct statement about positions and who holds them.',interp:"The whole of Clevel governance. No bloodline succession. No election. The Reaching Council has governed by this principle for 460 years.",chars:[],events:['Clevel Founding'],loops:[]},
{cat:'ancient',era:'ancient',status:'ancient',km:null,title:'The Knight Stood Before the Tower',source:'The Feathered Chronicle, Book of the Boundary',text:'I stood before the Tower. The ring asked what I would give. I gave my bloodline. I did not know what that meant at the time. I know now.',interp:"The Knight who stood before the Tower Without End approximately 3,000 years before the vigil. The ring accepted the bloodline and waited twenty-eight generations. Kola Baru is the twenty-eighth generation.",chars:['Kola Baru'],events:['The Knight','Tower Without End'],loops:[]},
{cat:'ancient',era:'ancient',status:'fulfilled',km:null,title:'The Wound Is Below the Pointing-At Level',source:'Chronicle annotation, pre-kingdom era',text:"The wound was made at a depth below the geological, below the atmospheric, below the biological. It bleeds upward through all three. The bleeding is the grief with no source. The pain with no wound to point to.",interp:"The False God's wound in the world's substrate. Five thousand years of its effects. The wound became smaller after Day 1,097. It healed when Jhara named the false god.",chars:[],events:['The Wound','False God'],loops:[]},
{cat:'ancient',era:'ancient',status:'ancient',km:null,title:'Leiren Does Not Die at the Shrine',source:'Chronicle, Book of the Shattered One',text:'The one who walks into the shrine and is stabbed will not die. The one who stabs them will tell them where to find the architect. The stabber will not decide to tell. He will simply tell.',interp:"Leiren was stabbed by Jorin, 27 years old, who had been a good person. They did not die. Jorin told them where Crystal's camp was without deciding to. He relit the candles. He sat with them.",chars:['Leiren Thorne','Crystal'],events:['The Shrine'],loops:[]},
{cat:'loops',era:'burning-heir',status:'fulfilled',km:null,title:'Loop 89 — The Vendor',source:'Fog Archive atmospheric record, Loop 89',text:'In the market. The vendor says something. The Hungerwings carry the rhythm of it in their wingbeats. He stops running. He listens. Something shifts.',interp:"Loop 89 is the first loop in which Kola stops moving toward the mechanism and simply stands still to listen. The fog archive classifies it as a change-of-state loop.",chars:['Kola Baru'],events:['Loop 89'],loops:['Loop 89']},
{cat:'loops',era:'burning-heir',status:'fulfilled',km:null,title:'Loop 214 — The Forest Finds Nothing',source:'Fog Archive atmospheric record, Loop 214',text:'He entered the Forbidden Forest in loop 214 and came back. He had been holding everything at the full grip. The Mnemovores found nothing at the edges. He came back knowing what holding hard means.',interp:"The first loop in which Kola exits the Forest without loss. He held everything. He learned the difference between holding and holding hard.",chars:['Kola Baru'],events:['Forbidden Forest'],loops:['Loop 214']},
{cat:'loops',era:'burning-heir',status:'fulfilled',km:null,title:'Loop 283 — Three Sources Converge',source:'Lalaka archive record, Loop 283',text:'Three research streams converge for the first time. Timeline confirmed across three sources: four months. The mechanism is real. This is the first loop in which the mechanism is confirmed as real.',interp:"Before loop 283: theory. After loop 283: confirmed. The mechanism required confirmation before it could be built.",chars:['Kola Baru','Selena'],events:['Loop 283','Mechanism Research'],loops:['Loop 283']},
{cat:'loops',era:'burning-heir',status:'fulfilled',km:null,title:'Loop 389 — Sub-Level Seven',source:'Lalaka archive record, Loop 389 — Golem entry automatically updated',text:"He went down forty-three floors into the sub-levels. He retrieved the ring from sub-level seven. The ring was cold in the hand. He walked back up forty-three floors to the canal district. The Golem entry updated automatically: contents removed.",interp:"The ring was in sub-level seven for approximately 160 years before loop 389. The Golem entry updated without human authorization. It had been waiting to update.",chars:['Kola Baru'],events:['Sub-Level Seven','Ring Retrieved'],loops:['Loop 389']},
{cat:'loops',era:'burning-heir',status:'fulfilled',km:null,title:'Loop 343 — I Believe You',source:'Nebel stable strata record, Loop 343',text:'In the fog. He said: I have done this 343 times. She said: I believe you. This is the loop in which the team became possible.',interp:"Loop 343. The team required a fog-reader who had already read him 341 times and would say, without qualification, I believe you. Miren was the fog-reader. The loop is permanently archived.",chars:['Kola Baru','Miren'],events:['Loop 343'],loops:['Loop 343']},
{cat:'restricted',era:'second-war',status:'pending',km:null,title:'The One Who Heals',source:'Scribe Eighteen, restricted specification — Year approximately 463',text:'The one who heals the wound will be born of two bloodlines, held by neither, named by one who gives his name to no one. She will fail four times. The fifth attempt is the healing.',interp:"Jhara Kola'rin. Born of Baru and Crystal-clan bloodlines. Named by a merchant who leaves before morning. The failure count: four. The fifth: she names the false god. The wound closes.",chars:["Jhara Kola'rin",'Vorath'],events:['Second Great War','The Healing'],loops:[]},
{cat:'restricted',era:'second-war',status:'pending',km:null,title:'The Merchant Gives His Name to No One',source:'Chronicle annotation, found inserted into Year approximately 515 archive',text:'He was present at every beginning and named none of them for himself. He arrived before morning and left before morning. He has been present at the naming of things since before the kingdoms had names.',interp:"Vorath. Born from the False God's overflow. Body-switching since the Age of Authorities. Present at the naming of Jhara. His name is in the restricted record. The restricted record has one entry in this section.",chars:['Vorath'],events:['Naming of Jhara'],loops:[]},
{cat:'restricted',era:'second-war',status:'pending',km:null,title:'The Spear Is Buried the Night After',source:"Crystal's personal Chronicle entry — restricted",text:"The night after Day 1,097, I buried the spear in the Crystal Valley. I buried it at the depth and angle that will make it findable by the person who needs to find it. The person has not been born yet. She will find it.",interp:"Crystal buried Leiren's spear the night after the vigil's completion. Jhara finds it 104 years later, as a young adult. The depth and angle: precise. The wait: exact.",chars:['Crystal','Leiren Thorne',"Jhara Kola'rin"],events:['Night After Day 1,097','Crystal Valley'],loops:[]},
{cat:'restricted',era:'ancient',status:'ancient',km:null,title:'Rinwa Sleeps But Does Not Die',source:'The Feathered Chronicle, Book of the Boundary — restricted section',text:'The Blue Dragon sleeps in the Tower Without End in the Dead Lands. The ring holds the essence. While the ring holds the essence, the Dragon does not die. The Dragon has not died for three thousand years.',interp:"Rinwa the Blue Dragon. The Puller of Power. While the ring holds the essence, Rinwa sleeps. The sleeping is not death. The Tower contains a Dragon who has been sleeping for three thousand years and is, to the Chronicle's best knowledge, fine.",chars:['Rinwa'],events:['Tower Without End','The Ring'],loops:[]}

// ─── PROPHECY UI ──────────────────────────────────────────────
var prophCatFilter = 'all';
var prophSearch = '';

function buildProphecies() {
  var el = document.getElementById('sec-prophecies');
  el.innerHTML =
    '<div class="sec-head">' +
    '<div class="sec-title">Prophecies</div>' +
    '<div class="sec-sub">The Archive — ' + PROPH.length + ' Records</div>' +
    '</div>' +
    '<div style="flex-shrink:0;padding:.6rem 1.25rem;background:rgba(0,0,0,.4);border-bottom:1px solid var(--rule)">' +
    '<input id="proph-search" type="text" placeholder="Search prophecies&#8230;" autocomplete="off" autocorrect="off" style="width:100%;background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:4px;padding:.5rem .85rem;font-family:EB Garamond,Georgia,serif;font-size:.95rem;color:var(--ink);outline:none;margin-bottom:.6rem">' +
    '<div id="proph-cats" style="display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:none"></div>' +
    '</div>' +
    '<div class="sec-body" id="pr-body"></div>';
  buildProphCats();
  renderProphList();
  document.getElementById('proph-search').addEventListener('input', function() {
    prophSearch = this.value.toLowerCase();
    renderProphList();
  });
}

function buildProphCats() {
  var c = document.getElementById('proph-cats');
  if (!c) return;
  var h = '';
  PROPH_CATS.forEach(function(cat) {
    var count = cat.id === 'all' ? PROPH.length : PROPH.filter(function(p){return p.cat===cat.id;}).length;
    if (count === 0 && cat.id !== 'all') return;
    var on = prophCatFilter === cat.id;
    h += '<button onclick="setProphCat(\'' + cat.id + '\')" style="flex-shrink:0;background:' + (on?hexRgba(cat.color,.18):'rgba(255,255,255,.04)') + ';border:1px solid ' + (on?cat.color+'80':'var(--rule)') + ';color:' + (on?cat.color:'var(--faint)') + ';font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all .2s">' +
      cat.icon + ' ' + cat.label + ' <span style="opacity:.6">(' + count + ')</span></button>';
  });
  c.innerHTML = h;
}

function setProphCat(id) {
  prophCatFilter = id;
  buildProphCats();
  renderProphList();
}

function renderProphList() {
  var b = document.getElementById('pr-body');
  if (!b) return;
  var filtered = PROPH.filter(function(p) {
    var catOk = prophCatFilter === 'all' || p.cat === prophCatFilter;
    var searchOk = !prophSearch || p.title.toLowerCase().indexOf(prophSearch) >= 0 || p.text.toLowerCase().indexOf(prophSearch) >= 0 || (p.source && p.source.toLowerCase().indexOf(prophSearch) >= 0);
    return catOk && searchOk;
  });
  if (!filtered.length) { b.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--faint);font-style:italic">No records found.</div>'; return; }
  var h = '<div style="font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:.75rem">' + filtered.length + ' of ' + PROPH.length + ' records</div>';
  filtered.forEach(function(p, idx) {
    var sm = STATUS_META[p.status] || STATUS_META.ancient;
    var cat = PROPH_CATS.find(function(c){return c.id===p.cat;}) || PROPH_CATS[0];
    var realIdx = PROPH.indexOf(p);
    h += '<div class="prophecy-card" onclick="openProph(' + realIdx + ')" style="position:relative;overflow:hidden">';
    h += '<div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,' + cat.color + '50,transparent)"></div>';
    h += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.5rem;gap:.5rem">';
    h += '<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,168,76,.38)">' + p.source.slice(0, 55) + (p.source.length > 55 ? '&hellip;' : '') + '</div>';
    h += '<div style="display:flex;gap:.3rem;flex-shrink:0">';
    h += '<span style="font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.08em;text-transform:uppercase;padding:.1rem .4rem;border:1px solid ' + sm.color + '40;border-radius:2px;color:' + sm.color + ';background:' + sm.color + '10;white-space:nowrap">' + sm.label + '</span>';
    h += '</div></div>';
    h += '<div style="font-family:Cinzel,serif;font-size:.78rem;font-weight:600;color:var(--gold);margin-bottom:.55rem">' + p.title + '</div>';
    h += '<div style="font-family:EB Garamond,Georgia,serif;font-size:.98rem;font-style:italic;color:var(--ivory);line-height:1.72;margin-bottom:.55rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">&ldquo;' + p.text + '&rdquo;</div>';
    if (p.chars && p.chars.length) {
      h += '<div style="display:flex;flex-wrap:wrap;gap:.25rem">';
      p.chars.slice(0,4).forEach(function(c){h+='<span style="font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .4rem;border:1px solid var(--rule);border-radius:2px;color:var(--faint)">' + c + '</span>';});
      h += '</div>';
    }
    h += '</div>';
  });
  b.innerHTML = h;
}

function openProph(idx) {
  var p = PROPH[idx];
  if (!p) return;
  var b = document.getElementById('pr-body');
  if (!b) return;
  var sm = STATUS_META[p.status] || STATUS_META.ancient;
  var cat = PROPH_CATS.find(function(c){return c.id===p.cat;}) || PROPH_CATS[0];
  var h = '<button class="back-btn" onclick="renderProphList()">&#8592; Prophecies</button>';
  h += '<div style="margin-bottom:2rem">';
  h += '<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap">';
  h += '<span style="font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid ' + sm.color + '40;border-radius:2px;color:' + sm.color + ';background:' + sm.color + '10">' + sm.label + '</span>';
  h += '<span style="font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid ' + cat.color + '40;border-radius:2px;color:' + cat.color + ';background:' + cat.color + '10">' + cat.icon + ' ' + cat.label + '</span>';
  h += '</div>';
  h += '<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(201,168,76,.38);margin-bottom:.6rem">' + p.source + '</div>';
  h += '<div style="font-family:Cinzel Decorative,serif;font-size:1.4rem;color:var(--gold);line-height:1.25;margin-bottom:1rem">' + p.title + '</div>';
  h += '<div style="height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent);margin-bottom:1.5rem"></div>';
  h += '</div>';
  h += '<div style="position:relative;border-left:2px solid rgba(201,168,76,.3);padding:1.1rem 1.25rem;background:rgba(201,168,76,.04);margin-bottom:1.5rem;border-radius:0 4px 4px 0">';
  h += '<div style="font-family:Cinzel,serif;font-size:.44rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,.35);margin-bottom:.5rem">The Record States</div>';
  h += '<div style="font-family:EB Garamond,Georgia,serif;font-size:1.12rem;font-style:italic;color:var(--ivory);line-height:1.85">&ldquo;' + p.text + '&rdquo;</div>';
  h += '</div>';
  h += '<div class="detail-h3">Interpretation</div><div class="detail-p">' + p.interp + '</div>';
  if (p.chars && p.chars.length) {
    h += '<div class="detail-h3">Related Characters</div><div class="rel-grid">';
    p.chars.forEach(function(c){h+='<div class="rel-chip">'+c+'</div>';});
    h += '</div>';
  }
  if (p.events && p.events.length) {
    h += '<div class="detail-h3">Related Events</div><div class="rel-grid">';
    p.events.forEach(function(e){h+='<div class="rel-chip">'+e+'</div>';});
    h += '</div>';
  }
  if (p.loops && p.loops.length) {
    h += '<div class="detail-h3">Loop References</div><div class="rel-grid">';
    p.loops.forEach(function(l){h+='<div class="rel-chip">'+l+'</div>';});
    h += '</div>';
  }
  // Navigation
  var prev = idx > 0 ? '<button onclick="openProph(' + (idx-1) + ')" style="background:rgba(201,168,76,.06);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.35rem .7rem;border-radius:3px;cursor:pointer;margin-right:.4rem">&#8592; ' + PROPH[idx-1].title.slice(0,20) + '&hellip;</button>' : '';
  var next = idx < PROPH.length-1 ? '<button onclick="openProph(' + (idx+1) + ')" style="background:rgba(201,168,76,.06);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.35rem .7rem;border-radius:3px;cursor:pointer">' + PROPH[idx+1].title.slice(0,20) + '&hellip; &#8594;</button>' : '';
  h += '<div style="margin-top:1.75rem">' + prev + next + '</div>';
  b.innerHTML = h;
  b.scrollTop = 0;
}


// Reading font size
var rdFontSize = parseFloat(localStorage.getItem('fc_font') || '1.1');
function adjFont(delta) {
  rdFontSize = Math.max(0.85, Math.min(1.5, rdFontSize + delta * 0.05));
  localStorage.setItem('fc_font', rdFontSize);
  var body = document.getElementById('bk-body');
  if (body) body.style.fontSize = rdFontSize + 'rem';
}
function applyFont() {
  var body = document.getElementById('bk-body');
  if (body) body.style.fontSize = rdFontSize + 'rem';
}
// Reading mode
var rdMode = false;
function toggleReadMode() {
  rdMode = !rdMode;
  var sec = document.getElementById('sec-chronicle');
  if (sec) sec.classList.toggle('reading-mode', rdMode);
  var nav = document.getElementById('nav');
  if (!rdMode && nav) nav.style.display = 'flex';
}

// ─────────────────────────────────────────────────────────────
// PATCH loadCh — add progress saving + bookmark button
// ─────────────────────────────────────────────────────────────
var _origLoadCh=loadCh;
loadCh=function(i){
  _origLoadCh(i);
  // Save progress
  setTimeout(function(){saveReadProgress(i,0);},200);
  // Scroll progress tracking
  setTimeout(function(){
    var body=document.getElementById('bk-body');
    if (!body) return;
    body.onscroll=function(){
      var pct=body.scrollHeight>body.clientHeight?body.scrollTop/(body.scrollHeight-body.clientHeight):0;
      saveReadProgress(i,pct);
    };
  },400);
  // Add bookmark button
  setTimeout(function(){
    if (!document.getElementById('bm-toggle')){
      var btn=document.createElement('button');
      btn.id='bm-toggle';
      btn.className='bm-toggle';
      btn.innerHTML='&#128279;';
      btn.title='Bookmark this chapter';
      btn.onclick=function(){toggleBM();setTimeout(function(){updateBmBtn();},50);};
      document.body.appendChild(btn);
    }
    updateBmBtn();
  },300);
};

<title>The Feathered Chronicles</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-dim:rgba(201,168,76,0.5);--gold-glow:rgba(201,168,76,0.15);
  --black:#050505;--ivory:#F2E8D5;--silver:#BFC4D3;
  --fog:#0A1028;--frost:#A8C8FF;
  --ink:rgba(242,232,213,0.9);--dim:rgba(242,232,213,0.55);--faint:rgba(242,232,213,0.3);
  --rule:rgba(201,168,76,0.2);--card:rgba(201,168,76,0.04);
}
html{height:100%;background:var(--black)}
body{height:100%;overflow:hidden;background:var(--black);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:16px}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}

/* ─ TYPOGRAPHY ─ */
.cinzel{font-family:Cinzel,serif}
.cinzel-d{font-family:"Cinzel Decorative",serif}
.garamond{font-family:"EB Garamond",Georgia,serif}

/* ─ LOADING SCREEN ─ */
#loading{position:fixed;inset:0;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 1s}
#loading.hidden{opacity:0;pointer-events:none}
.loading-title{font-family:"Cinzel Decorative",serif;font-size:clamp(1.5rem,5vw,3rem);color:var(--gold);opacity:0;animation:fadeIn 2s ease 0.5s forwards}
.loading-bar-wrap{width:200px;height:2px;background:rgba(201,168,76,0.2);margin:2rem auto;border-radius:1px}
.loading-bar{height:100%;background:var(--gold);border-radius:1px;animation:loadBar 2s ease forwards}
@keyframes loadBar{from{width:0%}to{width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ─ HOME PAGE ─ */
#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:10;padding-top:clamp(2rem,8vh,5rem);padding-bottom:2rem}
.home-bg{position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 50% 100%,#0d0a06 0%,var(--black) 60%)}
.shelf-bg{position:absolute;bottom:0;left:0;right:0;height:22vh;background:repeating-linear-gradient(90deg,rgba(30,18,6,.95) 0px,rgba(50,32,10,.9) 7px,rgba(40,25,8,.95) 14px,rgba(65,42,12,.88) 21px,rgba(35,22,7,.95) 28px,rgba(55,35,10,.9) 35px,rgba(42,27,8,.92) 42px,rgba(60,38,11,.88) 49px);border-top:1px solid rgba(201,168,76,.15)}
.shelf-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(0deg,rgba(5,5,5,.9),transparent)}
.shelf-edge{position:absolute;bottom:22vh;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),rgba(201,168,76,.5),rgba(201,168,76,.3),transparent)}

/* ─ CANDLES ─ */
.candle{position:absolute;display:flex;flex-direction:column;align-items:center}
.candle-body{width:8px;height:40px;background:linear-gradient(180deg,rgba(242,232,213,.9),rgba(200,180,140,.7));border-radius:2px 2px 1px 1px;position:relative}
.candle-wick{width:1px;height:8px;background:rgba(50,30,10,.8);position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
.flame{width:8px;height:16px;border-radius:50% 50% 20% 20%;background:linear-gradient(0deg,#ff6000,#ffb300,#fffde0);position:absolute;top:-24px;left:50%;transform:translateX(-50%);box-shadow:0 0 8px 4px rgba(255,150,0,.35),0 0 20px 8px rgba(201,168,76,.15);animation:flameFlicker .25s ease-in-out infinite alternate}
.candle-glow{position:absolute;width:120px;height:180px;border-radius:50%;background:radial-gradient(ellipse,rgba(201,168,76,.18) 0%,transparent 70%);top:-100px;left:50%;transform:translateX(-50%);animation:glowPulse 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes flameFlicker{from{transform:translateX(-50%) scaleX(.88) skewX(-3deg)}to{transform:translateX(-50%) scaleX(1.12) skewX(3deg)}}
@keyframes glowPulse{from{opacity:.7;transform:translateX(-50%) scale(.95)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}

/* ─ HOME CONTENT ─ */
.home-content{position:relative;z-index:5;text-align:center;padding:1rem;max-width:900px;width:100%;flex-shrink:0}
.home-eyebrow{font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.6em;text-transform:uppercase;color:rgba(201,168,76,.5);margin-bottom:1.2rem;opacity:0;animation:fadeIn 1.5s ease 1.5s forwards}
.home-title{font-family:"Cinzel Decorative",serif;font-size:clamp(2rem,6vw,4.5rem);font-weight:700;line-height:1.1;background:linear-gradient(180deg,#f2e8d5 0%,#c9a84c 60%,#8b6914 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;margin-bottom:.5rem;opacity:0;animation:titleReveal 2s ease 1s forwards}
.home-sub{font-family:"EB Garamond",Georgia,serif;font-size:clamp(.8rem,2vw,1.1rem);color:rgba(201,168,76,.6);letter-spacing:.2em;margin-bottom:3rem;opacity:0;animation:fadeIn 1.5s ease 2s forwards;font-style:italic}
@keyframes titleReveal{0%{opacity:0;letter-spacing:.15em;filter:blur(8px)}100%{opacity:1;letter-spacing:normal;filter:blur(0)}}

/* ─ TOME GRID ─ */
.tome-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;width:100%;max-width:860px;margin:0 auto;opacity:0;animation:fadeIn 1.5s ease 2.5s forwards}
.tome{position:relative;background:linear-gradient(145deg,rgba(40,28,12,.97),rgba(22,15,6,.99));border:1px solid rgba(201,168,76,.25);border-radius:3px 8px 8px 3px;padding:.9rem .75rem;cursor:pointer;overflow:hidden;transition:all .4s cubic-bezier(.34,1.56,.64,1);text-align:left}
.tome::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#c9a84c 0%,#8b6914 50%,#c9a84c 100%);opacity:.7}
.tome::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.04) 0%,transparent 60%);opacity:0;transition:opacity .3s}
.tome:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(201,168,76,.55);box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 20px rgba(201,168,76,.12)}
.tome:hover::after{opacity:1}
.tome-icon{font-size:1.4rem;margin-bottom:.5rem;display:block}
.tome-name{font-family:Cinzel,serif;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.tome-desc{font-family:"EB Garamond",Georgia,serif;font-size:.8rem;color:var(--faint);line-height:1.4}
.tome-shimmer{position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(201,168,76,.06),transparent);opacity:0;transition:opacity .4s;pointer-events:none}
.tome:hover .tome-shimmer{opacity:1}

/* ─ TOP NAV ─ */
#nav{display:none;flex-shrink:0;background:rgba(5,5,5,.97);border-bottom:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#nav-inner{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;scroll-behavior:smooth}
#nav-inner::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;padding:.6rem .9rem;cursor:pointer;font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.ntab.on{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.05)}

/* ─ SECTIONS ─ */
.sec{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.sec.on{display:flex}
.sec-head{flex-shrink:0;padding:1.25rem 1.5rem;background:linear-gradient(180deg,rgba(201,168,76,.06),transparent);border-bottom:1px solid var(--rule);position:relative;overflow:hidden}
.sec-head::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sec-title{font-family:"Cinzel Decorative",serif;font-size:1.4rem;color:var(--ivory);margin-bottom:.2rem}
.sec-sub{font-family:"EB Garamond",Georgia,serif;font-size:.85rem;color:var(--faint);font-style:italic}
.sec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem 1.5rem}
.sec-body::-webkit-scrollbar{width:3px}
.sec-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.back-btn{background:none;border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;padding:.28rem .65rem;border-radius:3px;cursor:pointer;margin-bottom:1rem;display:inline-flex;align-items:center;gap:.35rem;-webkit-tap-highlight-color:transparent;transition:all .2s}
.back-btn:hover,.back-btn:active{color:var(--gold);border-color:var(--gold-dim)}

/* ─ GOLD RULE ─ */
.rule-divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.rule-divider::before,.rule-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.rule-sym{color:var(--gold-dim);font-size:.7rem}

/* ─ CARDS ─ */
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:1rem 1.1rem;margin-bottom:.65rem;transition:all .2s;cursor:pointer}
.card:hover{border-color:var(--gold-dim);background:rgba(201,168,76,.07)}
.card-h{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.card-sym{font-size:1.4rem;flex-shrink:0}
.card-name{font-family:Cinzel,serif;font-size:.78rem;font-weight:600;color:var(--ivory)}
.card-sub{font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:.05rem}
.card-body{font-size:.95rem;color:var(--dim);line-height:1.75}
.tag{display:inline-block;font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .45rem;border:1px solid var(--rule);border-radius:2px;color:var(--faint);margin:.15rem .15rem 0 0}

/* ─ DETAIL VIEW ─ */
.detail-head{padding-bottom:1.25rem;margin-bottom:1.5rem;border-bottom:1px solid var(--rule)}
.detail-symbol{font-size:3rem;margin-bottom:.5rem;display:block}
.detail-name{font-family:"Cinzel Decorative",serif;font-size:1.6rem;color:var(--ivory);margin-bottom:.3rem}
.detail-title{font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.detail-h3{font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:1.75rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid rgba(201,168,76,.15)}
.detail-p{font-size:1rem;color:var(--dim);line-height:1.85;margin-bottom:.75rem}
.rel-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.rel-chip{background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:12px;padding:.2rem .65rem;font-family:"EB Garamond",Georgia,serif;font-size:.85rem;color:var(--dim)}
.rel-type{font-size:.7rem;color:var(--faint);font-style:italic}
.stat-row{display:flex;gap:.75rem;margin-bottom:.4rem;font-size:.9rem}
.stat-l{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);width:120px;flex-shrink:0;padding-top:2px}
.stat-v{color:var(--dim)}

/* ─ BOOK ─ */
#bk-wrap{display:flex;flex:1;min-height:0;overflow:hidden}
#bk-sb{width:195px;flex-shrink:0;background:linear-gradient(180deg,rgba(20,12,4,.95),rgba(10,6,2,.98));border-right:1px solid var(--rule);overflow-y:auto;-webkit-overflow-scrolling:touch}
.chi{padding:.5rem .9rem;cursor:pointer;border-left:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.chi:active,.chi.on{border-color:var(--gold);background:rgba(201,168,76,.08)}
.chi .cl{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.chi .ct{font-family:Cinzel,serif;font-size:.62rem;color:var(--dim);line-height:1.3}
.chi.on .ct{color:var(--gold)}
#bk-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.75rem 2rem 9rem;background:linear-gradient(180deg,rgba(10,6,2,.3),transparent 20%)}
#bk-body::-webkit-scrollbar{width:2px}
#bk-body::-webkit-scrollbar-thumb{background:var(--rule)}
#bk-body p{margin-bottom:1.15rem;font-size:1.08rem;line-height:1.95;text-align:justify;hyphens:auto;color:var(--dim)}
#bk-body p:first-of-type::first-letter{font-family:"Cinzel Decorative",serif;font-size:4rem;float:left;line-height:.82;margin:.05rem .12rem 0 0;color:var(--gold);text-shadow:0 0 20px rgba(201,168,76,.4)}
.ch-head{text-align:center;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--rule)}
.ch-label-text{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.45em;text-transform:uppercase;color:var(--faint);margin-bottom:.65rem}
.ch-title-text{font-family:"Cinzel Decorative",serif;font-size:1.7rem;color:var(--ivory);margin-bottom:1rem}
.ch-epig-text{font-size:.95rem;color:var(--faint);font-style:italic;line-height:1.7;max-width:400px;margin:0 auto}
.reading-hl{background:rgba(201,168,76,.12);border-radius:2px;transition:background .4s}
@media(max-width:600px){#bk-sb{display:none}#bk-body{padding:1.25rem 1rem 9rem}}

/* ─ AUDIO PLAYER ─ */
#pl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(5,3,1,.99),rgba(10,6,2,.97));border-top:1px solid var(--rule);padding:.6rem 1rem .8rem;z-index:999;display:none}
#pl::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
#pl.on{display:block}
#pl-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
#pl-info{flex:1;min-width:0}
#pl-lb{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
#pl-ti{font-family:Cinzel,serif;font-size:.68rem;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:none;border:1px solid rgba(201,168,76,.2);color:var(--faint);cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:all .2s}
.pb:active{background:rgba(201,168,76,.1);border-color:var(--gold)}
#pl-play{width:38px;height:38px;border-color:var(--gold-dim);color:var(--gold);font-size:.95rem}
#pl-play.playing{background:rgba(201,168,76,.12)}
#pl-bot{display:flex;align-items:center;gap:.65rem}
#pl-bar{flex:1;height:2px;background:rgba(201,168,76,.15);border-radius:1px;cursor:pointer}
#pl-fill{height:100%;background:var(--gold);border-radius:1px;width:0%;transition:width .3s}
#pl-time{font-family:Cinzel,serif;font-size:.48rem;color:var(--faint);flex-shrink:0;min-width:28px}
.psel{background:rgba(20,12,4,.8);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.18rem .3rem;border-radius:3px;cursor:pointer}
#voice-sel{max-width:90px;overflow:hidden}

/* ─ LOOP TIMELINE ─ */
.loop-item{position:relative;padding:.85rem 0 .85rem 2rem;border-left:1px solid var(--rule);margin-left:.5rem}
.loop-dot{position:absolute;left:-.4rem;top:1.1rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--black);border:2px solid var(--gold-dim);transition:all .2s}
.loop-item:hover .loop-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.loop-num{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.loop-label{font-family:"Cinzel Decorative",serif;font-size:1rem;color:var(--ivory);margin-bottom:.35rem}
.loop-sig{font-size:.9rem;color:var(--dim);font-style:italic;margin-bottom:.5rem}
.loop-events{list-style:none;padding:0}
.loop-events li{font-size:.88rem;color:var(--faint);padding:.1rem 0;padding-left:.8rem;position:relative}
.loop-events li::before{content:"·";position:absolute;left:0;color:var(--gold-dim)}

/* ─ SWORD ENTRY ─ */
.sword-entry{border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:1.5rem;margin-bottom:1rem;background:linear-gradient(145deg,rgba(30,18,6,.6),rgba(15,10,3,.8));position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.sword-entry::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.sword-entry:hover{border-color:rgba(201,168,76,.45);transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,0,0,.5),0 0 15px rgba(201,168,76,.08)}
.sword-num{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem}
.sword-name{font-family:"Cinzel Decorative",serif;font-size:1.4rem;color:var(--gold);margin-bottom:.15rem}
.sword-bearer{font-family:Cinzel,serif;font-size:.62rem;letter-spacing:.1em;color:var(--silver);margin-bottom:.5rem;font-style:italic}

/* ─ CREATURE ENTRY ─ */
.creature-card{border:1px solid var(--rule);border-radius:4px;padding:1rem 1.1rem;margin-bottom:.65rem;background:linear-gradient(145deg,rgba(15,10,3,.8),rgba(10,6,2,.9));cursor:pointer;transition:all .25s}
.creature-card:hover{border-color:var(--gold-dim)}
.danger-stars{display:flex;gap:.2rem;margin:.3rem 0}
.star-on{color:var(--gold);font-size:.8rem}
.star-off{color:var(--faint);font-size:.8rem}

/* ─ ACHIEVEMENT ─ */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.65rem}
.ach{border:1px solid var(--rule);border-radius:4px;padding:.85rem;background:rgba(201,168,76,.03);text-align:center;transition:all .25s}
.ach.unlocked{border-color:rgba(201,168,76,.35);background:rgba(201,168,76,.07)}
.ach-icon{font-size:1.5rem;margin-bottom:.4rem;filter:grayscale(1);transition:filter .3s}
.ach.unlocked .ach-icon{filter:none}
.ach-title{font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:.2rem;line-height:1.3}
.ach.unlocked .ach-title{color:var(--gold)}
.ach-desc{font-size:.8rem;color:rgba(242,232,213,.25);line-height:1.4}
.ach.unlocked .ach-desc{color:var(--faint)}
.ach-cat{font-family:Cinzel,serif;font-size:.45rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,168,76,.3);margin-top:.3rem}

/* ─ ATLAS KINGDOM GRID ─ */
.km-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.km-card{border:1px solid var(--rule);border-radius:4px;padding:1.1rem;cursor:pointer;background:linear-gradient(145deg,rgba(20,12,4,.9),rgba(10,6,2,.95));transition:all .3s;position:relative;overflow:hidden}
.km-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.08),transparent 70%)}
.km-card:hover{transform:translateY(-3px);border-color:var(--gold-dim)}
.km-card:hover::before{opacity:1}
.km-symbol{font-size:2rem;margin-bottom:.5rem;display:block}
.km-name{font-family:Cinzel,serif;font-size:.85rem;font-weight:600;color:var(--ivory);margin-bottom:.2rem}
.km-authority{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.5rem}
.km-desc{font-size:.88rem;color:var(--faint);line-height:1.55}

/* ─ ENC LINK ─ */
.enc-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(201,168,76,.4);color:var(--gold);-webkit-tap-highlight-color:transparent}
.enc-link:hover{text-decoration-style:solid}

/* ─ SPIN LOAD ─ */
.spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-right:.5rem}
.ld-line{height:.6rem;background:linear-gradient(90deg,rgba(201,168,76,.1),rgba(201,168,76,.05),transparent);border-radius:3px;margin-bottom:.45rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}

/* ─ WORLD TIMELINE ─ */
.wt-era{margin-bottom:2rem}
.wt-era-title{font-family:"Cinzel Decorative",serif;font-size:1rem;color:var(--gold);margin-bottom:1rem;padding:.5rem 0;border-bottom:1px solid rgba(201,168,76,.15)}
.wt-item{display:flex;gap:1rem;margin-bottom:.85rem;align-items:flex-start}
.wt-year{font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.1em;color:var(--gold);width:120px;flex-shrink:0;padding-top:2px;text-align:right}
.wt-event{font-size:.95rem;color:var(--dim);line-height:1.7;border-left:1px solid var(--rule);padding-left:.85rem;flex:1}

/* ─ MOBILE ─ */
@media(max-width:600px){.tome-grid{grid-template-columns:repeat(2,1fr);gap:.5rem;max-height:none}.km-grid{grid-template-columns:1fr 1fr}.ach-grid{grid-template-columns:repeat(3,1fr)}.wt-year{width:80px;font-size:.48rem}}


/* ─ MAP ─ */
#map-container{width:100%;max-width:700px;margin:0 auto;position:relative;user-select:none}
.map-svg{width:100%;height:auto;cursor:pointer}
.km-region{transition:opacity .25s,filter .25s;cursor:pointer}
.km-region:hover{opacity:.85;filter:brightness(1.3)}
.km-region.active{opacity:1;filter:brightness(1.5) drop-shadow(0 0 8px rgba(201,168,76,.6))}
.map-tooltip{position:absolute;background:rgba(5,3,1,.95);border:1px solid rgba(201,168,76,.4);border-radius:4px;padding:.4rem .75rem;font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);pointer-events:none;white-space:nowrap;z-index:10}
/* ─ SEARCH ─ */
#search-input{width:100%;background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:4px;padding:.7rem 1rem;font-family:"EB Garamond",Georgia,serif;font-size:1rem;color:var(--ink);outline:none;transition:border-color .2s}
#search-input:focus{border-color:rgba(201,168,76,.5)}
#search-input::placeholder{color:var(--faint);font-style:italic}
.search-result{padding:.75rem 1rem;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.search-result:hover{background:rgba(201,168,76,.06)}
.search-result-type{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.search-result-title{font-family:Cinzel,serif;font-size:.72rem;color:var(--ivory);margin-bottom:.15rem}
.search-result-desc{font-size:.88rem;color:var(--faint);line-height:1.5}
/* ─ BOOKMARKS ─ */
.bm-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.bm-item:hover{background:rgba(201,168,76,.05)}
.bm-icon{font-size:1.1rem;flex-shrink:0}
.bm-del{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:.9rem;padding:.2rem;-webkit-tap-highlight-color:transparent}
/* ─ PROPHECY ─ */
.prophecy-card{border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:1.25rem;margin-bottom:.85rem;background:linear-gradient(145deg,rgba(20,12,6,.8),rgba(10,6,2,.9));position:relative;overflow:hidden}
.prophecy-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent)}
.prophecy-text{font-family:"EB Garamond",Georgia,serif;font-size:1.1rem;font-style:italic;color:var(--ivory);line-height:1.9;margin-bottom:1rem}
.prophecy-interp{font-size:.9rem;color:var(--dim);line-height:1.7}
/* ─ BOOKMARK BTN IN CHRONICLE ─ */
.bm-toggle{position:fixed;top:.7rem;right:1rem;z-index:500;background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--gold-dim);transition:all .2s;-webkit-tap-highlight-color:transparent}
.bm-toggle.active{color:var(--gold);filter:drop-shadow(0 0 4px rgba(201,168,76,.5))}


/* ─ CHRONICLE READING ─ */
.ch-read{max-width:680px;margin:0 auto;padding:0 0 4rem}
.ch-read .epigraphs{margin:0 0 3rem;padding:0 0 2.5rem;border-bottom:1px solid rgba(255,255,255,.08)}
.ch-read .epigraph{margin-bottom:1.5rem;padding-left:1.25rem;border-left:1px solid rgba(255,255,255,.2)}
.ch-read .epigraph p{font-style:italic;color:rgba(242,232,213,.6);font-size:.95rem;line-height:1.7;margin-bottom:.4rem}
.ch-read .epigraph cite{font-style:normal;font-size:.75rem;color:rgba(242,232,213,.35);letter-spacing:.04em;display:block}
.ch-read .sec-marker{display:flex;align-items:center;gap:1rem;margin:3rem 0 1.5rem;font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.4em;color:rgba(201,168,76,.5);text-align:center}
.ch-read .sec-marker::before,.ch-read .sec-marker::after{content:'';flex:1;height:1px;background:rgba(201,168,76,.15)}
.ch-read p{margin-bottom:1.4em;font-size:1.1rem;line-height:1.95;text-align:justify;hyphens:auto;color:rgba(242,232,213,.82)}
.ch-read p.drop-cap::first-letter{font-family:"Cinzel Decorative",serif;font-size:4rem;font-weight:700;float:left;line-height:.8;margin:.05rem .12rem 0 0;color:var(--red,#8b1a1a);text-shadow:0 0 30px rgba(139,26,26,.5)}
.ch-read .ledger-box{margin:2.5rem 0;padding:1.2rem 1.6rem;border-left:2px solid rgba(201,168,76,.4);background:rgba(201,168,76,.04)}
.ch-read .ledger-head{font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.45em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:.7rem;display:block}
.ch-read .ledger-box p{font-size:.9rem;line-height:1.7;color:rgba(242,232,213,.55);margin-bottom:.4rem}
.ch-read .legend-section{margin:3.5rem 0 0;padding:2.5rem 0;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);text-align:center}
.ch-read .legend-rule{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.45em;text-transform:uppercase;color:rgba(242,232,213,.25);margin-bottom:1rem}
.ch-read .legend-title{font-family:"Cinzel Decorative",serif;font-size:1.2rem;color:var(--gold,#c9a84c);letter-spacing:.08em;margin-bottom:.4rem}
.ch-read .legend-sub{font-style:italic;color:rgba(242,232,213,.45);font-size:.88rem;margin-bottom:2rem}
.ch-read .legend-body{font-size:1rem;line-height:1.95;color:rgba(242,232,213,.65);text-align:justify}
.ch-read .closing-section{margin:3.5rem 0 0;padding:2.5rem 0;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);text-align:center}
.ch-read .closing-title{font-family:Cinzel,serif;font-size:1rem;color:var(--gold,#c9a84c);letter-spacing:.1em;margin-bottom:.35rem}
.ch-read .closing-sub{font-style:italic;color:rgba(242,232,213,.4);font-size:.85rem;margin-bottom:2rem}
.ch-read .closing-body{font-size:.95rem;line-height:1.9;color:rgba(242,232,213,.6);text-align:justify}
.ch-read .section-break{margin:2.5rem 0;text-align:center;color:rgba(255,255,255,.2);font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.4em;text-transform:uppercase}
.ch-read .ch-end-mark{text-align:center;margin-top:3rem;padding-top:2.5rem;border-top:1px solid rgba(255,255,255,.07);font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.45em;text-transform:uppercase;color:rgba(255,255,255,.18)}
/* Reading controls */
.read-controls{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:.4rem .75rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.font-btn{background:none;border:1px solid rgba(255,255,255,.12);color:rgba(242,232,213,.5);font-family:Cinzel,serif;font-size:.65rem;padding:.2rem .5rem;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.font-btn:active{background:rgba(255,255,255,.08)}
.read-progress-bar{height:2px;background:rgba(201,168,76,.15);flex:1;border-radius:1px}
.read-progress-fill{height:100%;background:var(--gold,#c9a84c);border-radius:1px;transition:width .3s}
.reading-time{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.1em;color:rgba(255,255,255,.2);white-space:nowrap}
/* Reading mode (fullscreen clean) */
#sec-chronicle.reading-mode #bk-sb{display:none!important}
#sec-chronicle.reading-mode #nav{display:none!important}
#sec-chronicle.reading-mode #pl{bottom:0}


/* Swipe hint */
.swipe-hint{position:fixed;bottom:5rem;right:1rem;z-index:300;font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.15);pointer-events:none}
/* Chapter ornament */
.ch-ornament{text-align:center;color:rgba(201,168,76,.35);letter-spacing:.5em;font-size:.7rem;margin:1rem 0}
/* Currency table */
.curr-table{width:100%;border-collapse:collapse;margin:1rem 0}
.curr-table th{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--rule);padding:.5rem .6rem;text-align:left}
.curr-table td{font-size:.88rem;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.04);padding:.45rem .6rem}
.curr-table tr:hover td{background:rgba(255,255,255,.02)}
/* Bloodline card */
.blood-card{border:1px solid var(--rule);border-radius:6px;padding:1rem;margin-bottom:.75rem;background:rgba(0,0,0,.35)}
.blood-dynasty{font-family:"Cinzel Decorative",serif;font-size:.95rem;color:var(--gold);margin-bottom:.2rem}
.blood-trait{font-size:.9rem;color:var(--dim);line-height:1.7;margin-bottom:.5rem}
/* History figure */
.hist-card{border:1px solid var(--rule);border-radius:6px;padding:1rem;margin-bottom:.65rem;background:rgba(0,0,0,.3)}
.hist-name{font-family:Cinzel,serif;font-size:.82rem;font-weight:600;color:var(--ivory);margin-bottom:.15rem}
.hist-title{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
/* Hairstyle section */
.hair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.65rem}
.hair-card{border:1px solid var(--rule);border-radius:6px;padding:.85rem;background:rgba(0,0,0,.3)}
/* Worldwide holiday */
.wh-card{border-left:3px solid var(--gold-dim);padding:.85rem 1rem;margin-bottom:.75rem;background:rgba(201,168,76,.04)}
.wh-date{font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.25rem}
.wh-name{font-family:Cinzel,serif;font-size:.82rem;color:var(--ivory);margin-bottom:.45rem}
/* Song card */
.song-card{border:1px solid var(--rule);border-radius:4px;padding:1rem;margin-bottom:.65rem;background:rgba(0,0,0,.3)}
.song-name{font-family:Cinzel,serif;font-size:.72rem;color:var(--gold);margin-bottom:.15rem}
.song-theme{font-size:.85rem;color:var(--dim);font-style:italic;margin-bottom:.45rem}
/* Back to top */
#back-top{position:fixed;bottom:5.5rem;right:.75rem;background:rgba(5,5,5,.8);border:1px solid var(--rule);color:var(--faint);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:.9rem;display:none;align-items:center;justify-content:center;z-index:400;transition:all .2s}
#back-top.visible{display:flex}
#back-top:hover{color:var(--gold);border-color:var(--gold-dim)}

</style>
</head>

<script type="application/json" id="CH_DATA">[{"lb": "Chapter One", "ti": "The Piercing", "eps": [{"text": "On the mark of the Stillness heir: it will not lie. It knows what it is for. It has been waiting three thousand years. The waiting has not made it patient. It has made it certain, which is worse. A patient thing can be persuaded to wait longer. A certain thing cannot be persuaded of anything. The mark knows. The mark has always known. The mark was built to know.", "cite": "&mdash; Aelthar the Collector, field notes, restricted archive, sub-level seven, date unknown"}, {"text": "The Quillrat: palm-sized, copper-furred, social in structure, solitary in acquisition. Each spine hollow. Each spine full of the specific paralytic compound the Quillrat produces from its secondary stomach. They do not eat what they hoard. They cannot eat it &mdash; the compound is fatal to themselves if ingested. They simply cannot bear for anything to belong to someone else. Field note: this is not greed in the ordinary sense. Greed implies the desire to consume. The Quillrat does not want to consume. The Quillrat wants the object to be in the position of belonging to the Quillrat rather than to anything else. The distinction is important and deeply unsettling.", "cite": "&mdash; Bestiary of Chela, Vol. III, Creatures of Accumulation"}], "secs": ["I", "II"], "ledgers": [], "legend": {"title": "", "sub": "", "body": ""}, "paras": [{"t": "The Quillrat: palm-sized, copper-furred, social in structure, solitary in acquisition. Each spine hollow. Each spine full of the specific paralytic compound the Quillrat produces from its secondary stomach. They do not eat what they hoard. They cannot eat it &mdash; the compound is fatal to themselves if ingested. They simply cannot bear for anything to belong to someone else. Field note: this is not greed in the ordinary sense. Greed implies the desire to consume. The Quillrat does not want to consume. The Quillrat wants the object to be in the position of belonging to the Quillrat rather than to anything else. The distinction is important and deeply unsettling.", "dc": true}, {"t": "The cultist's name was Jorin.", "dc": false}, {"t": "This will not matter to her. His name, his three years of devotion, his genuinely held belief that the thing on the altar was what the pamphlets had described it as &mdash; a wounded traveler, a person in need, a test of the cultist's commitment to the principles of mercy the order had been founded on &mdash; none of this will matter to her in any operational sense. What will matter, operationally, is the spear he is holding, and the door behind him, and the specific angle of the blow he intends to deliver, which she has already mapped and categorized and filed under:  within survivable parameters, no defensive action required.", "dc": false}, {"t": "But his name was Jorin. He was twenty-seven years old. He had joined the order three years ago after the floods in the lower Lalaka canal district had taken his brother's family, and the order had been the first group to arrive with food and dry clothing, and Jorin had found in the arriving and the food and the dry clothing the specific quality of purposeful action that grief required, and had stayed. Three years. He had been the person who organized the canal district relief efforts every spring flood season. He had been the person who sat with the elderly Golem-archivist on the fourth floor when the archivist's cataloguing process had failed and the administration had not sent anyone to fix it and the archivist had simply sat there for six days running the failed process in the stone silence of the fourth floor until Jorin had come and sat beside him and talked to him about nothing in particular until the administration finally arrived. He had been a good person in the specific way of people for whom goodness was not a virtue they cultivated but simply the texture of how they moved through the world.", "dc": false}, {"t": "He was twenty-seven years old and he was holding a spear over a thing on the altar and he had no idea what the thing on the altar was.", "dc": false}, {"t": "The order had told him: a traveler in need. A test of mercy. Strike the blow to demonstrate your commitment.", "dc": false}, {"t": "He had not asked why a test of mercy required a blow. He had wanted to ask. He had decided not to because asking would mean doubting, and the order had been the dry clothing after the floods, and doubting felt like a betrayal of the dry clothing.", "dc": false}, {"t": "He raised the spear.", "dc": false}, {"t": "The candles nearest the altar had gone out.", "dc": false}, {"t": "Not from draft. The shrine had been sealed for two hundred years against weather and intrusion alike, the stonework fitted with the specific obsessive precision of people who had decided that the enclosed air quality mattered enough to spend eighteen years of labor perfecting the fit. The candles had gone out because of the temperature in the three-foot radius around the thing on the altar &mdash; a cold that was not room-cold, not draft-cold, not the cold of stone in winter. The cold of something that had been in the Dead Lands and had the Dead Lands in its tissue, six thousand years of dying in that cold and returning from it having left the cold inside rather than letting it dissipate, the way dye left in the weaving rather than washing out.", "dc": false}, {"t": "Jorin had noticed the candles. He had filed the noticing under:  atmospheric anomaly, will investigate after.", "dc": false}, {"t": "He was not going to investigate after.", "dc": false}, {"t": "A spit drop from his tongue froze before it hit the floor. This was the thing that should have told him. The air temperature of the shrine was not cold enough for that. His spit should not have frozen. It froze anyway because the cold in the three-foot radius was not atmospheric but emanated &mdash; was projected outward from the tissue it lived in, the way body heat projected outward from warm tissue, except the inverse, the projection of six thousand years of Dead Lands cold through the altar-stone and into the air of the space.", "dc": false}, {"t": "His spit froze.", "dc": false}, {"t": "He raised the spear anyway. He was twenty-seven years old and he had organized the spring flood relief for three consecutive years and he had sat with the Golem-archivist for six days and he raised the spear because the order had given him the dry clothing and he did not know how not to.", "dc": false}, {"t": "He drove it between the shoulder blades.", "dc": false}, {"t": "The sound.", "dc": false}, {"t": "Not the sound of a wound being made. Every person who had ever made a wound knew the sound a wound being made produced &mdash; the specific acoustic profile of penetration, of tissue accepting a foreign object with the grudging biological inevitability of tissue that cannot prevent the foreign object but can record the event in every fiber. Jorin had heard that sound before, had delivered it once in a canal district fight three years before the order, and knew the specific quality of it.", "dc": false}, {"t": "This was not that sound.", "dc": false}, {"t": "This was the sound of a wound being made in something that was not processing the wound as damage. The sound of penetration without resistance &mdash; not because the tissue was soft but because the tissue had long ago developed a relationship with penetration that was not the relationship of something that could be damaged in the ordinary sense. The sound of a body that had been through this specific accounting before and had developed a practiced relationship with it that removed from the sound all of the urgency and fear and shock that the sound ordinarily contained, leaving only the pure acoustic fact: spear, entering, between scapulae, consistent with trajectory, lodged.", "dc": false}, {"t": "Jorin heard this sound.", "dc": false}, {"t": "He stood with his hands on the spear.", "dc": false}, {"t": "The thing on the altar did not react.", "dc": false}, {"t": "That was the first thing. Not the sound, though the sound would live in him until they put him in the ground &mdash; the not-reacting. A wounded thing reacted. A thing that had been stabbed through the back reacted, even if the reaction was only the body's involuntary response to the mechanical fact of the penetration, the flinch, the catch of breath, the specific arcing of the spine away from the intrusion. The thing on the altar did not react. The thing on the altar was still in the position it had been in before the spear arrived, as if the spear had not yet registered as a relevant event, as if the body receiving it was running a different calculation that did not include the spear in its inputs.", "dc": false}, {"t": "The right hand moved.", "dc": false}, {"t": "Not to the wound. Not in the direction of the pain or the spear or any of the things a hand moved toward when a body had been penetrated. The right hand moved with the specific economical efficiency of a hand that had been doing a particular job for a very long time: it found the exit wound by feel, the fingertips navigating to it with the practiced certainty of someone who had been through this specific accounting so many times that the fingers had the navigation below conscious direction. Not a search. A verification. The fingers moving to the wound the way you moved your hand to a familiar object in a dark room: you knew where it was, you were simply confirming it was still there.", "dc": false}, {"t": "Jorin's hands were still on the spear.", "dc": false}, {"t": "The frost began to move.", "dc": false}, {"t": "This was what undid him. Not the sound, not the not-reacting, not the hand finding the exit wound with the professional patience of something that had been through this before. The frost. The Dead Lands cold that had been in the tissue for six thousand years, that had been building layer by layer with each dying and returning until it was not a residue but a composition, began to move outward through the wound's perimeter in the specific pattern of tissue attempting something that tissue was not supposed to attempt.", "dc": false}, {"t": "It threaded along the veins.", "dc": false}, {"t": "He could see it through the skin of her back: the vein-map suddenly legible, the blue-grey lines of the vascular structure becoming visible as the frost followed them outward from the wound site, the branching and the sub-branching and the capillary-level resolution of the pattern building beneath the skin in real time, the body's entire internal architecture briefly, horribly, visible from the outside. Like a demonstration. Like the body had decided that Jorin needed to understand what he had penetrated and had chosen to show him its structure as evidence.", "dc": false}, {"t": "He released the spear.", "dc": false}, {"t": "He did not decide to release it. His hands decided. His hands had been in contact with something that was demonstrating its own internal architecture through a visible frost pattern and his hands had made a unilateral decision to no longer be in contact with it.", "dc": false}, {"t": "The muscle drew toward adjacent muscle.", "dc": false}, {"t": "He heard this.", "dc": false}, {"t": "The specific sound of tissue in a damaged body beginning the repair process: not the slow cellular migration of ordinary healing, which was below the threshold of hearing, but something faster and more fundamental, the sound of muscle with a relationship to damage that was not the relationship of ordinary muscle, that had been through this enough times that the repair had become a reflex rather than a process, the muscle moving toward adjacent muscle the way a person moved toward a familiar chair: with the expectation of arriving, with the certainty of the destination, with the quality of returning rather than healing.", "dc": false}, {"t": "A sound escaped him. Not a scream. Quieter than a scream, and wrong in a way that a scream was not wrong &mdash; the sound of a throat producing the only output available to it when all the categories had run out. The sound a person made when the body had identified something outside every category the body had been built to process and had responded by producing a sound that belonged to no category either. A sound that had no name. That had never needed a name before.", "dc": false}, {"t": "His knees buckled. He caught himself on the altar with both hands and the altar was cold through his palms and into the wrist bones in the specific way of a surface that had been in contact with the Dead Lands cold for long enough that the contact had transferred.", "dc": false}, {"t": "The lung.", "dc": false}, {"t": "The spear had penetrated a lung. He understood this with the abstract clarity of someone who had moved past the ability to feel the understanding. The lung was the thing making the sound. Not the sound of a damaged lung &mdash; the sound of a lung in the process of being made. The specific acoustic event of two collapsed surfaces finding each other in the dark of the body and choosing to be one surface again, the choosing audible, the decision of the tissue to return to the configuration it had held before the damage audible in the specific wet resolution of an argument the body had been making with itself.", "dc": false}, {"t": "A first breath that rattled.", "dc": false}, {"t": "Not the rattle of damage. The rattle of newness: air arriving somewhere it had just been given permission to go, the space that the collapse had occupied receiving the air with the specific sound of something claiming territory it had just negotiated for.", "dc": false}, {"t": "A silence.", "dc": false}, {"t": "A second breath that did not rattle.", "dc": false}, {"t": "The silence that followed the second breath was the worst thing in the room.", "dc": false}, {"t": "Because the silence of the second non-rattling breath was the silence of a thing that had finished doing what it was not supposed to be able to do and was simply breathing now, simply alive now, simply occupying the room with the unconcerned aliveness of something for which being alive was not a remarkable state but simply the ongoing condition.", "dc": false}, {"t": "The grin.", "dc": false}, {"t": "She turned and the grin was on the face and it was not an expression.", "dc": false}, {"t": "Jorin had been a good person for twenty-seven years and had understood expressions, had learned to read the specific architecture of a face arranging itself to communicate something &mdash; the micro-tension of the muscles around the eyes, the specific positioning of the mouth relative to the jaw, the thousand small decisions a face made every second to produce the signal it was trying to send. He had been good at reading them. He had sat with the Golem-archivist for six days and had read the expression of grief and confusion and had responded to it and had been right about what it was.", "dc": false}, {"t": "The grin was not an expression.", "dc": false}, {"t": "It was what the face was when it was not expressing anything. The default configuration. The configuration the face settled into when it was not actively doing anything with itself &mdash; not communicating joy or threat or warmth or coldness or any of the things faces communicated when they were in the business of communicating. The grin was the face in the absence of the business of communicating. The grin was what remained.", "dc": false}, {"t": "Above the grin, the eyes.", "dc": false}, {"t": "The eyes were doing nothing.", "dc": false}, {"t": "Not cold. Not warm. Not present in the way that eyes were present when they were looking at a person &mdash; when they were engaged in the mutual recognition that two conscious things extended to each other when they occupied the same space. The eyes were processing. Receiving input, categorizing it, filing it. The eyes of a system running its functions. The grin doing everything. The eyes doing nothing. The gap between them &mdash; the gap between the pleasant expression below and the processing apparatus above &mdash; was not horror in the way he had understood horror. It was the discovery that horror could wear a pleasant face and occupy the pleasant voice register and clean its fingers with pleasant thoroughness while tissue rebuilt itself in the body wearing the pleasant face. That the pleasant face was not a mask over something else. That the pleasant face was simply what six thousand years of dying and returning had left as the default setting. That there was nothing else.", "dc": false}, {"t": "She produced a cloth. The blood had gotten on her fingers. Not much &mdash; the wound had been efficient, and efficient wounds were not profligate with blood. But enough. She cleaned each finger with the methodical attention of someone who had been doing this for long enough that the method was below conscious direction. The webbing between. The nail beds. Each one. The thoroughness of someone who had been through enough specific accountings to have developed a preferred method for the aftermath of them.", "dc": false}, {"t": "While she cleaned her fingers, behind her, the exit wound in the coat's back finished closing. Not quickly. Not slowly. At the pace of tissue deciding. She did not look at it. She had learned, presumably at some point in six thousand years of this, that looking at it served no operational purpose. The tissue would finish closing at the pace it finished closing. Watching it did not change the pace. She cleaned her fingers.", "dc": false}, {"t": "When they were clean she smoothed the coat's lapel. Then the right lapel. A check: the garment maintaining its structural integrity, the line of it undisturbed. The coat seam at the left shoulder &mdash; a seam that had needed repairing once, three centuries ago, and that she checked with the thumb's pad in the specific way of someone who had learned to check a thing they had once been surprised to find damaged.", "dc": false}, {"t": "She looked up.", "dc": false}, {"t": "Her voice was light. Musical in the register of someone twenty years old discussing something pleasant over tea. The specific voice of someone for whom the pleasant register was not performed but was simply the one they occupied, had always occupied, had found nothing in six thousand years of events requiring them to abandon.", "dc": false}, {"t": "She asked where Crystal's camp was.", "dc": false}, {"t": "Jorin told her.", "dc": false}, {"t": "He told her without deciding to tell her. The telling arrived before the decision did. He said the camp's location, the number of days' travel, the specific landmarks in the order they appeared on the route, and he said all of this the way a person said things their body had decided to say before the mind had been consulted about the decision. The body had made the decision. The mind arrived after the telling was already in progress and found it could not stop the telling and let it conclude.", "dc": false}, {"t": "She thanked him.", "dc": false}, {"t": "Not warmly. Not coldly. With the neutral efficiency of someone acknowledging the receipt of required information. The way you thanked someone who had handed you a document you had asked for &mdash; the thanks was real, it acknowledged the provision of a thing that was needed, but it was not a thanks that carried anything beyond the acknowledgment.", "dc": false}, {"t": "The raven appeared on the window ledge.", "dc": false}, {"t": "She picked up the spear &mdash; the other one, the old one, the one that had been through her own back once before in a different shrine at a different altitude, the one she had been carrying for longer than any kingdom currently extant had existed &mdash; and she left. The door closed with the precise quiet of something with no interest in making its departure an event.", "dc": false}, {"t": "Jorin was against the wall.", "dc": false}, {"t": "He had not decided to be against the wall. His body had relocated him to the wall during the process and he had arrived there afterward to find himself already leaning against the stone with his hands pressed flat against it and the altar in the middle of the room with the candles out and the cold still radiating and the second non-rattling breath still in the air, which it wasn't, the breath had happened and dispersed, but the quality of it was still in the room in the way that very specific sounds and very specific events left their quality in the air of a room for longer than the physics of air permitted, in the specific way of things that had installed themselves in a person's interior rather than simply passing through it.", "dc": false}, {"t": "He relit the candles.", "dc": false}, {"t": "He sat with them.", "dc": false}, {"t": "He sat with them until the dark outside the narrow window became the grey that preceded dawn and the grey became the specific cold light of morning in the lower Lalaka canal district where he had been born and had grown up and had organized three years of flood relief and had sat with a Golem-archivist for six days and had been, until this night, a good person in the texture-of-how-he-moved-through-the-world way that did not require cultivation.", "dc": false}, {"t": "The lung sound was not on replay.", "dc": false}, {"t": "It was simply on. Running in the background of his hearing the way a sound was present when it had decided to continue regardless of whether the occasion for it persisted. He would hear it before he remembered anything else each morning. He would hear it after the last thought faded each night. He would be hearing it when they put him in the ground. He had been in the room. He would always have been in the room. The candles kept burning and that was the only thing that was all right.", "dc": false}, {"t": "The first thing that came back was the count.", "dc": false}, {"t": "Always the count. Before the body's location, before the temperature of the surface under him, before the noise of the arcade or the quality of the light through the canvas awnings or any of the other information the returning dropped him into &mdash; the count was always first. Already running before consciousness arrived to claim it, the way a heart was already beating when you woke, the way the lungs were already working the exchange they had been working since before you had any say in the matter. The count was involuntary now. It had been voluntary in loops one through perhaps thirty and had then crossed the threshold from chosen behavior into bodily function without his noticing the crossing.", "dc": false}, {"t": "Three hundred and forty-two.", "dc": false}, {"t": "He said it aloud. Not from any ritual sense &mdash; not because saying it aloud changed anything about the number or made it more true. He said it aloud because the aloud was the rope. The ledger was the architecture and the architecture was the difference between what he was doing and dying forever in the same arcade on the same arcade stone with no name for it, but the aloud was the rope, and the rope had to be pulled regularly to confirm it was still attached to something, and the something it was attached to was: three hundred and forty-two, present tense, still running, not dropped, not lost, not abandoned at the edges where the Mnemovores could find it, held.", "dc": false}, {"t": "He pressed himself upright. The arcade stone had the temperature of a surface under canvas awnings through the night and the specific texture of river-granite from the second tier of the Lalaka commercial district, polished by four centuries of feet, smoothed to the particular finish that only four centuries of feet produced &mdash; not slick, not rough, the texture of a thing that had been used completely for a very long time. He knew this texture. He had been pressing himself upright from this texture three hundred and forty-two times. His palms knew it better than they knew anything he had chosen to know.", "dc": false}, {"t": "The mark burned.", "dc": false}, {"t": "His forearm. The mark of the Stillness heir, passed through the bloodline from the Knight who had stood in front of the Tower without End three thousand years ago and had accepted the ring's sealing in exchange for the Boundary's continuation, and through the Knight's line in the specific genetic patience of a thing that had decided to wait for the right person, the person whose will would be sufficient, and had been waiting through the intervening three thousand years of the bloodline with the calm certainty of something that had decided the person would come and had not been wrong about things for three thousand years. The mark knew what it was for. It had been pointing since before he was born. It was pointing now. North and above, toward the Library of Life and Death in the center of Lalaka city, toward the forty-three floors of the world's accumulated record, toward the sub-levels that the Archivists did not have maps for, toward the seventh sub-level and the thing in the seventh sub-level that had been waiting for his hands for three thousand years.", "dc": false}, {"t": "He looked at the mark. He had developed, over three hundred and forty-two loops, the practice of looking at it directly rather than managing the looking. Not because looking directly made it less. It was what it was regardless of how he looked at it. But looking directly was part of the architecture. Looking directly was part of the not-managing-at-the-cost-of-the-management. He looked at it in the full-acknowledgment way and the mark burned and he filed the burning under:  present, noted, not the operational priority.", "dc": false}, {"t": "The operational priority was: the canal.", "dc": false}, {"t": "The route from the arcade to the canal was forty-seven steps in the correct sequence &mdash; not the shortest path, which moved through the Quillrat territory at the drainage corner in a way that loop one had established as survivable-but-costly and loop two had established as unnecessary. The correct sequence avoided the Quillrat territory by a detour of eleven additional steps, which he had never once begrudged after loop two. He moved through the forty-seven steps with the body knowledge of someone for whom forty-seven steps was not a navigation but a motion: automatic, below planning, the way walking down stairs was below planning for a person who had descended these specific stairs three hundred and forty-two times.", "dc": false}, {"t": "The Quillrats at the drainage corner chittered.", "dc": false}, {"t": "He gave them a wide berth. The large one with the notched ear tracked his movement from its position on the drainage ledge with the acquisitive attention of something that had catalogued him as a potential acquisition on loop one and had been refiling the assessment on every subsequent loop. He had not been acquired yet. The Quillrat had not stopped assessing. This was the nature of the Quillrat: the assessing never stopped. The assessing was the point, not the acquiring. The acquiring was simply what happened when the assessing concluded that acquiring was feasible. The assessing continued even when acquiring was not feasible. The Quillrat assessed. He gave it a wide berth and moved on.", "dc": false}, {"t": "The canal.", "dc": false}, {"t": "Eight degrees. This was the consistent measurement &mdash; he had felt the temperature with sufficient regularity to have internalized it not as a measured fact but as a body knowledge, the specific quality of cold that was eight-degree cold, the cold that found the gaps between fabric and skin with the efficiency of something that had been finding those gaps since before the canal was dug. He entered. The current ran east-southeast. He swam against the current for the first twelve meters where the current was strong enough to matter, then with it for the next thirty where it was not. Under the bridge. Past the moss-covered support pillar that he had memorized as a navigation point in loop four and that had become simply another feature of the known space, as unremarkable and necessary as a door handle on a door he had used ten thousand times.", "dc": false}, {"t": "The warehouse.", "dc": false}, {"t": "The west door, not the east. He had established this preference in loop nine, when the east door's guard rotation had produced a death in loop seven and a near-death in loop eight that the west door's rotation did not produce at any loop he had since tested. The west door required seven seconds of additional exposure to the canal-side approach, which he had neutralized in loop eleven by timing the approach to the guard's interior shift-change rather than the exterior rotation. The seven seconds became three. He had not timed it since loop eleven. He did not need to. He had three seconds now the way he had forty-seven steps now: below counting, below planning, simply the correct amount.", "dc": false}, {"t": "The trapdoor.", "dc": false}, {"t": "The tunnel.", "dc": false}, {"t": "Four hours of dark. The tunnel ran north-northeast from the warehouse to the borderland field, two and a half miles of hand-carved passage through the bedrock that someone had cut three centuries ago for purposes the Lalaka city records classified as infrastructure maintenance and that were demonstrably not infrastructure maintenance. He had died in the tunnel on loops seven, nineteen, thirty-four, sixty-one, and one hundred and twelve &mdash; all from different causes, all from things that the tunnel's dark produced and that subsequent loops had mapped and eliminated. The tunnel was safe now. He moved through it at the walking pace that four hours of dark required, which was faster than a careful person's pace and slower than a running person's pace, the specific pace of someone who had internalized the tunnel's terrain completely enough that the dark was not an impediment but simply the visual condition of a known space.", "dc": false}, {"t": "He was alone with the count.", "dc": false}, {"t": "This was the only time he was alone with it. In the arcade there were the Quillrats and the morning crowd and the ambient sounds of the commercial district beginning its day. In the canal there was the current and the cold and the navigation demands. In the warehouse there were the guards and the specific tactical attention that the guards required. In the tunnel there was nothing except the count, for four hours, four hours of the count and the rope and the specific interior landscape of someone who had been doing this for six years and who carried in the maintained section of the ledger the things that the six years had installed there: loop eighty-nine in the section he did not visit; the three vendor-district villages in the not-loop-deaths section; the specific quality of the vendor from loop eighty-nine's voice as his body imagined it, having been carrying her since loop ninety; the rope and the count and the architecture that held all of it.", "dc": false}, {"t": "He did not visit the section he did not visit.", "dc": false}, {"t": "He had been practicing not visiting it for two hundred and fifty-three loops. He was very good at not visiting it. He walked through the four hours of dark and he held the count and he did not visit the section and the section stayed where it was, at the edges of the ledger where he had filed it, and he walked.", "dc": false}, {"t": "The borderland field.", "dc": false}, {"t": "He emerged from the tunnel into the borderland field in the specific cold that predated all of this and would outlast all of it &mdash; the cold that had nothing to do with the season or the time of day or the presence or absence of the sun, the cold of the borderland itself, which was the cold of a territory that had been the edge of things for so long that it had taken on the quality of edges: the specific atmospheric character of a place where one thing stopped and another had not yet fully started. He knew this cold. He had known it since loop one. It was the most honest cold in his experience, because it did not pretend to be anything other than the cold of a threshold.", "dc": false}, {"t": "He stopped.", "dc": false}, {"t": "He looked at his arm.", "dc": false}, {"t": "The mark was burning. It was always burning in the borderland field. The borderland field was the closest point on the escape route to the Library's direction, the point at which north-and-above was most purely north-and-above, and the mark responded to proximity to its direction with the specific intensity of something that had been pointing for a very long time and found itself closest to what it was pointing at.", "dc": false}, {"t": "He said the words.", "dc": false}, {"t": "He said: &quot;I'll die before I burn your world.&quot;", "dc": false}, {"t": "The mark burned hotter. Not brighter. Hotter. As if the saying confirmed something the mark had been waiting for the saying to confirm. As if the three thousand years of pointing had been building toward this specific confirmation and found it, imperfectly and temporarily, in a twenty-four-year-old half-orc standing in the borderland cold saying the thing he had decided he was.", "dc": false}, {"t": "He meant it. This was important and also exhausting: he had been meaning it since before it had words, since loop one when the only version of it he had was a feeling that the specific wrong thing was not something he was going to do regardless of cost, and he had been meaning it through every loop that had cost him enough to make the meaning something other than easy. It was not bravery. Bravery required the absence of fear, and he was afraid in every cell and had been afraid in every cell since he was born, the constitutional fear of a half-orc child of wind and dust who had grown up knowing the mark on his arm was a claim he had not made on himself. It was not bravery. It was the specific thing that remained after the fear was factored in and the cost was factored in and everything that could be taken was factored in: the refusing to do the specific wrong thing. Very quiet. Very absolute. Still there on loop three hundred and forty-two in the same place it had been on loop one.", "dc": false}, {"t": "He walked south.", "dc": false}, {"t": "The heartlight moss activated at his first step into the fog's boundary &mdash; the silver spreading outward from the point of contact in the radial pulse of a maintenance system receiving input it knew how to process, recording him, adding the current version of him to the stable layers alongside the two previous traces of him: loop ninety-two and loop one hundred and forty-seven, both clean-edged, bounded, the atmospheric record of a person passing through at those specific points in time. He was the third trace. Already inside the layers before he had fully entered the fog. Already being kept.", "dc": false}, {"t": "He could not die through the fog into understanding.", "dc": false}, {"t": "In three hundred and forty-two loops he had never found the fog's bottom. He had died in it twelve times &mdash; six from the unmapped fear, four from the specific hazards of moving through a space that did not maintain the visual information he needed to navigate it, two from things that he still had not fully mapped &mdash; and in none of the twelve deaths had he found anything in the fog that he could die through into understanding of what was in it. The fog was not a space he could know by dying. The fog was a space that required a different kind of knowing.", "dc": false}, {"t": "He was afraid of it in the way he was afraid of the unmapped. In the mapped way, the fog was: cold, dense with the atmospheric record of everything that had ever passed through it, visually occluded beyond arm's length, and home to at least two categories of hazard that he had not yet fully resolved. In the unmapped way, the fog was: the thing at the edge of the loops that he could not reach with the loop-method, the thing that was not accessible through dying and returning, the thing that required something other than three hundred and forty-two deaths to know.", "dc": false}, {"t": "He walked into it anyway.", "dc": false}, {"t": "The compass burned at his back.", "dc": false}, {"t": "He walked south.", "dc": false}, {"t": "He was eight years old in the ash. Not the ash of fire that had cooled into the grey powder of completion &mdash; the ash of a site still between burning and burned, embers alive in the east corner where the wind was coming from, the specific smell of wood that had been a house and was becoming something else. Twenty-three families. He called their names into the smoke.", "dc": false}, {"t": "The smoke did not answer. He had not expected it to answer. He had called the names because the names needed to be in the air, because the names had been in the mouths of the people who had said them every day for generations and the people were gone and if the names left the air entirely they would be more gone than they already were, and he was eight years old and this was the specific logic available to him and he applied it.", "dc": false}, {"t": "He built fourteen cairns. He moved the stones that were available and he stacked them in the specific careful architecture of someone who did not know how to build cairns but understood that cairns were built by stacking stones carefully, and he stacked them carefully, and the light changed twice while he stacked them, and the stones cut his hands, and he kept stacking because the alternative was standing in the ash doing nothing, and standing in the ash doing nothing was not something his body would permit.", "dc": false}, {"t": "The sword was in the ruins of the family hearth. Not placed there. Grown there, in the way that swords in old stories grew in places they were needed: not conjured, not dropped, simply present in the way that things were present when they had found the location they were for. Red. The specific red of iron that had been in contact with something at a high temperature for a very long time and had been changed by the contact.", "dc": false}, {"t": "He picked it up. His hands were bleeding.", "dc": false}, {"t": "\"What do you will?\"  it asked.", "dc": false}, {"t": "Find them,  he said. He looked at the cairns. He looked at the horizon.  And make sure no other child wakes to ashes.", "dc": false}, {"t": "The steadiness in his voice was not bravery. It was what remained when everything that was not the will had been consumed by the ash.", "dc": false}, {"t": "The sword became covenant. By twenty his hair had gone white from the heat in him. By thirty he did not eat. By forty there was very little of Korren left in the form that had been Korren, and what remained was the will and its expression, which was: the sword. The Hungerwings found him on the grey hills at fifty-three and came to whisper the voices of everyone he had failed to reach in time, found nothing in him to whisper to, recalibrated, and circled above the thing that had decided to become only the purpose.", "dc": false}, {"t": "He is still choosing. The will does not extinguish. It is in every refusal to stand in the ash doing nothing. In every name called into smoke that does not answer. In the eight-year-old hands bleeding on the cairn-stones in the specific patient architecture of someone who does not know how to build cairns but understands that cairns require careful stacking.", "dc": false}]}, {"lb": "Chapter Two", "ti": "The Fog Reader", "eps": [{"text": "The fog does not take. It keeps. The distinction matters: taking implies removal from the original location; keeping implies the original location simply extends into the fog's maintenance layers, where the thing is held alongside everything else the fog has kept, at full fidelity, indefinitely. The fog is not a thief. The fog is an archivist. It keeps what it finds in itself. The fog does not distinguish between what is difficult to keep and what is not. A Mist Sprite, asked why it keeps difficult things, will not answer. The Mist Sprite does not understand the question. The question assumes difficulty is a reason not to keep. The fog does not have this assumption.", "cite": "&mdash; Annotated Field Survey of the Nebel Atmospheric Layers, Commission of the Veiled Hearts, Year 412"}, {"text": "The heart remembers you well.", "cite": "&mdash; Traditional Nebel greeting, spoken between people who have not seen each other in a long time, also spoken between people meeting for the first time, because the fog has always had both kinds of meetings in its layers and the Nebel people long ago stopped distinguishing between them"}], "secs": ["I", "II"], "ledgers": [], "legend": {"title": "", "sub": "", "body": ""}, "paras": [{"t": "The heart remembers you well.", "dc": true}, {"t": "The Nebel fog encountered her and found a category problem.", "dc": false}, {"t": "Not a failure to categorize &mdash; the fog's maintenance system was not prone to failures, had been running continuously since before the first kingdom, had categorized passages from every species and configuration that the world had produced in the interval. The system had categories for things with unusual temperatures, for things that moved through the layers faster than expected, for things that carried the atmospheric signature of multiple regions simultaneously. The system was comprehensive. The system was not, in three thousand years of operation, prone to failure.", "dc": false}, {"t": "The problem was not the system. The problem was the entity.", "dc": false}, {"t": "An entity presenting for maintenance layer storage required certain properties for the storage entry to be completed: a bounded duration of presence, a consistent signature across the passage's length, and a resolvable endpoint at which the entry could be closed. Without a resolvable endpoint, the entry could not be closed. An entry that could not be closed was not a failure &mdash; the system had a category for this too, the  anomalous passage  category, which handled entries that could not be immediately resolved and flagged them for extended maintenance attention.", "dc": false}, {"t": "The Mist Sprites in the deep strata opened an anomalous passage entry.", "dc": false}, {"t": "They had opened anomalous passage entries before. A specific weather event three hundred years ago that had moved through the Nebel territory in a pattern inconsistent with the atmospheric physics of the region, producing an entry that had taken eleven months to fully resolve. A magical discharge in loop four hundred and thirty-six of the heir's current loop sequence that had produced a brief but genuine signature inconsistency in the eastern strata. These entries had been anomalous and had been resolved.", "dc": false}, {"t": "They began the resolution process on the current entry.", "dc": false}, {"t": "The resolution process attempted to identify the endpoint of the passage: the moment at which the entity would exit the layers, providing the boundary condition that would allow the entry to be closed. The resolution process found no endpoint. The entity had been in the layers before and was in the layers now and the entity that had been in the layers before and the entity that was in the layers now were the same entity but were also, in the fog's maintenance system's assessment, different entities, because the entity in the layers now was three hundred years older than the entity that had been in the layers before and carried the atmospheric signature of three centuries of additional dying and returning and the Dead Lands' cold building in the tissue in three hundred years of additional accumulation.", "dc": false}, {"t": "The Mist Sprites attempted to reconcile the same-entity and different-entity assessments.", "dc": false}, {"t": "They produced a notation:  anomalous passage. Origin: multiple. Entry: partial. Exit: not recorded. Resolution: pending. Date opened: three centuries ago. Date closed: not applicable. Status: ongoing. The passage is consistent with a single entity that has been passing through the Nebel layers intermittently for three centuries and has not, in three centuries, produced a resolvable endpoint. The layers note: this is the only entry of this kind in the maintenance record. The maintenance record goes back three thousand years. This is the only entry of this kind.", "dc": false}, {"t": "She walked through the fog that could not file her.", "dc": false}, {"t": "She had been walking through things that could not file her for six thousand years and had developed a relationship with the experience that was not precisely comfort &mdash; she had not developed comfort with anything in six thousand years &mdash; but was adjacent to it: the familiarity of something that had been true for so long that its truth was simply part of the texture of existing. The world could not file her. The world kept trying. The world kept finding the wrong category, kept reaching for the endpoint that would allow the entry to close, kept finding that the endpoint was not there. She walked through the fog that could not file her and the Mist Sprites updated the entry with her current passage and filed it back under: anomalous, ongoing, pending.", "dc": false}, {"t": "The heir was ahead in the same layers &mdash; the third trace, clean-edged, bounded, a person with a beginning and an end and a middle. She could feel the mark's cold from three hundred feet. Not the Dead Lands' cold of her own tissue &mdash; this was the ring's cold, the Stillness heir's cold, the cold of three thousand years of the ring waiting in sub-level seven for the bloodline's return, the cold of the Boundary's other side bleeding through the mark into the tissue of the person carrying it. She knew this cold. She had spent three centuries learning to know it. She recognized it the way you recognized a voice you had been hearing your whole life before you knew the voice had a source: by the specific quality of its familiarity, by the way it arrived in the body before the mind had processed it.", "dc": false}, {"t": "She had been watching Kola Baru since loop one. Not continuously &mdash; she had other operational responsibilities, other kingdoms to move through, other cells to stage. But she had been watching the loop-anomaly from the Worshiper network's Lalaka observation posts, had been reading the atmospheric record's record of his loop deaths in the maintenance layers, had built across three hundred and forty-two loops a picture of him that was more complete in some ways than his own picture of himself, because his picture of himself was built through direct experience and direct experience could not include the observations of three hundred and forty-two complete versions of a person from the outside, the specific accumulated evidence of what a person was when they were not performing for themselves.", "dc": false}, {"t": "The Worshiper contact in Karev's Crossing was an Ordained of two years' tenure, stationed in the secondary intelligence hub that served the Nebel-Lalaka corridor. She had the quality of Ordained-rank operatives that two years in territory produced &mdash; the competence that came from sustained field work, the specific calibration of someone who had been doing this long enough that they had stopped distinguishing between their professional self and their ordinary self, had become the work in the way that long-duration operatives became the work.", "dc": false}, {"t": "She saw the grin coming through the narrow border street from thirty meters and her hands moved into her pockets.", "dc": false}, {"t": "Not a decision. Her hands made the decision independently and she let them go because the professional override &mdash; the trained suppression of the body's responses tha

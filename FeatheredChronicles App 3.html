document.addEventListener('DOMContentLoaded',function(){
  setTimeout(checkContinueReading,2800);
});

    daily:"Hunters, gatherers, herbalists, mystics. People live among trees and beasts, moving with the rhythms of nature. Meals are communal and symbolic. Memory-sharing circles. Morning and evening offerings to beasts. Wild game, forest fruits, and ritual meals.",

    fable:{title:"The Beast That Ate Names",text:"A gluttonous creature devoured the names of villagers, causing them to forget who they were. A clever child tricked the beast into eating a magical mirror instead, restoring memory to all.",moral:"Gluttony takes more than it should. Cleverness and foresight protect what is precious."},

    exports:"Rare herbs, mushrooms, magical fruits, beast hides, forest spirit essences.",
    spirit:{name:"Munchlings",look:"Round soft-bodied creatures with mouths on their hands for nibbling",lesson:"Moderation, sharing, and cleverness. A greedy child learns that enjoying with friends is better than consuming everything alone."}

  clevel:{
    anthem:{title:"To Heights Unseen",text:"Lift your gaze, O shining flock,\nTo spires that pierce the heavens' lock.\nHallowspire climbs where winds are thin,\nFor Mimicry calls us to ascend again.\nReach, reach higher still,\nPast cloud, past dream, past mortal will.\nSeven heavens weave above,\nGuided by our questions' love.\nO kingdom built on asking's fire,\nWe rise, we rise — ever higher."},
    motto:"Rise Beyond Every Rival.",
    identity:"The Climbers Without End. Clevel's spirit is a relentless drive to surpass others. Artisans compete with artisans, students with students, villages with villages. They admire beauty, perfection, and advancement — but are never satisfied. Ambitious to a fault, always watching, wanting, imitating, and improving.",
    daily:"Artists, mages, athletes, politicians. Citizens constantly train, compete, and innovate to outdo one another. Homes display trophies or symbols of achievement. Art competitions, dueling, flying races, magical experiments. Simple, functional foods — energy over indulgence.",
    clothing:"Vibrant colors, asymmetrical designs, and contrasting fabrics to show individuality. Ornamental feathers or talismans worn to display achievement. Magical sigils embroidered for social status.",
    city:"Built on cliffs and high perches, terraces, and vertical gardens. Homes and guild halls compete visually — each trying to outshine the next. Bridges and stairways connecting multiple levels.",

    military:{name:"The Climbing Eagles",structure:"Climbing Eagles, Rivalry Squads, Aspiration Guard",style:"Surprise strikes from heights and high ground. Adaptive tactics that evolve mid-battle. Use intimidation and competitive duels to maintain morale."},

    fable:{title:"The Twin Talons",text:"Two siblings, one human and one elf, both talented in magic, constantly tried to outdo each other. When a forest fire threatened their village, they realized only by cooperating could they save it. Together their combined magic created a barrier.",moral:"Envy blinds. Collaboration brings true strength."},

// CULTURE HUB (inside Atlas)
function buildCultureTab(kid) {
  var k = null;
  for (var i=0;i<KM.length;i++){if(KM[i].id===kid){k=KM[i];break;}}
  if (!k) return '<p style="color:var(--faint)">No data.</p>';
  var cult = CULTURE[kid];
  if (!cult) return '<p style="color:var(--faint)">Cultural data not yet recorded.</p>';
  var h = '';
  var sections = [
    {k:'identity',label:'National Identity'},
    {k:'daily',label:'Daily Life'},
    {k:'clothing',label:'Clothing & Style'},
    {k:'city',label:'City Layout'},
    {k:'festival',label:'Festival'},
    {k:'military',label:'Military'},
    {k:'transport',label:'Transportation'},
    {k:'exports',label:'Trade & Exports'}
  ];
  sections.forEach(function(s) {
    var val = cult[s.k];
    if (!val) return;
    var text = typeof val === 'string' ? val : (val.desc || val.name || JSON.stringify(val));
    h += '<div class="detail-h3" style="color:' + k.accent + '">' + s.label + '</div>';
    h += '<div class="detail-p">';
    if (typeof val === 'object' && val.name) h += '<strong style="color:var(--ivory)">' + val.name + '</strong> &mdash; ';
    h += text + '</div>';
  });
  if (cult.greeting) {
    h += '<div class="detail-h3" style="color:' + k.accent + '">Greeting</div>';
    h += '<div style="font-family:Cinzel,serif;font-size:.7rem;font-style:italic;color:var(--gold);margin-bottom:.4rem">&ldquo;' + cult.greeting.phrase + '&rdquo;</div>';
    h += '<div class="detail-p">' + cult.greeting.etiquette + '</div>';
  }
  if (cult.royal) {
    h += '<div class="detail-h3" style="color:' + k.accent + '">Current Ruler</div>';
    h += '<div style="font-family:Cinzel Decorative,serif;font-size:.9rem;color:var(--ivory);margin-bottom:.3rem">' + cult.royal.ruler + '</div>';
    h += '<div style="font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:' + k.accent + ';margin-bottom:.4rem">' + cult.royal.house + '</div>';
    h += '<div class="detail-p">' + cult.royal.traits + '</div>';
  }
  if (cult.fable) {
    h += '<div class="detail-h3" style="color:' + k.accent + '">Kingdom Fable: ' + cult.fable.title + '</div>';
    h += '<div class="detail-p">' + cult.fable.text + '</div>';
    h += '<div style="font-style:italic;color:' + k.accent + ';font-size:.9rem;margin-top:.3rem">Moral: ' + cult.fable.moral + '</div>';
  }
  if (cult.sport) {
    h += '<div class="detail-h3" style="color:' + k.accent + '">National Sport: ' + cult.sport.name + '</div>';
    h += '<div style="font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:' + k.accent + '55;margin-bottom:.35rem">' + cult.sport.type + '</div>';
    h += '<div class="detail-p">' + cult.sport.desc + '</div>';
  }
  if (cult.spirit) {
    h += '<div class="detail-h3" style="color:' + k.accent + '">Kingdom Spirit: ' + cult.spirit.name + '</div>';
    h += '<div class="detail-p"><em>' + cult.spirit.look + '</em> &mdash; ' + cult.spirit.lesson + '</div>';
  }
  return h;
}

function buildGlossary() {
  var el = document.getElementById('sec-glossary');
  if (!el) return;
  el.innerHTML = '<div class="sec-head"><div class="sec-title">Glossary</div><div class="sec-sub">Key Terms of the Feathered Chronicles</div></div><div class="sec-body"><input id="glos-search" type="text" placeholder="Search terms&#8230;" style="width:100%;background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:4px;padding:.55rem .85rem;font-family:EB Garamond,Georgia,serif;font-size:.95rem;color:var(--ink);outline:none;margin-bottom:.85rem"><div id="glos-list"></div></div>';
  renderGlossary('');
  document.getElementById('glos-search').addEventListener('input',function(){renderGlossary(this.value);});
}

function renderGlossary(q) {
  var list = document.getElementById('glos-list');
  if (!list) return;
  var filtered = q ? GLOSSARY.filter(function(g){return g.term.toLowerCase().indexOf(q.toLowerCase())>=0||g.def.toLowerCase().indexOf(q.toLowerCase())>=0;}) : GLOSSARY;
  var h = '';
  filtered.forEach(function(g) {
    h += '<div style="padding:.75rem 0;border-bottom:1px solid var(--rule)">';
    h += '<div style="font-family:Cinzel,serif;font-size:.72rem;color:var(--gold);margin-bottom:.3rem">' + g.term + '</div>';
    h += '<div style="font-size:.95rem;color:var(--dim);line-height:1.75">' + g.def + '</div>';
    h += '</div>';
  });
  list.innerHTML = h || '<div style="color:var(--faint);font-style:italic;text-align:center;padding:2rem">No terms found.</div>';
}

function buildSongs() {

  var b = document.getElementById('songs-body');
  var tabs = '<div style="display:flex;gap:.4rem;margin-bottom:1.25rem">';
  ['funeral','birthday'].forEach(function(type,idx){
    tabs += '<button onclick="showSongTab(\''+type+'\')" id="stab-'+type+'" style="background:'+(idx===0?'rgba(201,168,76,.12)':'rgba(255,255,255,.04)')+';border:1px solid '+(idx===0?'rgba(201,168,76,.4)':'var(--rule)')+';color:'+(idx===0?'var(--gold)':'var(--faint)')+';font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .85rem;border-radius:3px;cursor:pointer">'+(type==='funeral'?'&#128420; Funeral':'&#127881; Birthday')+'</button>';
  });
  tabs += '</div><div id="song-list"></div>';
  b.innerHTML = tabs;
  showSongTab('funeral');

function showSongTab(type) {
  ['funeral','birthday'].forEach(function(t) {
    var btn = document.getElementById('stab-'+t);
    if (btn) {
      btn.style.background = t===type?'rgba(201,168,76,.12)':'rgba(255,255,255,.04)';
      btn.style.borderColor = t===type?'rgba(201,168,76,.4)':'var(--rule,rgba(255,255,255,.08))';
      btn.style.color = t===type?'var(--gold)':'var(--faint)';
    }
  });
  var list = document.getElementById('song-list');
  if (!list) return;
  var songs = SONGS[type] || [];
  var h = '';
  songs.forEach(function(s) {
    var k = null; for(var i=0;i<KM.length;i++){if(KM[i].id===s.km){k=KM[i];break;}}
    h += '<div class="song-card">';
    h += '<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem">';
    if(k) h += '<span style="color:'+k.accent+';font-size:1rem">'+k.sym+'</span>';
    h += '<div><div class="song-name">'+(k?k.name+' &mdash; ':'')+s.name+'</div></div></div>';
    h += '<div class="song-theme">'+s.theme+'</div>';
    if(s.ceremony) h += '<div style="font-size:.85rem;color:rgba(242,232,213,.45);margin-bottom:.3rem">'+s.ceremony+'</div>';
    h += '<div style="font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(201,168,76,.4)">'+s.style+'</div>';
    h += '</div>';
  });
  list.innerHTML = h;
}

    h += '<td style="color:rgba(201,168,76,.5);font-size:.8rem">'+c.sin+'</td>';

  });
  h += '</table></div>';
  h += '<div class="detail-h3">Kingdom Trade Exports</div>';
  KM.forEach(function(k) {
    var cult = CULTURE[k.id];
    if (!cult) return;
    h += '<div style="margin-bottom:.65rem;padding:.75rem;border:1px solid '+k.accent+'20;border-radius:4px;background:rgba(0,0,0,.2)">';
    h += '<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem"><span style="color:'+k.accent+'">'+k.sym+'</span><span style="font-family:Cinzel,serif;font-size:.68rem;color:var(--ivory)">'+k.name+'</span></div>';
    if(cult.exports) h += '<div style="font-size:.88rem;color:var(--dim)">' + cult.exports + '</div>';
    if(cult.transport) h += '<div style="font-size:.82rem;color:rgba(242,232,213,.4);margin-top:.25rem">Transport: ' + cult.transport + '</div>';
    h += '</div>';
  });
  b.innerHTML = h;
}

function scrollBodyTop() {
  var scrollers = ['bk-body','enc-main','sec-body','bib-wrap','tl-body','cr-body','sw-body','arc-body','ach-body','pr-body'];
  scrollers.forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.scrollTop > 0) el.scrollTo({top:0,behavior:'smooth'});
  });
  // Also scroll active sec-body
  var active = document.querySelector('.sec.on .sec-body');
  if (active) active.scrollTo({top:0,behavior:'smooth'});
}

// Show/hide back-to-top on scroll
document.addEventListener('scroll', function() {
  var btn = document.getElementById('back-top');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
}, {passive:true});

// Swipe navigation in Chronicle
(function() {
  var touchStartX = 0, touchStartY = 0;
  var swipeLocked = false;
  document.addEventListener('touchstart', function(e) {
    // Only track swipes that start in the chapter body, not in scrollable nav/lists
    var tgt = e.target;
    var inBody = false;
    while (tgt && tgt !== document.body) {
      if (tgt.id === 'bk-body') { inBody = true; break; }
      if (tgt.id === 'nav-inner' || tgt.id === 'nav' || tgt.id === 'home' || tgt.id === 'pl') break;
      tgt = tgt.parentElement;
    }
    swipeLocked = !inBody;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e) {
    if (swipeLocked) return;
    if (!window.st || st.sec !== 'chronicle') return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2.5) {
      if (dx < 0 && st.ch < CH.length-1) { loadCh(st.ch+1); if(st.playing) setTimeout(startAudio,500); }
      else if (dx > 0 && st.ch > 0) { loadCh(st.ch-1); if(st.playing) setTimeout(startAudio,500); }
    }
  }, {passive:true});
})();

var SACRED_BOOKS = [
  {num:'I', title:'The Chronicle of Goola',
   sub:'As sung by the High Perch of Goola. As recited facing east, before dawn, in the presence of at least one bird.',
   opening:'This is how the world began. Sing it slowly.',
   sections:[
     {name:'Before',text:'In the age before all ages, dark and vast,\nBefore the first word spoken, first wing spread,\nBefore the echo had a wall to hold it fast,\nBefore the light knew where to go when fed —\nThere was but Goola.\n\nThe Lone Feather in the Endless Dark.\nFirst Bird. The only wing in a sky\nThat did not yet know itself as sky.\nThe one who held the only spark\nBefore the spark had learned to multiply.'},
     {name:'The Nature of the Hunger',text:"And Goola hungered.\nNot for flesh. Not for the comfort of the fed.\nNot for the small warm satisfactions that\nAre given to the living and the dead.\nBut for knowing.\n\nFor the gathering complete\nOf all that was and is and yet shall be.\nFrom this hunger: the First Flap.\nNot a sound. Not thunder.\nThe breath before the word that makes the word.\nFrom it came the original light."},
     {name:'The Naming of Chela',text:"Among all worlds the stars had gathered into form,\nAmong all the bright and burning and the cold,\nGoola paused above one world and was held.\nThe Chronicle does not say why this one.\nIt says only: Goola paused.\nAnd named it Chela.\n\nThe naming was the making.\nThe making was the love."},
     {name:'The False God',text:"The leftover energies pooled in the dark\nOf the wound's lowest point, below the stone.\nThey gathered as impure things gather: fast,\nImpatient, without understanding time.\nCoalesced. Organized. Found at last\nA consciousness. And opened.\n\nBut hear this: it was not evil. Not\nIn the beginning. Malice was not there.\nIt was the universe's first mis-thought\nGiven consciousness. Enormous. Without care\nNot from cruelty — from need."},
     {name:'The Seven Perches of Power',text:"Accumulation rose from the oldest mountains.\nShe built the Library — opened its fountains —\nAnd said: nothing should be lost.\n\nJudgment rose at the first horizon's line.\nShe made the world's grammar of consequence:\nEach action moves and cannot be provided\nWith a reversal. What is done persists.\n\nMimicry rose at the still pool's edge\nWhere the world had first seen itself reflect.\n\nDesire rose where the first two mortals reached\nFor each other across the dark and found a hand.\n\nFury rose where the first storm broke\nAnd lightning first kissed ground.\n\nConsumption rose in the Forbidden Forest's deep.\nConsume. Become. Renew.\n\nAnd Stillness.\nLast to rise. Most powerful of all."}
   ]},
  {num:'II', title:'The Featherfall of Stillness',
   sub:'Being the account of the Great Diminishment, the pressing, the prophecy, and the first grief. Preserved by the Silent Watchers of Halak, who have not forgiven themselves.',
   opening:'Four against one. Remember this. It never stopped being true.',
   sections:[
     {name:'What Stillness Had Witnessed',text:"She had watched for longer than the kingdoms had their names.\nShe had been present for every war's beginning\nAnd every war's slow end in smouldering flames,\nEvery civilization's winning\nAnd subsequent decay.\n\nShe was not wrong that the world was suffering.\nShe was not wrong the impure energy remained.\nEvery fact she held was true.\nThe conclusion from those facts was wrong.\n\nThis is the most terrible thing two\nSyllables can carry: true and wrong."},
     {name:'The Great Diminishment',text:"The mortals felt it across generations.\nNo single person saw the change entire.\nThe three-year vigil practitioners woke\nAnd found the silence thinner.\nThe persistent warmth that had always spoken\nIn the gap between the inhale and exhale\nWas cool. Still present. But withdrawing.\nLike the last light that makes the evening pale\nBefore the true dark."},
     {name:'The Prophecy',text:"\"A half-orc human shall rise in my name\nAnd carry silence like a banner unfurled;\nFrom fog shall rise the flame, from frost the claim;\nThe vigil shall begin that holds the world.\"\n\nHer shard then vanished from all mortal sight.\nAnd all the nations spread their wings toward war.\n\nYet in her fall, a whisper stayed:\n'My heir shall rise where ashes lay.'\nNow every dawn the ravens caw.\nThey speak her truth. We hear her law."}
   ]},
  {num:'III', title:'The Frost Shard and the Crystal Child',
   sub:'Being the account of how Desire found Stillness\'s shard, and gave it to the half-elf child of frost, and what Crystal built from that receiving.',
   opening:'The shard moved through the world in a direction no army could anticipate or follow.',
   sections:[
     {name:'Crystal',text:"Born half of elven kind and half of human breath.\nWhich means: she carried ice within.\nShe had, all her brief life, felt the gap.\nThe hollow in the chest no name had filled.\n\nThe shard arrived.\nIt did not force. It did not burst into her being.\nIt simply took its course\nThe way all things that are waiting for their voice\nFind at last the throat built for their sound.\n\nNot receiving. Completing.\nNot filling. Recognizing.\nThe way two rivers meeting\nDo not mix so much as discover\nThat they were always the same river."},
     {name:'The First Hymn',text:"Crystal wrote the first hymn in the frost.\nBefore she had the words for what had happened.\nShe wrote it first to the birds.\nBecause the birds had been present at the reasoning\nOf the First Flap — before the words.\n\nThe Chronicle keepers are her children.\nNot all by blood. Most by practice.\nBy the choosing of the vocation.\nFace east. Do not begin without a bird.\nLet the bird face east of its own inclinations.\nThen read."}
   ]},
  {num:'IV', title:'The Blue Testament of Rinwa',
   sub:'A Book of the First Age. Of the Tower without End. Of the Bargain. Of the Road of Many Deaths. Of the ring that will not leave. Kept by the Keepers of the Skyward Line.',
   opening:'In the First Age, before the Authorities had found their kingdoms, the lands were many and the kingdoms without number.',
   sections:[
     {name:'Of the World Before',text:'Nation rose against nation, and war was the speech of rulers.\nIn those days stood a kingdom at the heart of the world, whose name is no longer spoken.\nIts people were faithful. Its army was vast.\nIts ruler was a princess crowned not by fear but by mercy.\nFrom chains she raised a slave and named him knight.\nUpon him she laid her trust,\nwhich was the only thing she had that was worth the giving.'},
     {name:'Of the Road of Many Deaths',text:'The path to the Tower was guarded by spirits bound to time.\nThey tore the knight apart without count.\nHis body broke. His bones scattered.\nHis blood soaked the ground of yesterday.\nYet he rose again, each dawn heavier than the last.\nThe weight of dying accumulates even when the dying does not last.\nThis is the vigil\'s first lesson, given three thousand years before the vigil was named.\nAnd still he walked forward.\nLove does not tire. This is not a comfort.\nThis is a description of what love is.'},
     {name:'Of the Sacrifice',text:'There was one seal remaining.\nThe knight argued with himself through countless deaths.\nHe turned the problem in every direction that a mind could turn a problem.\nThere was none.\nHe sacrificed the princess. Not in hatred.\nNot in convenience.\nIn the specific agony of duty that has no other option and knows it.\nHer soul was bound to the Tower.\nShe became the Warden of the Dead Lands.\nThe world was preserved.\nShe watches still.'},
     {name:'The Final Warning',text:'Rinwa sleeps, sealed yet merciful.\nThe princess watches forever.\nAnd if the ring is broken, or the Tower abandoned —\nThe dead shall walk. The First Age shall judge the Last.\nThe greatest grief is not of power.\nIt is of what was lost and cannot return.\nIt is of the warden in the Tower who watches still.'}
   ]},
  {num:'V', title:'The Tablet of the Vanished Feather',
   sub:'Said to be the words inscribed upon Stillness\'s lost shard before it vanished into the frost. No commentary has been added. None is required.',
   opening:'Let the words sit.',
   sections:[
     {name:'The Inscription',text:'1. In stillness lies the shape of truth.\n2. A world in motion breaks.\n3. A world in silence heals.\n4. Fire shall cleanse, frost shall reveal.\n5. Look to the child born between wind and water —\n6. For from fog shall rise the flame.'}
   ]},
  {num:'VI', title:'The Seven Sacred Prayers of Chela',
   sub:'To be spoken at the threshold of any significant action.',
   opening:'One prayer for the Authority whose nature the action most requires. Or all seven, if the action is large enough to need all seven.',
   sections:[
     {name:'Prayer to Accumulation',text:'O Accumulation, She of the Overflowing Talon,\nWho carved the mountains and who spun the seas,\nWho built the Library — every hall and salon —\nWhere all truths roost on their eternal lees:\nLet thy rivers run through my spirit entire.\nGrant me the hunger for knowledge, not for ruin.\nThe grasp that gathers wisdom, not the pyre\nOf what I cannot keep.\nBy thine endless seeking I do rise;\nBy thine overflowing I am made most wise.'},
     {name:'Prayer to Judgment',text:'O Judgment, thou that standest at the first horizon,\nWho made above and below and all between,\nWho gave the world its grammar of arising\nConsequence from cause — the vast machine\nOf what is done persisting in the world\nLong past the doing: let me feel this.\nLet every action that I set unfurled\nInto the world be weighed before I yield this moment.\nDo not let me act without the reckoning.\nNot: is this consistent with what came before?\nBut: is this just? Let the question burn in me.'},
     {name:'Prayer to Mimicry',text:'O Mimicry, still pool of the world\'s first reflecting,\nWhose nature is not the copy but the ask,\nWho taught that every resemblance worth detecting\nConceals a question underneath its mask:\nLet me not confuse the learning with the losing.\nLet me not borrow what I cannot carry.\nLet me adapt without the self\'s defusing.\nThe room between what I am\nAnd what I observe in another\nLives the shape of what I could become.\nLet the room stay open.'},
     {name:'Prayer to Desire',text:'O Desire, thou most soft-tongued of the sisters,\nWho rose where the first two mortals reached for each other\nAcross the dark and found a hand:\nThou didst look upon them in their full confusion\nAnd loved them whole — without the hints of improvement.\nLet me learn this.\nNot the loving that is aimed at what the loved one would be.\nBut the loving of the actual thing.\nThe actual person. The intention behind the face.'},
     {name:'Prayer to Fury',text:'O Fury, thou the thunder of the willing soul,\nBreaker of chains and cleaver unto lies,\nThou art not rage.\nThou art the force of someone who has spent\nThe hesitation and has turned the page\nTo the next thing.\nLet me commit like this.\nLet me not strike half-heartedly.\nBy thy fire I am made strong.\nBy thy discipline the strength I tend\nBecomes worthy of the long.'},
     {name:'Prayer to Consumption',text:'O Consumption, endless maw of memory,\nWho empties the mind of what it carries past\nThe usefulness of carrying:\nTake what I cannot use.\nThe composite of every regret I\'ve kept too neat,\nToo well-preserved beyond its season.\nWhat thou eatest becomes the power\nThat feeds the truer thing I am becoming.\nNothing is wasted in the consuming.\nBy thy devouring I am renewed.'},
     {name:'Prayer to Stillness',text:'O Stillness, great Dreamer of the quiet dawn,\nWho bendest reality like reeds before thee,\nWho wast pressed from the world, not wholly gone —\nThe ravens still speak thy truth, still adore thee.\nThou art in every pause between the sounds.\nIn the fraction of a second between\nThe decision and the acting\'s grounds,\nWhere mercy still has room to intervene.\nBy thy waiting: what was broken is restored.\nBy thy patience: what is healed, is free.'}
   ]},
  {num:'VII', title:'The Hymns of the High Perch',
   sub:'As preserved by the Sky-Scribes of Goola. Sung facing east at dawn, in the presence of at least one bird.',
   opening:'The bird who knows what east means without being told.',
   sections:[
     {name:'Hymn I — The First Wingbeat',text:'Before the dawn had feathers for her crown,\nBefore the winds had learned to speak their name,\nBefore the word for world had any claim —\nGoola spread the single wing alone\nThrough a dark that had no knowing of its dark.\n\nWe are the consequence of the wound.\nWe are the light inside the scar.\nO Goola, First and Last of Wings, we sing;\nGuide us through the shadow of thy sheltering.'},
     {name:'Hymn II — The Seven Sisters\' Ascent',text:'Seven shards of fallen light,\nSeven feathers born of night,\nSeven sisters risen from the wound\'d earth —\nBorn not of a womb but of a breaking\'s birth.\n\nAccumulation: nothing shall be lost.\nJudgment: every action has its weight.\nMimicry: the copy counts the cost.\nDesire: love the world before it\'s late.\nFury: to commit is to be free.\nConsumption: to consume is to become.\nStillness: in the gap lives what we see.'},
     {name:'Hymn III — The Mourning of Stillness',text:'O Stillness, Still Wing of unending rest,\nThy silence chilled the mortal breast entire.\nThou soughtest a world unbroken, unpressed,\nPurified entire by thy silent fire.\n\nWe do not say the four were wrong.\nWe do not say thou wast right.\nWe say only: something went in the press\nThat long has not returned.\n\nBut the ravens caw at dawn.\nThey speak thy law without the map\nOf knowing it.'}
   ]},
  {num:'VIII', title:'The Cult Songs of the Seven Authorities',
   sub:'Collected by the Talon-Scribes of the Forbidden Perch. Devotional interpretations, not canonical doctrine.',
   opening:'The gap between what the Authorities are and what their cults believe they are is the world\'s most productive theological tension.',
   sections:[
     {name:'Song of the Hoarded Flame (Cult of Accumulation)',text:'Gather, gather, feathered kin,\nPile high the secrets under wing;\nIn gold we trust, in truth we thirst,\nFor Accumulation was first, was first.\nO Library deep, O mountains wide —\nHoard the flame. Let no outsider inside.\n\n(The Archivists note annually: this is not what Accumulation means. The cult sings louder.)'},
     {name:'The Silent Storm Song (Worshipers of Stillness)',text:'Hush.\n\nHush.\n\nThe world is loud.\nStill the earth and still the cloud.\nStillness has fallen. Yet she dreams.\nHer prophecy flows through fog and streams.\nThe ravens carry it without knowing.\nThe frost keeps it without showing.\n\nA half-orc child of wind and dust\nShall rise to hold what the world must\nNot lose.\n\nHush. The time draws near.\nWhen the storm-child spreads the wings — even Goola\'s shadow hears.'}
   ]},
  {num:'IX', title:'The Book of Thirteen',
   sub:'Being the sacred history of the Great Swords and those who chose them. All thirteen chose their eternity. None were made.',
   opening:'Each sword is the same psalm in a different key.',
   sections:[
     {name:'The First Sword: Will — Korren',text:'He came without a blade across the field\nOf his own dead. No armor. And no name\nRemaining but the grief that would not yield.\n\nThe sword asked: what dost thou desire of me?\nHe said: nothing for myself.\nOnly this: let there be\nA door between the ending and the delft\nOf what comes after.\n\nThe sword said: then thou wilt become\nThe space between what was and what shall be.\nArt thou free?\n\nHe said: I choose.\n\nHe always would have chosen.\nThat is what Will means.'},
     {name:'The Sixth Sword: Sacrifice — Mara',text:'She gave everything in the exact moment\nIt was most needed.\nThe moment she had been moving toward\nHer whole life.\n\nThe sword asked: did you hesitate?\nShe said: yes.\nThe sword asked: and then?\nShe said: and then the moment was more weight\nThan the hesitation.\nThen the love was louder than the fear.\nThen I did it.\n\nThe sword said: then become the act itself.\nNot the giver. The living proof.'},
     {name:'The Thirteenth Sword: Eternity — Aral',text:'She asked the sword: what wilt thou do\nWhen the world ends?\nThe sword said: continue.\nShe said: where?\nIt said: here does not require a location.\nHere requires a witness.\nThou wilt be the witness.\n\nShe is here.\nThat is her voice.\nThat is the thirteenth sword.\n\nKola Baru will be the fourteenth.\nNot Eternity. Not Silence. Not Endurance.\nThe Boundary.'}
   ]},
  {num:'XIII', title:'The Vigil',
   sub:'The testament of Kola Baru. He of the golden mark, the Fourteenth Great Sword, the Eternal Boundary. Set down by those who were not there and believe every word.',
   opening:'Before the vigil, hear the blood that made it.',
   sections:[
     {name:'The Born of Fog',text:'Half-orc his birth, of fog his double blood,\nWith human bone and wind-born orc-strength whole,\nHe woke one morn in Lalaka\'s cold mud,\nWithout a name yet for the burning goal.\n\nThe arcade stood in ruin all around.\nThe vine-swallowed arch, the crumbled tier,\nThe Library aloft on higher ground\nWith one pale candle burning — the frontier\nOf Accumulation\'s memory in the dark.\n\nHe was nobody yet.\nThe mark would say what he would be.\nHe looked at the gold spreading across his chest.\nHe looked at his hands.\nHe was eighteen years old.'},
     {name:'Day One Thousand and Ninety-Seven',text:'What happened then is held in stone and ring.\nNo Chronicle Keeper was there.\nThe ring fused to the skeleton.\n\nNot pressed. Not bound by ceremony, vow, or art.\nIntegrated at the bone. Irrevocably.\n\nHe was eighteen when the mark had burned.\nHe was twenty-four on this, the final day.\nSix years. One thousand and ninety-seven deaths.\nHe chose. He always chose: to stay.\n\nThe companions went, each to an Authority.\nNot dead. Transformed.\n\nHe became the wall between the world and void.'},
     {name:'The Vigil Stone',text:'Someone tried to scratch the name from stone.\nThey ran out of patience before the stone did.\nThis is always what happens.\n\nBeneath the scratching, in the tongue most old\nThat pre-dates all the kingdoms and their wars:\n\nKOLA BARU. THE BOUNDARY HELD.\nLOOP 1,097. DAY THREE OF THE FINAL YEAR.\nTHE RING FUSED ON THIS GROUND.\n\nThe Library stands.\nThe candle still burns.\nNothing is lost.\nNot even this.'}
   ]},
  {num:'XIV', title:'The Book of Jhara Kola\'rin',
   sub:'Hear now the second vigil. The singer asks thee to watch for a merchant. He appears early. Jhara never knew who he was. Neither shalt thou — not yet.',
   opening:'Before the girl, the wound. Before the wound, the law that forgot itself.',
   sections:[
     {name:'The Crystal Candidate',text:'He walked into the Hall of Judgment\'s seat\nAnd lit the room the way rare things can light:\nNot by force, but by the way complete\nAttention fills a space with something right.\n\nHe would have asked the question.\nHe would have asked: is this judgment sincere?\nIs this ruling just?\n\nHe never spoke it.'},
     {name:'The Guards Who Watched',text:'Not sleeping. Not overwhelmed. Not late.\nThey were awake and present. Every one.\nThey saw it — saw it clear and saw it straight.\nAnd did not move.\n\nThe orders never came.\nThe institution that had forgotten how to ask if just\nHad also lost the reflex of solution.\n\nThe guards were watching.\nThat is the sentence.\nThe Chronicle writes it with unusual care:\nNot "failed to act." Not "absence."\nThe guards were watching. They were there.'},
     {name:'The Vow',text:'I will end the Second Great War.\n\nThat is all.\nNo conditions. No conditions. No conditions.\nThe vow of one not old enough to call\nThe scale of what she\'s promised to fruition.\n\nShe did not know the war ran five millennia deep.\nShe did not know the fracture in the law.\nShe did not know the merchant who had named her.\n\nThe not-knowing: grace.'},
     {name:'The Merchant, Revealed',text:'Now. The singer says: now.\n\nHe had been there when Stillness spoke her last.\nHe heard the prophecy from the Still Wing\'s own voice.\nHe understood at once both what was there\nAnd what it meant for his five-thousand choice.\n\nHe had been High Priest of Consumption.\nHe had been a hundred names across the ages.\nHe had prepared the bloodlines. Set the war.\nSteered the Crystal line toward Yowwed\'s seat.\nNot from malice — from the knowledge borne\nOf what the prophecy had set to meet.\n\nHe was Vorath.\n\nWas he evil?\nHe does not know.\nThe book accepts this.\nThe honest uncertain\'s the fullest lot.'},
     {name:'The Spear',text:'Five thousand years after the vigil\'s end,\nIn Crystal Valley where the stone still stands —\nJhara\'s hands find something buried.\n\nShe pulls it free.\nShe feels the frozen shine\nOf recognition, in the cold blood spread\nThrough her Crystal veins.\nThe spear knows her.\n\nSomewhere an eleven-thousand-year-old shape\nGrows very still.\n\nNothing is lost.\nNot even what we broke.\nNot the ruins. Not the name beneath the scratching.\nNot the candle. Not this.\n\nThe vigil continues.\nThe book always remembers.'}
   ]}
];

function buildSacred() {
  var el = document.getElementById('sec-sacred');
  if (!el) return;
  el.innerHTML = '<div class="sec-head"><div class="sec-title">Sacred Texts</div><div class="sec-sub">The Feathered Chronicle — A Book of the World of Chela</div></div><div class="sec-body" id="sacred-body"></div>';
  var b = document.getElementById('sacred-body');
  var h = '<div style="font-family:EB Garamond,Georgia,serif;font-size:1rem;color:rgba(242,232,213,.55);font-style:italic;line-height:1.9;margin-bottom:1.75rem;padding:1rem 1.25rem;border:1px solid rgba(201,168,76,.2);border-radius:4px;background:rgba(201,168,76,.04)">';
  h += 'As sung by the High Perch of Goola<br>Being the Chronicles, Hymns, Prayers, Legends, and Songs of the Eight Kingdoms<br>as told around fires, across rivers, and at the graves of kings<br><br><em>Hear now. Lean close. The fire is low but it is burning.<br>This is the song the world sang before it forgot it was singing.</em>';
  h += '</div>';
  var bookSel = '<div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1.25rem" id="sacred-tabs">';
  SACRED_BOOKS.forEach(function(bk,idx) {
    bookSel += '<button onclick="showSacredBook('+idx+')" id="sbtab-'+idx+'" style="background:'+(idx===0?'rgba(201,168,76,.12)':'rgba(255,255,255,.04)')+';border:1px solid '+(idx===0?'rgba(201,168,76,.4)':'var(--rule)')+';color:'+(idx===0?'var(--gold)':'var(--faint)')+';font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .65rem;border-radius:3px;cursor:pointer;white-space:nowrap">Book '+bk.num+'</button>';
  });
  bookSel += '</div><div id="sacred-content"></div>';
  b.innerHTML = h + bookSel;
  showSacredBook(0);
}

function showSacredBook(idx) {
  SACRED_BOOKS.forEach(function(bk,i) {
    var btn = document.getElementById('sbtab-'+i);
    if (btn) {
      btn.style.background = i===idx?'rgba(201,168,76,.12)':'rgba(255,255,255,.04)';
      btn.style.borderColor = i===idx?'rgba(201,168,76,.4)':'var(--rule,rgba(255,255,255,.08))';
      btn.style.color = i===idx?'var(--gold)':'var(--faint)';
    }
  });
  var cont = document.getElementById('sacred-content');
  if (!cont) return;
  var bk = SACRED_BOOKS[idx];
  var h = '<div style="border-top:1px solid rgba(201,168,76,.2);padding-top:1.25rem;margin-top:.5rem">';
  h += '<div style="font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(201,168,76,.4);margin-bottom:.4rem">Book The ' + bk.num + '</div>';
  h += '<div style="font-family:Cinzel Decorative,serif;font-size:1.3rem;color:var(--ivory);line-height:1.25;margin-bottom:.35rem">' + bk.title + '</div>';
  h += '<div style="font-family:Cinzel,serif;font-size:.55rem;font-style:italic;color:rgba(242,232,213,.38);line-height:1.7;margin-bottom:1rem">' + bk.sub + '</div>';
  h += '<div style="font-style:italic;color:rgba(201,168,76,.6);font-size:.95rem;line-height:1.75;margin-bottom:1.5rem;padding:.75rem 1rem;border-left:2px solid rgba(201,168,76,.25);background:rgba(201,168,76,.04)">' + bk.opening + '</div>';
  h += '<div style="height:1px;background:linear-gradient(90deg,rgba(201,168,76,.3),transparent);margin-bottom:1.5rem"></div>';
  bk.sections.forEach(function(sec) {
    h += '<div style="margin-bottom:2rem">';
    h += '<div style="font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(201,168,76,.45);margin-bottom:.65rem">' + sec.name + '</div>';
    var lines = sec.text.split('\n');
    h += '<div style="font-family:EB Garamond,Georgia,serif;font-size:1.05rem;color:rgba(242,232,213,.75);line-height:2;">';
    lines.forEach(function(line) {
      if (!line.trim()) { h += '<div style="height:.75rem"></div>'; }
      else { h += '<div>' + line + '</div>'; }
    });
    h += '</div></div>';
  });
  h += '<div style="text-align:center;margin-top:2rem;font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.4em;color:rgba(255,255,255,.12)">&#10022; &nbsp; &#10022; &nbsp; &#10022;</div>';
  h += '</div>';
  cont.innerHTML = h;
}

function saveReadProgress(chIdx, pct) {
  try {
    var progs = JSON.parse(localStorage.getItem('fc_progress') || '{}');
    progs[chIdx] = pct;
    localStorage.setItem('fc_progress', JSON.stringify(progs));
    localStorage.setItem('fc_last_ch', chIdx);
  } catch(e) {}
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Feathered Chronicles">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Feathered Chronicles</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-dim:rgba(201,168,76,0.5);--gold-glow:rgba(201,168,76,0.15);
  --black:#050505;--ivory:#F2E8D5;--silver:#BFC4D3;
  --fog:#0A1028;--frost:#A8C8FF;
  --ink:rgba(242,232,213,0.9);--dim:rgba(242,232,213,0.55);--faint:rgba(242,232,213,0.3);
  --rule:rgba(201,168,76,0.2);--card:rgba(201,168,76,0.04);
}
html{height:100%;background:var(--black)}
body{height:100%;overflow:hidden;background:var(--black);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:16px}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}

/* ─ TYPOGRAPHY ─ */
.cinzel{font-family:Cinzel,serif}
.cinzel-d{font-family:"Cinzel Decorative",serif}
.garamond{font-family:"EB Garamond",Georgia,serif}

/* ─ LOADING SCREEN ─ */
#loading{position:fixed;inset:0;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 1s}
#loading.hidden{opacity:0;pointer-events:none}
.loading-title{font-family:"Cinzel Decorative",serif;font-size:clamp(1.5rem,5vw,3rem);color:var(--gold);opacity:0;animation:fadeIn 2s ease 0.5s forwards}
.loading-bar-wrap{width:200px;height:2px;background:rgba(201,168,76,0.2);margin:2rem auto;border-radius:1px}
.loading-bar{height:100%;background:var(--gold);border-radius:1px;animation:loadBar 2s ease forwards}
@keyframes loadBar{from{width:0%}to{width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ─ HOME PAGE ─ */
#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;z-index:10}
.home-bg{position:absolute;inset:0;background:radial-gradient(ellipse 120% 80% at 50% 100%,#0d0a06 0%,var(--black) 60%)}
.shelf-bg{position:absolute;bottom:0;left:0;right:0;height:22vh;background:repeating-linear-gradient(90deg,rgba(30,18,6,.95) 0px,rgba(50,32,10,.9) 7px,rgba(40,25,8,.95) 14px,rgba(65,42,12,.88) 21px,rgba(35,22,7,.95) 28px,rgba(55,35,10,.9) 35px,rgba(42,27,8,.92) 42px,rgba(60,38,11,.88) 49px);border-top:1px solid rgba(201,168,76,.15)}
.shelf-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(0deg,rgba(5,5,5,.9),transparent)}
.shelf-edge{position:absolute;bottom:22vh;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),rgba(201,168,76,.5),rgba(201,168,76,.3),transparent)}

/* ─ CANDLES ─ */
.candle{position:absolute;display:flex;flex-direction:column;align-items:center}
.candle-body{width:8px;height:40px;background:linear-gradient(180deg,rgba(242,232,213,.9),rgba(200,180,140,.7));border-radius:2px 2px 1px 1px;position:relative}
.candle-wick{width:1px;height:8px;background:rgba(50,30,10,.8);position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
.flame{width:8px;height:16px;border-radius:50% 50% 20% 20%;background:linear-gradient(0deg,#ff6000,#ffb300,#fffde0);position:absolute;top:-24px;left:50%;transform:translateX(-50%);box-shadow:0 0 8px 4px rgba(255,150,0,.35),0 0 20px 8px rgba(201,168,76,.15);animation:flameFlicker .25s ease-in-out infinite alternate}
.candle-glow{position:absolute;width:120px;height:180px;border-radius:50%;background:radial-gradient(ellipse,rgba(201,168,76,.18) 0%,transparent 70%);top:-100px;left:50%;transform:translateX(-50%);animation:glowPulse 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes flameFlicker{from{transform:translateX(-50%) scaleX(.88) skewX(-3deg)}to{transform:translateX(-50%) scaleX(1.12) skewX(3deg)}}
@keyframes glowPulse{from{opacity:.7;transform:translateX(-50%) scale(.95)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}

/* ─ HOME CONTENT ─ */
.home-content{position:relative;z-index:5;text-align:center;padding:1rem;max-width:900px;width:100%}
.home-eyebrow{font-family:Cinzel,serif;font-size:.6rem;letter-spacing:.6em;text-transform:uppercase;color:rgba(201,168,76,.5);margin-bottom:1.2rem;opacity:0;animation:fadeIn 1.5s ease 1.5s forwards}
.home-title{font-family:"Cinzel Decorative",serif;font-size:clamp(2rem,6vw,4.5rem);font-weight:700;line-height:1.1;background:linear-gradient(180deg,#f2e8d5 0%,#c9a84c 60%,#8b6914 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;margin-bottom:.5rem;opacity:0;animation:titleReveal 2s ease 1s forwards}
.home-sub{font-family:"EB Garamond",Georgia,serif;font-size:clamp(.8rem,2vw,1.1rem);color:rgba(201,168,76,.6);letter-spacing:.2em;margin-bottom:3rem;opacity:0;animation:fadeIn 1.5s ease 2s forwards;font-style:italic}
@keyframes titleReveal{0%{opacity:0;letter-spacing:.15em;filter:blur(8px)}100%{opacity:1;letter-spacing:normal;filter:blur(0)}}

/* ─ TOME GRID ─ */
.tome-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;width:100%;max-width:860px;margin:0 auto;opacity:0;animation:fadeIn 1.5s ease 2.5s forwards}
.tome{position:relative;background:linear-gradient(145deg,rgba(40,28,12,.97),rgba(22,15,6,.99));border:1px solid rgba(201,168,76,.25);border-radius:3px 8px 8px 3px;padding:.9rem .75rem;cursor:pointer;overflow:hidden;transition:all .4s cubic-bezier(.34,1.56,.64,1);text-align:left}
.tome::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#c9a84c 0%,#8b6914 50%,#c9a84c 100%);opacity:.7}
.tome::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.04) 0%,transparent 60%);opacity:0;transition:opacity .3s}
.tome:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(201,168,76,.55);box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 20px rgba(201,168,76,.12)}
.tome:hover::after{opacity:1}
.tome-icon{font-size:1.4rem;margin-bottom:.5rem;display:block}
.tome-name{font-family:Cinzel,serif;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.tome-desc{font-family:"EB Garamond",Georgia,serif;font-size:.8rem;color:var(--faint);line-height:1.4}
.tome-shimmer{position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(201,168,76,.06),transparent);opacity:0;transition:opacity .4s;pointer-events:none}
.tome:hover .tome-shimmer{opacity:1}

/* ─ TOP NAV ─ */
#nav{display:none;flex-shrink:0;background:rgba(5,5,5,.97);border-bottom:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#nav-inner{display:flex;overflow-x:auto;scrollbar-width:none}
#nav-inner::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;padding:.6rem .9rem;cursor:pointer;font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.ntab.on{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.05)}

/* ─ SECTIONS ─ */
.sec{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.sec.on{display:flex}
.sec-head{flex-shrink:0;padding:1.25rem 1.5rem;background:linear-gradient(180deg,rgba(201,168,76,.06),transparent);border-bottom:1px solid var(--rule);position:relative;overflow:hidden}
.sec-head::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sec-title{font-family:"Cinzel Decorative",serif;font-size:1.4rem;color:var(--ivory);margin-bottom:.2rem}
.sec-sub{font-family:"EB Garamond",Georgia,serif;font-size:.85rem;color:var(--faint);font-style:italic}
.sec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem 1.5rem}
.sec-body::-webkit-scrollbar{width:3px}
.sec-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.back-btn{background:none;border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;padding:.28rem .65rem;border-radius:3px;cursor:pointer;margin-bottom:1rem;display:inline-flex;align-items:center;gap:.35rem;-webkit-tap-highlight-color:transparent;transition:all .2s}
.back-btn:hover,.back-btn:active{color:var(--gold);border-color:var(--gold-dim)}

/* ─ GOLD RULE ─ */
.rule-divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.rule-divider::before,.rule-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.rule-sym{color:var(--gold-dim);font-size:.7rem}

/* ─ CARDS ─ */
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:1rem 1.1rem;margin-bottom:.65rem;transition:all .2s;cursor:pointer}
.card:hover{border-color:var(--gold-dim);background:rgba(201,168,76,.07)}
.card-h{display:flex;align-items:center;gap:.75rem;margin-bottom:.4rem}
.card-sym{font-size:1.4rem;flex-shrink:0}
.card-name{font-family:Cinzel,serif;font-size:.78rem;font-weight:600;color:var(--ivory)}
.card-sub{font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:.05rem}
.card-body{font-size:.95rem;color:var(--dim);line-height:1.75}
.tag{display:inline-block;font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .45rem;border:1px solid var(--rule);border-radius:2px;color:var(--faint);margin:.15rem .15rem 0 0}

/* ─ DETAIL VIEW ─ */
.detail-head{padding-bottom:1.25rem;margin-bottom:1.5rem;border-bottom:1px solid var(--rule)}
.detail-symbol{font-size:3rem;margin-bottom:.5rem;display:block}
.detail-name{font-family:"Cinzel Decorative",serif;font-size:1.6rem;color:var(--ivory);margin-bottom:.3rem}
.detail-title{font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.detail-h3{font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:1.75rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid rgba(201,168,76,.15)}
.detail-p{font-size:1rem;color:var(--dim);line-height:1.85;margin-bottom:.75rem}
.rel-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.rel-chip{background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:12px;padding:.2rem .65rem;font-family:"EB Garamond",Georgia,serif;font-size:.85rem;color:var(--dim)}
.rel-type{font-size:.7rem;color:var(--faint);font-style:italic}
.stat-row{display:flex;gap:.75rem;margin-bottom:.4rem;font-size:.9rem}
.stat-l{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);width:120px;flex-shrink:0;padding-top:2px}
.stat-v{color:var(--dim)}

/* ─ BOOK ─ */
#bk-wrap{display:flex;flex:1;min-height:0;overflow:hidden}
#bk-sb{width:195px;flex-shrink:0;background:linear-gradient(180deg,rgba(20,12,4,.95),rgba(10,6,2,.98));border-right:1px solid var(--rule);overflow-y:auto;-webkit-overflow-scrolling:touch}
.chi{padding:.5rem .9rem;cursor:pointer;border-left:2px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent}
.chi:active,.chi.on{border-color:var(--gold);background:rgba(201,168,76,.08)}
.chi .cl{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.chi .ct{font-family:Cinzel,serif;font-size:.62rem;color:var(--dim);line-height:1.3}
.chi.on .ct{color:var(--gold)}
#bk-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.75rem 2rem 9rem;background:linear-gradient(180deg,rgba(10,6,2,.3),transparent 20%)}
#bk-body::-webkit-scrollbar{width:2px}
#bk-body::-webkit-scrollbar-thumb{background:var(--rule)}
#bk-body p{margin-bottom:1.15rem;font-size:1.08rem;line-height:1.95;text-align:justify;hyphens:auto;color:var(--dim)}
#bk-body p:first-of-type::first-letter{font-family:"Cinzel Decorative",serif;font-size:4rem;float:left;line-height:.82;margin:.05rem .12rem 0 0;color:var(--gold);text-shadow:0 0 20px rgba(201,168,76,.4)}
.ch-head{text-align:center;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--rule)}
.ch-label-text{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.45em;text-transform:uppercase;color:var(--faint);margin-bottom:.65rem}
.ch-title-text{font-family:"Cinzel Decorative",serif;font-size:1.7rem;color:var(--ivory);margin-bottom:1rem}
.ch-epig-text{font-size:.95rem;color:var(--faint);font-style:italic;line-height:1.7;max-width:400px;margin:0 auto}
.reading-hl{background:rgba(201,168,76,.12);border-radius:2px;transition:background .4s}
@media(max-width:600px){#bk-sb{display:none}#bk-body{padding:1.25rem 1rem 9rem}}

/* ─ AUDIO PLAYER ─ */
#pl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(5,3,1,.99),rgba(10,6,2,.97));border-top:1px solid var(--rule);padding:.6rem 1rem .8rem;z-index:999;display:none}
#pl::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
#pl.on{display:block}
#pl-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
#pl-info{flex:1;min-width:0}
#pl-lb{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
#pl-ti{font-family:Cinzel,serif;font-size:.68rem;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:none;border:1px solid rgba(201,168,76,.2);color:var(--faint);cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:all .2s}
.pb:active{background:rgba(201,168,76,.1);border-color:var(--gold)}
#pl-play{width:38px;height:38px;border-color:var(--gold-dim);color:var(--gold);font-size:.95rem}
#pl-play.playing{background:rgba(201,168,76,.12)}
#pl-bot{display:flex;align-items:center;gap:.65rem}
#pl-bar{flex:1;height:2px;background:rgba(201,168,76,.15);border-radius:1px;cursor:pointer}
#pl-fill{height:100%;background:var(--gold);border-radius:1px;width:0%;transition:width .3s}
#pl-time{font-family:Cinzel,serif;font-size:.48rem;color:var(--faint);flex-shrink:0;min-width:28px}
.psel{background:rgba(20,12,4,.8);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.18rem .3rem;border-radius:3px;cursor:pointer}
#voice-sel{max-width:90px;overflow:hidden}

/* ─ LOOP TIMELINE ─ */
.loop-item{position:relative;padding:.85rem 0 .85rem 2rem;border-left:1px solid var(--rule);margin-left:.5rem}
.loop-dot{position:absolute;left:-.4rem;top:1.1rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--black);border:2px solid var(--gold-dim);transition:all .2s}
.loop-item:hover .loop-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.loop-num{font-family:Cinzel,serif;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.loop-label{font-family:"Cinzel Decorative",serif;font-size:1rem;color:var(--ivory);margin-bottom:.35rem}
.loop-sig{font-size:.9rem;color:var(--dim);font-style:italic;margin-bottom:.5rem}
.loop-events{list-style:none;padding:0}
.loop-events li{font-size:.88rem;color:var(--faint);padding:.1rem 0;padding-left:.8rem;position:relative}
.loop-events li::before{content:"·";position:absolute;left:0;color:var(--gold-dim)}

/* ─ SWORD ENTRY ─ */
.sword-entry{border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:1.5rem;margin-bottom:1rem;background:linear-gradient(145deg,rgba(30,18,6,.6),rgba(15,10,3,.8));position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.sword-entry::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.sword-entry:hover{border-color:rgba(201,168,76,.45);transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,0,0,.5),0 0 15px rgba(201,168,76,.08)}
.sword-num{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);margin-bottom:.3rem}
.sword-name{font-family:"Cinzel Decorative",serif;font-size:1.4rem;color:var(--gold);margin-bottom:.15rem}
.sword-bearer{font-family:Cinzel,serif;font-size:.62rem;letter-spacing:.1em;color:var(--silver);margin-bottom:.5rem;font-style:italic}

/* ─ CREATURE ENTRY ─ */
.creature-card{border:1px solid var(--rule);border-radius:4px;padding:1rem 1.1rem;margin-bottom:.65rem;background:linear-gradient(145deg,rgba(15,10,3,.8),rgba(10,6,2,.9));cursor:pointer;transition:all .25s}
.creature-card:hover{border-color:var(--gold-dim)}
.danger-stars{display:flex;gap:.2rem;margin:.3rem 0}
.star-on{color:var(--gold);font-size:.8rem}
.star-off{color:var(--faint);font-size:.8rem}

/* ─ ACHIEVEMENT ─ */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.65rem}
.ach{border:1px solid var(--rule);border-radius:4px;padding:.85rem;background:rgba(201,168,76,.03);text-align:center;transition:all .25s}
.ach.unlocked{border-color:rgba(201,168,76,.35);background:rgba(201,168,76,.07)}
.ach-icon{font-size:1.5rem;margin-bottom:.4rem;filter:grayscale(1);transition:filter .3s}
.ach.unlocked .ach-icon{filter:none}
.ach-title{font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:.2rem;line-height:1.3}
.ach.unlocked .ach-title{color:var(--gold)}
.ach-desc{font-size:.8rem;color:rgba(242,232,213,.25);line-height:1.4}
.ach.unlocked .ach-desc{color:var(--faint)}
.ach-cat{font-family:Cinzel,serif;font-size:.45rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,168,76,.3);margin-top:.3rem}

/* ─ ATLAS KINGDOM GRID ─ */
.km-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.km-card{border:1px solid var(--rule);border-radius:4px;padding:1.1rem;cursor:pointer;background:linear-gradient(145deg,rgba(20,12,4,.9),rgba(10,6,2,.95));transition:all .3s;position:relative;overflow:hidden}
.km-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.08),transparent 70%)}
.km-card:hover{transform:translateY(-3px);border-color:var(--gold-dim)}
.km-card:hover::before{opacity:1}
.km-symbol{font-size:2rem;margin-bottom:.5rem;display:block}
.km-name{font-family:Cinzel,serif;font-size:.85rem;font-weight:600;color:var(--ivory);margin-bottom:.2rem}
.km-authority{font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.5rem}
.km-desc{font-size:.88rem;color:var(--faint);line-height:1.55}

/* ─ ENC LINK ─ */
.enc-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(201,168,76,.4);color:var(--gold);-webkit-tap-highlight-color:transparent}
.enc-link:hover{text-decoration-style:solid}

/* ─ SPIN LOAD ─ */
.spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-right:.5rem}
.ld-line{height:.6rem;background:linear-gradient(90deg,rgba(201,168,76,.1),rgba(201,168,76,.05),transparent);border-radius:3px;margin-bottom:.45rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}

/* ─ WORLD TIMELINE ─ */
.wt-era{margin-bottom:2rem}

/* ─ MAP ─ */
#map-container{width:100%;max-width:700px;margin:0 auto;position:relative;user-select:none}
.map-svg{width:100%;height:auto;cursor:pointer}
.km-region{transition:opacity .25s,filter .25s;cursor:pointer}
.km-region:hover{opacity:.85;filter:brightness(1.3)}
.km-region.active{opacity:1;filter:brightness(1.5) drop-shadow(0 0 8px rgba(201,168,76,.6))}
.map-tooltip{position:absolute;background:rgba(5,3,1,.95);border:1px solid rgba(201,168,76,.4);border-radius:4px;padding:.4rem .75rem;font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);pointer-events:none;white-space:nowrap;z-index:10}
/* ─ SEARCH ─ */
#search-input{width:100%;background:rgba(201,168,76,.06);border:1px solid var(--rule);border-radius:4px;padding:.7rem 1rem;font-family:"EB Garamond",Georgia,serif;font-size:1rem;color:var(--ink);outline:none;transition:border-color .2s}
#search-input:focus{border-color:rgba(201,168,76,.5)}

.search-result:hover{background:rgba(201,168,76,.06)}
.search-result-type{font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:.2rem}
.search-result-title{font-family:Cinzel,serif;font-size:.72rem;color:var(--ivory);margin-bottom:.15rem}
.search-result-desc{font-size:.88rem;color:var(--faint);line-height:1.5}
/* ─ BOOKMARKS ─ */
.bm-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.bm-item:hover{background:rgba(201,168,76,.05)}
.bm-icon{font-size:1.1rem;flex-shrink:0}
.bm-del{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:.9rem;padding:.2rem;-webkit-tap-highlight-color:transparent}
/* ─ PROPHECY ─ */
.prophecy-card{border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:1.25rem;margin-bottom:.85rem;background:linear-gradient(145deg,rgba(20,12,6,.8),rgba(10,6,2,.9));position:relative;overflow:hidden}
.prophecy-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent)}
.prophecy-text{font-family:"EB Garamond",Georgia,serif;font-size:1.1rem;font-style:italic;color:var(--ivory);line-height:1.9;margin-bottom:1rem}
.prophecy-interp{font-size:.9rem;color:var(--dim);line-height:1.7}
/* ─ BOOKMARK BTN IN CHRONICLE ─ */
.bm-toggle{position:fixed;top:.7rem;right:1rem;z-index:500;background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--gold-dim);transition:all .2s;-webkit-tap-highlight-color:transparent}
.bm-toggle.active{color:var(--gold);filter:drop-shadow(0 0 4px rgba(201,168,76,.5))}

e in the three-foot radius around the thing on the altar \u2014 a cold that was not room-cold, not draft-cold, not the cold of stone in winter. The cold of something that had been in the Dead Lands and had the Dead Lands in its tissue, six thousand years of dying in that cold and returning from it having left the cold inside rather than letting it dissipate, the way dye left in the weaving rather than washing out. Jorin had noticed the candles. He had filed the noticing under: atmospheric anomaly, will investigate after. He was not going to investigate after. A spit drop from his tongue froze before it hit the floor. This was the thing that should have told him. The air temperature of the shrine was not cold enough for that. His spit should not have frozen. It froze anyway because the cold in the three-foot radius was not atmospheric but emanated \u2014 was projected outward from the tissue it lived in, the way body heat projected outward from warm tissue, except the inverse, the projection of six thousand years of Dead Lands cold through the altar-stone and into the air of the space. His spit froze. He raised the spear anyway. He was twenty-seven years old and he had organized the spring flood relief for three consecutive years and he had sat with the Golem-archivist for six days and he raised the spear because the order had given him the dry clothing and he did not know how not to. He drove it between the shoulder blades. The sound. Not the sound of a wound being made. Every person who had ever made a wound knew the sound a wound being made produced \u2014 the specific acoustic profile of penetration, of tissue accepting a foreign object with the grudging biological inevitability of tissue that cannot prevent the foreign object but can record the event in every fiber. Jorin had heard that sound before, had delivered it once in a canal district fight three years before the order, and knew the specific quality of it. This was not that sound. This was the sound of a eath that did not rattle. The silence that followed the second breath was the worst thing in the room. Because the silence of the second non-rattling breath was the silence of a thing that had finished doing what it was not supposed to be able to do and was simply breathing now, simply alive now, simply occupying the room with the unconcerned aliveness of something for which being alive was not a remarkable state but simply the ongoing condition. The grin. She turned and the grin was on the face and it was not an expression. Jorin had been a good person for twenty-seven years and had understood expressions, had learned to read the specific architecture of a face arranging itself to communicate something \u2014 the micro-tension of the muscles around the eyes, the specific positioning of the mouth relative to the jaw, the thousand small decisions a face made every second to produce the signal it was trying to send. He had been good at reading them. He had sat with the Golem-archivist for six days and had read the expression of grief and confusion and had responded to it and had been right about what it was. The grin was not an expression. It was what the face was when it was not expressing anything. The default configuration. The configuration the face settled into when it was not actively doing anything with itself \u2014 not communicating joy or threat or warmth or coldness or any of the things faces communicated when they were in the business of communicating. The grin was the face in the absence of the business of communicating. The grin was what remained. Above the grin, the eyes. The eyes were doing nothing. Not cold. Not warm. Not present in the way that eyes were present when they were looking at a person \u2014 when they were engaged in the mutual recognition that two conscious things extended to each other when they occupied the same space. The eyes were processing. Receiving input, categorizing it, filing it. The eyes of a system running its functions. The cision that was not simple and had arrived, through the un-simple process of making it, at the simple formulation of it. \"And because you're going into the kingdoms alone and you will die in more loops than necessary doing it that way. Not from lack of competence. From lack of certain kinds of information that I have and you don't and that I won't be filing in reports anymore.\" \"You're a spy.\" \"Yes.\" \"Choosing to stop.\" \"I've read three hundred and forty-one versions of you in the borderland field,\" she said. \"The wanting is in the record alongside the fear \u2014 what you want, underneath everything the fear is covering. At full depth. For two years. I believe you.\" She held his gaze. \"There are very few things I've read in fog records that I believe at the level of: this is true regardless of what the person knows about themselves. The wanting-to-not-burn-the-world, I believe. Not because the atmospheric record shows it. Because the atmospheric record shows it three hundred and forty-one times across six years of dying and returning, and that's the kind of evidence that's not explicable by performance.\" Loop three hundred and forty-three ended in the fog's middle density, from a hazard he had not yet mapped. He came back to the arcade stone. He said the number. He walked south. He entered the fog. She was there. Same position. Reading the layers while he was dead. He had been coming back to empty spaces for six years. The arcade stone. The canal. The tunnel. The borderland field. The fog. Always the fog, always alone in it, always the only person who knew what was happening because it was happening in the only place where it could happen, which was inside the loop, which was inside the arc of his dying and returning, which was inside him. She was there. She was in the same position she had been in when he died, which meant she had been here while he was dead, which meant she had been reading the layers through the duration of his death, which meant she had been \u2014 what. Present. In the space where he was dead, reading the atmosphere of the space where he was dead, keeping the record of the space where he was dead in the way the fog kept everything: without distinguishing, without deciding which things were worth keeping, simply keeping. He stood in the fog. He said: \"The heart remembers you well.\" It was the Nebel greeting. It was the thing Nebel people said to each other, between people who had not seen each other in a long time and between people meeting for the first time, because the fog kept both kinds of encounters at equal depth and the Nebel people had long ago stopped distinguishing between the long-known and the newly-met because the fog held them both with the same care. Something shifted in her face. The smallest possible shift: the Mist Sprites in the layers around them recorded it as a micro-change in the atmospheric signature of her presence, a change of the kind that the system noted under: emotional event, unclassified, duration: brief. Then she turned back to the layers and told him what she had found while he was dead, and they moved south, and this was the first loop in three hundred and forty-three in which he had not died alone, and he filed this in the third category where the nameless things lived alongside the count and the rope. \u2726 The Book of Thirteen \u2726 The Sword of Endurance Being the testament of Liraeth, who continued She was not a warrior. She had never wanted to be a warrior. She had wanted to be a person who was useful to other people in the specific way of someone whose presence made the difficult things slightly more survivable, and she had spent eleven years in a hospice on the edge of the Lalaka canal district being exactly that person, tending to those the city had stopped being able to process before they finished dying. The sword found her in the eleventh year, twelfth day of winter. She was sitting alone in the main room with the tiredness of someone for whom tiredness had become the baseline \u2014 not temporary tiredness, not the tiredness of a difficult day or a difficult week but the specific tiredness of a person who had been tired for so long that the tiredness had become the condition rather than the state. She had forgotten what not-tired felt like. She sometimes tried to remember and found she couldn't. The sword was in the corner. She had not put it there. \"What do you carry?\" it asked. Everything that was left when people finished. What they had that no one came to take. What they had that I couldn't give back and couldn't put down. \"And you will not put it down.\" I don't know how. I've tried. The trying produces the same thing as not trying. I've stopped distinguishing between cannot and will not. The distinction stopped being useful. \"Endurance is not what happens when you do not break. It is what happens when you break and continue anyway. You have been breaking for eleven years and continuing. This is not strength. This is not virtue. This is something older than both. This is the fact of a person who has continued past the point at which stopping would have been forgiven, and who continues still, for no reason except that continuing is what they do.\" She was quiet for a long time. Yes, she said. That's the whole of it. She chose the way she had been choosing every morning for eleven years: by not stopping. The sword became covenant. She is in every person who continues past the point at which stopping would have been forgiven. In every person who breaks and does not identify the breaking as a reason to stop. In every morning that follows a night in which the only thing that was clear was that the morning would come and would have to be continued through regardless. She is there. She continues. \u2726 End of Chapter Two \u2726 <div"}, {"lb": "Chapter Three", "ti": "The Veiled Heart", "ep": "Whisper, whisper \u2014 tell me what is hidden there beneath the face beneath the face so dim. For Mimicry is path, and", "tx": "Chapter Three The Veiled Heart Whisper, whisper \u2014 tell me what is hidden there beneath the face beneath the face so dim. For Mimicry is path, and Mimicry is dream, and fate is carved upon the question's stream. Who art thou? Who art thou when no one sees? The fog has thee. The fog agrees. \u2014 The Whisperer's Lullaby, Cult of Mimicry, Nebel The Veiled Hearts maintain the intelligence network from Lalaka's outer territories to the Nebel fog-line. Their name comes from the Nebel tradition of wearing a second layer beneath the visible one: the visible layer for the world's consumption, the second layer for the truth's keeping. A Veiled Heart operative, compromised, will sacrifice the visible layer without hesitation. They have been known to sacrifice considerably more. They are not sentimental about the visible layer. They keep the second one. \u2014 Intelligence Survey of the Eight Kingdoms, Yowwed Commission, Year 303 I Crystal's instruction arrived through the raven on the third morning in Nebel. She had been working the outer cell network \u2014 the Sworn-rank observation posts that ringed the eastern Nebel fog-line, the Ordained-rank coordination hub in Karev's Crossing, the two deep-cover assets in the Veiled Hearts intelligence service who had been in place for six and nine years respectively and who required the quarterly contact that the operation's long-term maintenance demanded. She had been doing this work for three centuries. The work was the texture of her operational life in the way that the canvas awnings were the texture of the Lalaka commercial district's morning: present at the level of the unremarkable, simply the conditions under which everything else occurred. The raven found her in the eastern fog-line's outer station, a stone building that had been a shepherd's shelter three centuries ago and had been a Worshiper observation post for two centuries and a half. The raven landed on the window ledge and the instruction arrived in the way Crystal's instructions arrived: a quality of knowing that transferred without medium, present inside her before she registered receiving it. The fog-reader has made contact with the heir. Let the contact proceed. Let the fog-reader move with the heir. Her capacity will be necessary in Lalaka. Do not intercept. Do not interfere. Let it happen. She held the instruction. Not with resistance. The instruction was clear, operationally sensible, consistent with the mechanism's requirements: the fog-reader's atmospheric reading capacity was a necessary component of the heir's team, and the heir's team needed to be assembled before Lalaka, and the fog-reader's decision to go off-mission and join the heir was producing precisely the assembly result that the mechanism needed. Crystal had planned for this. Crystal had always planned for this. The fog-reader's going-off-mission was itself part of the plan. Something happened in her chest when she confirmed the instruction. Not pain exactly. The thing adjacent to pain that the body produced when it had been asked to do something that cost it something, and the asking had been Crystal's and the confirming had been hers and the two things were both true simultaneously and the body filed the cost as the cost rather than as a protest. For one half-second \u2014 brief, already over before she had fully registered it \u2014 the grin shifted. Not disappeared. Not faltered in any way that would have been visible to an observer. Shifted, in the way of something whose foundation had been briefly uncertain. Then it was back. Fixed. Exactly as it had always been. She had been returning to Crystal's fire for three centuries. Three centuries of the direct contact's warmth arriving through the Ordained connection and sitting in her chest with the quality of the fire Crystal had built Wanoon-large the first night: real, intended, built at the size that said welcome. Crystal was the only fire she had sat at in six thousand years. Not the only warmth she had encountered \u2014 she had been in warm rooms and warm climates and had been adjacent to warm fires for six millennia. But the only fire that had been built for her. The only warmth that had the quality of: this fire is here because you are here, specifically, and the fire is Wanoon-large because the Wanoon-large size is the size that says you are worth a large fire. Crystal was warm about the fog-reader joining the heir. Crystal was warm about everything the mechanism required. She confirmed the instruction. She smoothed the coat seam. She moved south toward the second network cluster, toward the Nebel settlement that had the Veiled Hearts' most deeply embedded asset, toward the next piece of the three-century operational architecture that the next three months would complete. The grin was on her face. The frame held. II Loop three hundred and forty-six ended in the fog's deep density. He came back to the arcade stone and said the number and moved south and entered the fog and she was there and she told him what she had found in the layers while he was dead, which was: the path through the density's hazard that had killed him in loop three forty-six, which was a Mist Sprite maintenance gap, an area where the layering had thinned due to a pressure event three months prior and had not fully re-established, which created a zone of atmospheric instability that interacted poorly with the mark's cold and produced a specific feedback effect in the zone that was hazardous to anyone carrying the mark's signature. The hazard was not in his previous loop-death data because the pressure event was recent and the zone had not been hazardous in earlier loops. \"Three meters left of your current path through the density,\" she said. \"The Mist Sprites have noted the gap. The gap is in the maintenance logs. The gap will close in approximately four days as the layering re-establishes.\" He adjusted. He moved three meters left. He moved through the fog without dying. This was what it changed. He had been adjusting his paths through the known hazards for three hundred and forty-six loops through dying, which was the only method available to him: die, learn the hazard's specific parameters from the death's information, adjust, continue. Now he had a different method: a person who could read the hazard's parameters without dying through them, who had access to the Mist Sprites' maintenance logs, who could tell him three meters left before he reached the gap. The loops were still running. He was still dying. But he was dying through things he had not yet been told about rather than dying through things that could have been read in the layers. The death count was decreasing. In the first three days after Miren joined him, he died eight times. His previous three-day average was thirty-one. The improvement was not comfort \u2014 he had stopped expecting comfort in the loops after loop forty, when it had become clear that comfort was not a resource the loops produced \u2014 but it was operational improvement, real and measurable, and he filed it under: confirmed, significant, adjust for. They were working their way south through the Nebel territories toward the fog-line's edge and the Halak border beyond. The Nebel fog was thicker in the south, where the Mist Sprites maintained the oldest layers \u2014 the deep strata that went back three thousand years and held the atmospheric record of three thousand years of this specific piece of the world. Walking through the deep strata was walking through three thousand years of preserved atmosphere: the specific cold of the years when the Halak border had been disputed, the specific warmth of the Inferno Vigil's three-hundred-year-old fire carried in the layers from the year it had first crossed from Zhala into the Nebel corridor, the specific quality of air that had been present when the first avian priest had walked this route carrying the Chronicle northward. Miren read the layers as they walked. She read them in the receiving way \u2014 not actively reaching into the layers for specific information but making herself available to what the layers produced, the way a person opened a window and received the air rather than extracting specific molecules from it. She reported what was relevant to their movement. She held what was not relevant to their movement in the fog-reader section of herself that the fog had developed in her over two years of sustained contact: the section that kept what it found, without distinguishing, because the fog had trained her to keep what it found the way it kept what it found. She said: \"The vendor from loop eighty-nine is in the deep strata here.\" They were walking through the section of the Nebel fog that ran adjacent to the eastern Lalaka commercial district's atmospheric corridor \u2014 the specific stretch where the layers carried the ambient record of the commercial district's activity, the buying and selling and the Festival overflow vendors who had been pushed to the secondary location by the Hoarded Flame Festival timing. The vendor's passage was in the layers. The vendor's daughter, who had been in the market somewhere, going to find her mother after. The passage of the daughter's movement through the market, preserved in the layers at full fidelity, the specific atmospheric record of a fourteen-year-old moving through a crowd looking for her mother. He kept walking. Miren did not push this. She had reported the presence in the layers because it was present in the layers and she reported what was in the layers. She did not add anything to the reporting. She did not offer the interpretation that was available to her \u2014 the specific interpretation that the fog keeping the vendor's passage and the daughter's passage was not only a record of what had happened but also a kind of continuance, the specific quality of something that had been kept rather than simply passed. She did not offer this because he was still walking and his face was doing the thing his face did when he was holding something in the interior at the full-held-thing pressure, the maintained-section pressure, the not-going-to-the-edges pressure, and adding anything to the reporting would have been adding something to a pressure that was already at the right level and did not need more. She read the layers. She reported what was relevant. She held what she kept. Loop three hundred and forty-nine ended at the Nebel-Halak border crossing from a guard rotation she had been about to describe when the death arrived first. He came back. He said the number. She was there. She told him the rotation. \"Loop three hundred and fifty,\" he said. \"Yes,\" she said. \"You were going to tell me about the rotation.\" \"I was. The rotation changes at the second bell, not the third. The third-bell assumption is in your loop data from loops sixty-eight through two hundred and eleven. The rotation changed in loop two hundred and twelve. You didn't have the two-twelve data because two-twelve was one of the loops where you came back slightly wrong. You kept the adjustment and assumed the third-bell timing was still current. The second-bell timing is the current one.\" He filed this. He had been dying at the Nebel-Halak border from third-bell assumptions in loops that should have been survivable. The third-bell assumptions were wrong and had been wrong since loop two hundred and twelve and he had not known because loop two-twelve had been one of the wrong-return loops and the wrong-return loops did not produce reliable data. \"How many border deaths from the third-bell assumption?\" She told him. The number was larger than he had estimated. He filed this under: confirmed, significant, the fog-reader's access to the maintenance logs is not a peripheral benefit of the partnership but a central one. Adjust assessment accordingly. They crossed the border at the second bell. They crossed without dying. He noted this. He noted it the way he noted the canal and the tunnel and the specific sequence of the forty-seven steps: as a confirmed fact that changed the operational picture, filed with appropriate weight, neither over-celebrated nor under-acknowledged. They crossed without dying. The border was a known hazard that had now been navigated without dying. This was the improvement. This was what the partnership changed. He was aware, in the third category, of something else it changed. He did not examine this. He filed it in the third category where the nameless things lived and he crossed the border and they moved south toward Halak. \u2726 The Book of Thirteen \u2726 The Sword of Clarity Being the testament of Soren, who could not stop seeing His perceiving apparatus had been built, through some specific combination of inheritance and circumstance that the sword's archive did not fully explain, to remove from the visual field everything the observer would prefer to see and replace it with what was actually there. Accurately. Without softening. Without the standard human visual processing that slightly adjusted incoming information toward the expected and the preferred before delivering it to consciousness. He had been an advisor for thirty years. Three kings, four councils, two wars, one peace. The peace had failed. He had told them it would fail. He had told them specifically and clearly and accurately why it would fail. They had not wanted to hear why it would fail, had wanted to hear something different, had found advisors who told them something different, had found that the advisors who told them something different were telling them something different rather than something accurate. The peace had failed in exactly the way he had described. He was tired in the specific way of people who can see clearly and have been seeing clearly for thirty years in a world that did not consistently want to be seen clearly. The sword found him in the council chamber of the fourth council, after the peace's failure, alone with the documentation of the failure that he had been ordered to compile and that he was compiling with the specific flat accuracy he had always brought to everything. \"What do you see?\" it asked. He told it. Everything. The room, the situation, the documentation, the council, the kings, himself. He told it the tiredness. He told it the specific way the tiredness had built across thirty years of accurate seeing in a world that had used the accuracy selectively and the rest of the time had found it inconvenient. \"And you will not stop seeing.\" I can't. The seeing isn't a choice. It has never been a choice. I have been accurately perceiving things since before I understood that accurately perceiving things was a capacity that not everyone had to the same degree. I have been living with the accurate perceiving for thirty years. I will be living with it for however long remains. \"Then become the seeing itself. Not the one who sees \u2014 the act of seeing. The world requires clarity the way it requires the other swords. Not comfortably. Not gratefully. Necessarily.\" He chose. He is in every act of genuine perception. In every moment when a person removes the preferred distortion and receives what is actually there. In every advisor who tells the council what the council does not want to hear and tells it accurately and tells it again when the first telling does not produce the response accuracy deserved. He is there. The seeing does not stop. \u2726 End of Chapter Three \u2726 <div"}, {"lb": "Chapter Four", "ti": "The Still Horizon", "ep": "", "tx": "Chapter Four The Still Horizon The Still Horizon Festival: held on the longest night of the year, when the Halak settlements extend the darkness deliberately by covering every light source for a period of three hours at the festival's center. The Halak people call this the true still : not the absence of light as a lack, but the presence of the dark as a condition chosen and inhabited fully. The three hours of true still are said to be the period during which the Stillness Authority's presence is most palpable, the Boundary thin enough that the quality of the other side becomes, briefly, a texture in the air rather than a theoretical concept. Field researchers who have been present for the true still describe, uniformly, the experience of feeling witnessed. Not watched \u2014 witnessed. The distinction, they report, matters considerably. \u2014 Annual Survey of the Eight Kingdoms' Festivals, Lalaka Commission, Year 312 We have been prepared for this since before you were born. The preparation was not for you specifically \u2014 the preparation was for the Stillness heir, and you are the Stillness heir, and the preparation therefore applies to you specifically. But you are not the cause of the preparation. You are the arrival of what the preparation was for. We hope you understand the difference. We have been waiting. Now you are here. The waiting is complete. This is not a small thing. \u2014 Halak Watcher's greeting, delivered to the heir at the commencement of the meeting I The road from Nebel to Halak took twelve loops. Not twelve loops of dying \u2014 twelve loops of transit, which was different because twelve loops of transit meant four deaths on the road and eight completions, which was a death-to-completion ratio that three months ago would have been unimaginable and was now simply the product of having access to the atmospheric layers' information before he needed to die through the information to obtain it. Four deaths in twelve [Continue reading in the full novel...]"}, {"lb": "Chapter Five", "ti": "The Skyward Line", "ep": "Stand upon the skyward line where consequence is carved in stone. Every act has permanent design \u2014 no action stand", "tx": "Chapter Five The Skyward Line Stand upon the skyward line where consequence is carved in stone. Every act has permanent design \u2014 no action stands in debt alone. The Golem marks the living and the dead; the record knows what thou hast said, and what thou hast left unsaid, and the weight of both in the permanent accounting. \u2014 Yowwed national anthem, second verse The Tome Golem catalogues everything that passes through its operational radius. Everything. The first Archivist who designed the Tome Golem specification included no exceptions, no categories of things that the Golem would not attempt to catalogue. The reasoning, as documented in the original specification: if you add exceptions, you introduce the problem of deciding what belongs in the exception category, and the problem of deciding what belongs in the exception category is precisely the problem you built the Golem to eliminate. No exceptions. Everything. If the Golem cannot catalogue something, that is information. That is, in fact, significant information. A gap in the record is a record of a gap. \u2014 Internal Archive of the Yowwed Golem Commission, Year One I The Tome Golem had been standing in the commercial district street for forty minutes with the stylus raised and the book open and the cataloguing process running, and the cataloguing process had not produced an entry. Not a failed entry \u2014 the process was not failing. The process was running correctly. The process was doing what the process was designed to do: receive input from an entity within the operational radius, identify the entity's categorical properties, assign the entity to the appropriate entry template, complete the entry with the identified properties, close the entry, continue. The process was running correctly. The entry was not forming because the entity was not assignable to any entry template. The process ran again. The entity was in the operational radius. The entity had properties. The [Continue reading in the full novel...]"}, {"lb": "Chapter Six", "ti": "The Inferno Vigil", "ep": "", "tx": "Chapter Six The Inferno Vigil The Inferno Vigil fire-walking: not a ceremony of pain-endurance. The Zhala tradition is explicit on this point. The fire-walker does not walk through fire to demonstrate that they can tolerate pain. The fire-walker walks through fire to demonstrate that the decision to walk has been made completely, that the force of the decision has been given fully to the direction of the walking, that there is nothing held back for the contingency of stopping. The Vigil measures not the fire-walker's pain threshold but the completeness of their commitment. A fire-walker who walks through fire in agony but without hesitation is honored. A fire-walker who stops before the crossing, regardless of the reason, is not. The fire tells you nothing about the walker's pain. The fire tells you whether the force was given. \u2014 The Iron Beak Hymn, annotations on the Inferno Vigil, Zhala Commission of Rites The Hungerwing at rest is indistinguishable from the thermal itself. At rest they do not make sound. They are the thermal, and the thermal is warm air rising from the baked stone of the Wanoon highlands, and the warm air rising is simply weather. They are patient in the way of things that do not need to be anything other than patient. A researcher who has spent time observing Hungerwings at rest reports that the experience is not of observing a creature but of observing a quality of air that has decided to be a creature without entirely committing to the decision. The wings are the part that committed. The rest is still deciding. \u2014 Bestiary of Chela, Vol. VII, Field Notes, Wanoon Sector I Crystal's warmth was the most disturbing thing she had encountered in six thousand years. Not in the visceral way of the things she had encountered that were immediately, obviously disturbing \u2014 the things that produced fear or revulsion in the ordinary sense, that were wrong in the way of things that violated the body's expectation of th\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Seven", "ti": "The Demon Sisters", "ep": "", "tx": "Chapter Seven The Demon Sisters The Veyra-Lyra bloodline: appears in the military annals twice. The first appearance is as the reason a Wanoon border incursion stopped. The entry for their intervention is six words: the sisters were there. We retreated. No further annotation. The second appearance is in the investigation into the loss of the Zhala border garrison. Both appearances note the same thing: the sisters were there. The record does not speculate on what this means. \u2014 A History of Border Conflicts in the Zhala-Wanoon Territory, Vol. II The Authority of Desire does not take. It gives. Every offering bowl worn smooth by a thousand years of hands is evidence of this: the people came and the Desire-Authority received them and gave what it had to give, which was not the thing they asked for but the thing they needed, which was the recognition that the asking was valid, that the desire was real, that the wanting was not a failing. The Desire Authority does not heal the wound of wanting. It witnesses the wanting. In the Zhala theology, witnessing is the only healing that is not temporary. \u2014 The Desire Authority: A Theological Survey, Zhala Devotional Institute I She was in the village before the team arrived. She was often in a place before the people she was watching arrived. This was the operational advantage of moving at the pace of decision rather than the pace of bodies: she could be in a position before the position was required, could have the advance intelligence before the intelligence was needed, could have already done the accounting of a space before anyone else had begun to think the space needed accounting for. She had been using this advantage for three centuries in Crystal's service and for the five thousand, seven hundred years before that in the service of survival. The village square was small. Shrine villages in the Zhala border territory tended to be small \u2014 ten to twenty families, the specific scale of [Continue reading in the full novel...]"}, {"lb": "Chapter Eight", "ti": "The Climbing Eagles", "ep": "Stand at the mirror, child of ours. That is not thee \u2014 that is the shape of what thou couldst become. The mirror h", "tx": "Chapter Eight The Climbing Eagles The Clevel Climbing Eagles: no formal rank structure. No command hierarchy in the conventional sense. The person who can reach the position first is the person whose tactical judgment about the position is treated as authoritative. The person who got there second accepts the first-arriver's assessment, not from deference but from the practical understanding that first arrival is evidence of superior position-assessment capacity, which is the skill the Eagles prize above all others. Effectiveness rating: extreme. Engagement recommendation: do not engage on terrain of their choosing. There is, effectively, no terrain that is not their terrain. \u2014 Military Assessment of the Eight Kingdoms, Lalaka Strategic Archive, Year 287 Stand at the mirror, child of ours. That is not thee \u2014 that is the shape of what thou couldst become. The mirror holds the future's brow, the climbing path from here to now. Look long. Look well. Then climb. \u2014 Mirror of Shadows, Clevel coming-of-age ceremony song I She had ordered the ambush. The operational ledger entry for the Clevel ambush was one of the longer entries in her three-century operational record, not because the operation was complex \u2014 it was not complex, was in fact among the simpler operations she had conducted in Crystal's service \u2014 but because the ledger was honest, and the honest entry required more than one line. Clevel, day three of the heir's approach. Worshiper ambush ordered, twelve Sworn-rank operatives, three approach vectors covering the heir's two statistically likely routes through the Mirror Path approach. Objective: capability assessment. Rationale: the mechanism's Lalaka stage requires the team to be functional at a level sufficient to penetrate the Library's security systems and reach sub-level seven. Crystal's confirmation that the team is needed intact does not resolve the question of whether the team's current capability is suf\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Nine", "ti": "The Mirror Path", "ep": "Thou arriv'dst in the fog that the world has been in since before thee was thee. The fog is not confusion. The fog is al", "tx": "Chapter Nine The Mirror Path The Mirror Paths of Clevel: transparent walking surfaces suspended between the peaks at altitudes ranging from eight hundred to fourteen hundred meters above the valley floor. The transparency is not glass \u2014 the material predates the Kingdom of Clevel by at least two centuries and has not been successfully identified by the eight separate materials-science commissions that have attempted the identification. It reflects the walker's image back at them during crossing. Field note: those who look away from their reflection are noted. Not formally, not officially, not in a way that produces institutional consequences. They are simply noted by the Clevel people who maintain the paths, who have been noting for three centuries which walkers look away and which ones don't, and who have their own conclusions about the distinction. \u2014 Architectural Survey of the Eight Kingdoms, Vol. IV Thou arriv'dst in the fog that the world has been in since before thee was thee. The fog is not confusion. The fog is all the possibilities that have not yet become decisions. Stay in the fog. The boundaries of certainty are what's one-sided. \u2014 Nebel birthday song, sung on the morning of the birthday rather than the evening I She crossed the Mirror Path without looking at her reflection. She had made this decision three centuries ago, on the first crossing, when she had stood at the midpoint of the path and had looked at the reflection and had held what the reflection contained. Not long \u2014 not the crossing's full duration. A specific period of time that she had not allowed herself to measure afterward and had not gone back to estimate and had not permitted to become a number, because making it a number would have made it the kind of thing that could be examined for what the number revealed, and she had not wanted to examine what the number revealed. She had decided, after the first crossing, not to look. She maintained t\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Ten", "ti": "The Flame Vanguard", "ep": "", "tx": "Chapter Ten The Flame Vanguard Wanoon: Kingdom of Fury. The Flame Vanguard is the professional military organization that the Wanoon culture has built around the principle that hesitation is the only failure. Not defeat \u2014 defeat is acceptable, is in fact expected, is simply the cost of having committed fully to a direction that did not produce victory. Hesitation before commitment, however, is not acceptable. A Flame Vanguard soldier who commits fully and loses is honored. A Flame Vanguard soldier who hesitates and wins is not. The culture has organized itself around this distinction for long enough that the distinction has become the culture. \u2014 Book of Nations, on the Kingdom of Wanoon The Hungerwing in flight: the wingspan fills the thermal entirely from edge to edge. At altitude, the wingspan reads from the valley as weather. The Wanoon people have incorporated the Hungerwing into their theology of commitment: the Hungerwing commits to the thermal completely, becomes the thermal, is indistinguishable from it in fullness. This is the ideal. The Hungerwing does not hold a portion of itself outside the thermal as a reserve. The thermal receives the whole wing. \u2014 Bestiary of Chela, Vol. VII, Field Notes, Wanoon Sector, supplementary I Wanoon was her Authority's kingdom. Not hers in the sense of ownership. Not hers in the sense of having built it or having governed it or having shaped it in any of the ways that kings and councils shaped kingdoms. Hers in the sense that the specific quality of the place resonated with the specific quality of what she was: the commitment, the directed force, the organized culture of people who had been deciding for long enough that hesitation was the only failure that the deciding had become the culture. She had been dying and returning and refusing to stay dead for six thousand years. She had, in all of that time, never hesitated. Not bravery. The hesitation had never been available to her. She [Continue reading in the full novel...]"}, {"lb": "Chapter Eleven", "ti": "The Hungerwings", "ep": "Hush. Be still. The world is loud. Still the earth and still the cloud. Silence grows where shadows creep. Stillness hol", "tx": "Chapter Eleven The Hungerwings The Worshiper rank structure: Sworn (entry, observation only, no operational authority), Ordained (biological modification, full operational authority, the rank that the network's day-to-day function runs through), Shattered (unreported to any archive, believed mythological by most researchers who are aware of the rank's existence in the founding documents, believed non-existent by most researchers who are not). The gap between Ordained and Shattered is not a promotion gap. The promotion from Sworn to Ordained has documented procedures: selection, modification, training, verification. The gap between Ordained and Shattered has no documented procedures because no documentation of the Shattered rank has survived except the founding documents' description of what the rank is for. \u2014 Intelligence Survey of the Worshipers of Storm, Veiled Hearts Commission, Year 401, classified restricted Hush. Be still. The world is loud. Still the earth and still the cloud. Silence grows where shadows creep. Stillness holds the world from sleep. A half-orc child of wind and dust shall rise to hold what the world must. Hush. The time draws near. Hush. The heir is here. \u2014 The Silent Storm Song, variant collected from a Halak shepherd's daughter, date unknown I Crystal made the second direct contact two days north of Wanoon. The direct contact was the warmth arriving through the Ordained connection with the quality of Crystal in it: the five-thousand-year warmth, not diminished by distance or duration, present in the chest with the fullness that Crystal's contacts always arrived with. The heir is coming north for the first time, Crystal said. He is following the compass for the first time. The mechanism requires the will. Everything before this was preparation. The heir walking north is the approach completing. The mechanism begins now. She was on the Wanoon-Forbidden Forest road. She held the warmth and the information simu\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twelve", "ti": "The Feast of Devoured Name", "ep": "Forget the name. Forget the face. Forget the sorrow. Let the feast begin. The Consumption calling \u2014 come within. W", "tx": "Chapter Twelve The Feast of Devoured Name The Mnemovore: feeds not upon flesh, nor seed, nor bone, but upon the thread of selfhood that connects a person to their history. They do not take what is offered. They take what has already been abandoned and has not yet understood that it has been abandoned. The specific targets of the Mnemovore's attention are the memories and names and attachments that a person has stopped actively maintaining, that have drifted to the edges of the person's deliberate holding. The Mnemovore does not create the abandonment. It finds it. Field note: the best defense against a Mnemovore is to hold everything you hold completely. \u2014 Bestiary of Chela, Vol. IV, Creatures of Consumption Forget the name. Forget the face. Forget the sorrow. Let the feast begin. The Consumption calling \u2014 come within. What thou art numbing is resuming in the form of what comes next. The grief does not erase. It transforms. Consume the grief before the grief consumes thee. This is the way. \u2014 The Nameless Feast, sung by the Devourer Clans around communal fires I The forest could not read her. Its assessing mechanism found the wrong temperature and paused and recalibrated and found it again and paused again and recalibrated again. The mechanism ran this cycle for the duration of her transit through the interior. The mechanism ran the cycle correctly: she was in the interior, she had properties, the properties were consistently the wrong properties for the categories the mechanism had, and so the mechanism kept recalibrating in the hope that the recalibration would produce a category fit. The recalibration did not produce a category fit. The forest consumed through warmth. The mechanism had been selecting targets on the basis of warmth for centuries. She was not warm. She was the Dead Lands' cold in cellular tissue, the specific cold of six thousand years of dying and returning having replaced whatever warmth she had started wit\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Thirteen", "ti": "The Devourer's Truth", "ep": "By thy devouring I am renewed. Nothing is wasted in consuming. The grief that thou art numbing is not erased \u2014 it ", "tx": "Chapter Thirteen The Devourer's Truth On death in the Forbidden Forest: the forest does not distinguish between voluntary and involuntary loss. The forest takes what the forest finds at the edges of the maintained. Field researchers who have entered and returned intact report, uniformly, that the experience is not of being attacked but of being assessed \u2014 of the forest determining, with the patience of something that has been making this determination for centuries, what is held and what is at the edges of holding. The researchers note: the distinction between held and at-the-edges is not made by intention. It is made by the quality of the holding. \u2014 Bestiary of Chela, Vol. IV, Creatures of Consumption: Field Notes, Forbidden Forest Sector By thy devouring I am renewed. Nothing is wasted in consuming. The grief that thou art numbing is not erased \u2014 it is resuming in the form of what comes after. Let me trust this. The gift is in the going. I do not understand the going. I trust the after. \u2014 Prayer to Consumption, spoken before any act of release or transformation I She was outside the forest when it happened. Standing in the approach road with the instruction as the only thing in the room: do not interfere, the forest takes what the forest takes, intact means six when the six exit, Lalaka. She held the instruction the way she held everything Crystal gave her: completely, with the full holding that Crystal's warmth made possible, that the three-century fire had built in her. The instruction was the instruction. It was what Crystal needed. It was what the mechanism required. The herbalist was not one of the seven. He was adjacent to the Judgment component. The mechanism would take the Judgment component through him and would not need him after. This was the plan. Crystal was warm about the plan. She held the instruction. She held the warmth. At the specific moment Crystal had predicted, the forest went quieter than it had\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Fourteen", "ti": "The Return", "ep": "", "tx": "Chapter Fourteen The Return The Lalaka city gate records show the entry of Kola Baru, heir of Halak, on loop three hundred and seventy-eight, accompanied by five companions, at the fourth hour of the morning on the first day of the Hoarded Flame Festival's preparation period. The Golem entry is complete. The Golem entry is bounded. The companion entries: complete. The Tome Golem at gate post seven attempted the entry for the sixth member of the party for four minutes and nineteen seconds before filing the entry under: anomalous passage, ongoing, unresolvable. The Golem at gate post seven has been filing this same anomalous passage entry for two hundred and sixty-three years. \u2014 Gate Records of Lalaka City, Fragment recovered from the Library's administrative sub-level, date uncertain Come, ye faithful of the Flame \u2014 the Festival is open. Lay what thou hast hoarded at the altar of the giving. What thou hast been holding back, the Festival receives. What thou couldst not release alone, release into the flame. The flame does not judge the holding. The flame receives what is given. Give well. Give completely. \u2014 Opening invocation of the Hoarded Flame Festival, spoken by the Chief Archivist of Lalaka I She had been in Lalaka for six days before the team arrived. Six days in the city she had been moving through for three centuries, the specific city that was the mechanism's final location, the place where five thousand years of Crystal's work was going to resolve. She moved through it with the quality of someone returning to a familiar location with the specific knowledge that they were returning for the last time: not the melancholy of endings, which she did not experience in the way that people experienced melancholy, but the specific quality of increased attention that the last-time knowledge produced, the way a person looked more carefully at something when they understood they were going to stop looking at it. The Lalaka street\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Fifteen", "ti": "The Hoarded Flame Festival", "ep": "", "tx": "Chapter Fifteen The Hoarded Flame Festival The Lalaka currency system: four tiers. Comet (lowest), Stellar, Lunar, Solar (highest). The Solar is valued daily by the Archivists' market reading, which produces fluctuations of two to eight percent per day. The Lalaka people do not experience this as instability. They experience it as the currency reflecting the world's daily accumulation of new value, as the accurate and honest expression of the fact that the world's total value is not static but changes day by day as new things are made and known and lost. A currency that did not fluctuate would be a currency that claimed the world's value was static. The Lalaka people find static currency conceptually dishonest. \u2014 Book of Nations, on the Kingdom of Lalaka Accumulate well. Accumulate what matters. The Library is the ideal \u2014 it accumulates everything, it loses nothing, it keeps what the world makes. You are not the Library. You cannot accumulate everything. Therefore: be precise. Know what you are accumulating. Know why you are keeping what you are keeping. The act of keeping is not neutral. The act of keeping is an act of valuing. Know what you are valuing. \u2014 Lalaka educational maxim, first grade I Crystal's third direct contact came on the Hoarded Flame Festival's first day. She was in the Library's administrative wing, in the position she maintained for the Festival period: adjacent to the operational center, close enough to the threshold preparation's botanical component to monitor the preparation's progress, positioned for the approach the heir's team would require. The Festival's first day was the day of maximum operational cover: the Library was at reduced staff, the administrative wing was operating on Festival protocols, and the Hoarded Flame's public ceremony drew the attention of the city's non-Archivist population to the central square and away from the Library's approach vectors. Crystal arrived in the chest with wa\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Sixteen", "ti": "The Library", "ep": "", "tx": "Chapter Sixteen The Library The Library of Life and Death: forty-three floors above street level, seven sub-levels below. The upper forty-three floors are accessible to credentialed scholars and the general Lalaka public under day-pass protocol. The first four sub-levels are accessible to senior Archivists under institutional credentials. The fifth and sixth sub-levels are accessible to the Library's administrative council under dual-authorization protocol. The seventh sub-level has been sealed for three hundred years. The sealing documentation lists the reason as: content requiring extended restricted access pending review. The review has not been scheduled. The content has not been reviewed. The sealing has not been lifted. The Archivists who occasionally ask about this are told the review is pending. \u2014 Library of Life and Death, institutional overview, public access document Every record the world has made lives here. Every name that was ever written down. Every death that was documented, every birth that was registered, every chronicle that was committed to permanent record. The Library does not distinguish between the important and the unimportant record. The Library keeps what is brought to it. The Library has been keeping what is brought to it for three thousand years. The Library contains everything that the world decided was worth keeping. And everything it decided wasn't, that was brought here anyway. \u2014 Archivist's orientation address, delivered annually at the Library of Life and Death I She had been in sub-level seven. Not in the current operational period \u2014 in the early years, before Crystal's third century of building had secured the approach layers in the specific way that made sub-level seven accessible on the timeline Crystal required. She had been in sub-level seven before the sealing, in the period before the Library's administrative council had concluded that the content required the extended restricted ac\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Seventeen", "ti": "The Underground", "ep": "", "tx": "Chapter Seventeen The Underground The Lalaka underground network: two hundred and forty-one people, living in the secondary maintenance tunnels beneath the commercial district. Not refugees \u2014 a community, with the specific social organization that a community develops when it has been operating continuously in the same location for a sustained period: a governance structure, a resource-sharing protocol, an internal economy, a system of education for children born into the network. A community that has made itself in a space that the city above it does not officially acknowledge exists. \u2014 Intelligence summary: Lalaka underground network, Veiled Hearts Commission, classified We do not leave. This is the choice. Not the choice that was made once \u2014 the choice that is made every day. Every day we choose to be here rather than to scatter, to be a community rather than individuals in flight, to maintain the space we have made together in this tunnel rather than to give it up. The maintenance of the space is an act of choosing. We choose every day. We have been choosing every day for four years. \u2014 Statement attributed to Derin, coordinator of the Lalaka underground network I She had known about the underground network for four years. She had known about it because the Ordained operational network had produced it. Not directly \u2014 the Ordained had not built the network. The Ordained had created the conditions that had produced the network: the systematic removal of the bloodline populations whose Authority-connection the mechanism required, the removal conducted on a schedule that Crystal had designed for maximum efficiency and minimum institutional attention. The people who had been ahead of the schedule, who had moved before their removal was due \u2014 the people who had understood, through family networks and community intelligence, that the schedule was coming for them \u2014 had gone underground. They had found each [Continue reading in the full novel...]"}, {"lb": "Chapter Eighteen", "ti": "The Ring Retrieved", "ep": "", "tx": "Chapter Eighteen The Ring Retrieved The ring of the Stillness heir: forged by the Boundary itself at the moment of the Knight's sacrifice. Not a physical forging \u2014 not a smith's work. The Boundary produces the ring the way a wound produces a scar: not as decoration, not as accomplishment, but as the specific material result of a specific event. The ring is the scar of the Knight's sacrifice. The ring knows what it is the scar of. Th

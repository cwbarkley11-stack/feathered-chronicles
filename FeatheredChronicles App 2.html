e ring has been knowing this for three thousand years. \u2014 Chronicle of the Feathered World, restricted access, Scribe Six Do not put the ring on. This instruction appears in fourteen separate documents, written by fourteen separate scribes, across three hundred years of Chronicle maintenance. The scribes did not collaborate on this instruction. The scribes did not compare notes. The scribes arrived at the same instruction independently from different source materials. Fourteen independent findings of the same warning. Field note: fourteen independent findings of the same warning is not coincidence. It is evidence. \u2014 Archive of the Halak Silent Watchers, restricted section, compiled Year 389 I Sub-level seven smelled like three thousand years. Not like old air exactly \u2014 the sub-level's atmospheric maintenance had been running continuously since the sealing, the specific maintenance that the Library's infrastructure provided to all sub-levels regardless of access status. The air had been exchanged. The sub-level was not sealed against the Library's air exchange system. What it was sealed against was access. The air was exchanged. The smell was three thousand years of the ring's presence in the space, accumulated in the sub-level seven walls the way the ring's cold had accumulated in the Knight's descendent's bloodline \u2014 layer by layer, building over the three-thousand-year interval, present in every surface that had been in proximity to the waiting for long enough that the waiting was in t\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Nineteen", "ti": "The First Effect", "ep": "", "tx": "Chapter Nineteen The First Effect The ring's first effect is typically small. This is documented consistently across the vigil records: the first effect is not dramatic, is not immediately recognizable as the ring's taking. The first effect is the loss of a minor memory \u2014 the kind of memory that a person does not notice losing until they reach for it and find it absent, the kind of memory that was not weight-bearing in the person's interior architecture and is therefore not felt as a loss but as a gap. A gap where something used to be. The person may not be able to identify what used to be there. That is the ring's first effect. \u2014 Vigil Records of the Halak Silent Watchers, compiled, on the Ring's Properties I will tell you what to expect on the night the ring begins. Expect nothing dramatic. Expect the small forgetting. Expect to reach for something that was there yesterday and find it slightly out of reach. Expect to know that something is missing but to be unable to name the thing that is missing because the naming requires the thing and the thing is what is missing. If you notice this, the ring has begun. The ring has begun gently. It does not stay gentle. But it begins gently, and you have the gentle beginning. \u2014 Letter from Halak Watcher to a previous vigil-holder, Year 301, found in the vigil records I She was the first to notice. Not the first to notice in the heir's vicinity \u2014 the heir had noticed, had been watching for the first effect since the ring's retrieval, had been monitoring the specific interior landscape of his maintained section for any indication that the ring had begun its accounting. But she was the first person other than the heir to notice, and she noticed not because she was watching his maintained section but because she was reading the atmospheric layers of the room they were in, and the atmospheric layers of the room they were in now contained something they had not contained when she last [Continue reading in the full novel...]"}, {"lb": "Chapter Twenty", "ti": "The Vigil Begins", "ep": "What thou holdest, hold truly. Let no fog take what thou art holding; let no voice whisper to release. The holding is th", "tx": "Chapter Twenty The Vigil Begins Day One of the vigil: the heir puts on the ring. The ring begins the accounting. The heir enters the Library. The heir descends to sub-level seven. The heir stands in the chamber in which the ring waited for three thousand years. The heir stands in the chamber for one day. This is the vigil's first day. This is the vigil's first requirement: to be present, to hold still, to be in the chamber that is the ring's origin and the vigil's commencement. To stand in it for one full day. To hold. The vigil is one thousand and ninety-seven days of this. Every day: to hold. \u2014 Vigil Records of the Halak Silent Watchers, on the Vigil's First Day What thou holdest, hold truly. Let no fog take what thou art holding; let no voice whisper to release. The holding is the vigil. The vigil is the holding. The Boundary holds because thou holdest. Do not release. Do not release. Do not release. \u2014 The Heir's Instruction, passed through the Halak bloodline, generation to generation, origin unknown I The Hoarded Flame Festival's final ceremony was ending when she moved into position. She had chosen the Festival's final ceremony as the vigil's commencement date because the final ceremony's crowd cover provided the operational protection the vigil's first day required: maximum civilian presence, minimum institutional attention, the specific atmospheric condition of a city returning from its highest ceremonial state to its ordinary state, the returning characterized by the specific reduced-attention that followed peak-intensity events. The city was coming down from the Festival. The city was tired and warm and full of the specific post-Festival quality of a community that had given what it had been holding and was now in the specific position of having nothing left to hold back. She was in the administrative wing. Crystal was in the Library. She knew this. She had known it since Crystal's appearance six days ago. Crystal moved t\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-One", "ti": "The Fog Thickens", "ep": "She was reading the Library's atmospheric layers at the forty-third floor's northern window.", "tx": "Chapter Twenty-One The Fog Thickens The ring's memory-taking follows a predictable sequence in its early months: peripheral first, then adjacent to the peripheral, then central. What is held most tightly is taken last. The ring does not skip. The ring does not negotiate. The ring takes in sequence. The sequence is the accounting and the accounting is just in the specific sense that it does not distinguish between what the holder considers important and what the ring considers necessary. The ring's necessity and the holder's importance are not the same assessment. \u2014 Vigil Records of the Halak Silent Watchers, on the Ring's Sequence The fog keeps everything. I have been reading it for three years and I have not found a thing it failed to keep. It keeps the traces clearly. It keeps the gaps too \u2014 a gap in the layers is as faithfully kept as the presence. The gap is information. The gap tells you: something was here, and is here no longer. The fog notes this. The fog does not assess this. The fog keeps the gap the way it keeps the presence: completely, at full fidelity, without judgment. \u2014 Miren's field notes, Nebel atmospheric survey, Year One of the heir's approach I Day fifteen. She was reading the Library's atmospheric layers at the forty-third floor's northern window. She had been reading them every day since Day One. Not for the heir's traces \u2014 she had access to the heir's traces directly, was in daily contact with the heir and could read his atmospheric signature from proximity. She was reading for the gap's development. The ring's taking left gaps in the layers. Not visible to ordinary observers \u2014 the gaps were in the atmospheric record, the specific signature record that the fog's Mist Sprites maintained at the layer level rather than the surface level. She had access to the layer level. She could read the gaps. Day fifteen's reading produced the third gap. Not the third small peripheral gap. The third gap of\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Two", "ti": "The Loops Without Record", "ep": "", "tx": "Chapter Twenty-Two The Loops Without Record On the interaction between the loop-anomaly and the ring's taking: the loop death accelerates the accounting. Each death and return costs the ring an additional amount from the maintained section's peripheral layers. The heir who dies frequently will find the ring's sequence moving toward the center faster than the vigil records' baseline. Field note: the heir should not die. This instruction appears obvious. It is not obvious. It is the most important instruction in the vigil record and it appears obvious and it is not and the heirs who have misunderstood it as obvious have universally found themselves in the ring's accelerated sequence by month four. \u2014 Vigil Records of the Halak Silent Watchers, on the Loop-Death Interaction The Mnemovore does not announce itself. The Mnemovore does not make itself known. The Mnemovore is the absence in the layers \u2014 the gap where the presence used to be, the space that was full and is no longer full, the record that was complete and has a gap in it. The Mnemovore is indistinguishable from forgetting. It is worse than forgetting because forgetting is the self losing what it cannot hold. The Mnemovore is something else removing what the self is still holding. The self does not know the difference. That is the whole horror of it. \u2014 Bestiary of Chela, Vol. IV, Creatures of Consumption: Supplementary Notes I She had been watching the loop-death counter. Not the three hundred and ninety-two loops from before the vigil. The vigil-period loop-deaths: the deaths that were occurring in the vigil's operational context, the Ordained network pressure producing the hazards that were producing the deaths, the deaths producing the ring's acceleration, the acceleration producing the sequence moving faster toward center. She had been watching the counter since Day One. The counter was in the atmospheric layers' record: each death left a gap in the trace that was di\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Three", "ti": "What the Scholar Found", "ep": "", "tx": "Chapter Twenty-Three What the Scholar Found The founding-era Lalaka chronicle, Third Volume: the specific document that has three living scholars capable of reading it. Of the three, one has declined to continue the translation on the grounds that the material in the third volume's later sections is not material she is able to be the person who made public. One has been translating for six years and has reached page forty-seven and has not progressed past page forty-seven in two years. The third scholar is currently in the Lalaka Library and has been translating for two years and set the work aside for four months and has returned to it. \u2014 Catalogue of Pre-Kingdom Documents, Lalaka Archive Commission The founding-era chronicle is not a history. I want to be precise about this before I continue. A history is a record of what happened and why it happened and what it means that it happened. The founding-era chronicle is something else: a record of what was present, without interpretation, without meaning-making, without the historian's natural impulse to find the pattern that makes the presence comprehensible. The founding-era chronicle records presence. It records what was there. It does not tell you what to do about what was there. It does not tell you whether what was there was good or terrible. It was there. Here is the record of it being there. That is the chronicle. \u2014 Selena's translation notes, founding-era chronicle, third volume, page one I She was on page fifty-two when she found it. Not the fifty-second page of the chronicle. The fifty-second page of her translation, which was page approximately eighty of the chronicle's third volume, which was the volume that the first scholar had declined to continue and the second scholar had stalled on for two years. She had been moving steadily: two to three pages per day in the accessible archive, in the specific quality of immersive translation work where the translator had been in t\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Four", "ti": "The Architecture of What Remains", "ep": "She was watching him from the accessible archive's west entrance.", "tx": "Chapter Twenty-Four The Architecture of What Remains Month three of the vigil is typically the period of maximum visible impact on the heir's social functioning. Not from the taking itself \u2014 the taking in month three is in the adjacent-to-central range, and the adjacent-to-central range is not the most central and therefore does not impact the heir's core self-recognition. The impact is the gaps: the heir begins to be aware of the gaps in a way that was not present in months one and two, begins to notice the absences in their own interior rather than only noticing the things still present. Month three is the month of noticing what is not there. \u2014 Vigil Records of the Halak Silent Watchers, on Month Three I keep a record of what I cannot remember. Not to replace what is missing \u2014 a record cannot replace the thing itself. A record of the absence is not the thing. But the record confirms that something was there. The record says: at this location in my interior, something existed. I know this because I know the shape of the absence. The absence has a shape. The shape tells me something was here. I write down the shape of the absence. The shape is not the thing. The shape is evidence that the thing was real. \u2014 Letter attributed to a previous vigil-holder, Halak archive, Year 278 I Day seventy-seven. She was watching him from the accessible archive's west entrance. Not watching him watch \u2014 watching him not notice. This was the thing that had begun in month two and had become more pronounced in month three: the not-noticing. Not the not-noticing of someone who had chosen not to notice. The not-noticing of someone whose noticing apparatus was developing gaps of its own, not the ring's takings but the secondary effect of the ring's takings on the adjacent territory: the space around each taken memory developing a slightly reduced resolution, a slight softening of the detail in the vicinity of the gap, the way a photograph\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Five", "ti": "The Eve", "ep": "", "tx": "Chapter Twenty-Five The Eve Day 97 of the vigil: the heir has been holding for ninety-seven days. The ring has been integrating for ninety-seven days. The ring has reached the adjacent-to-central territory's deepest layer. The ring has not yet reached the central maintained section. The central maintained section is protected by the specific quality of holding that only the most deeply committed interior architecture can produce. The ring is patient. The ring has been waiting for three thousand years. The ring can wait for the integration to proceed at the pace the heir's holding permits. \u2014 Vigil Records of the Halak Silent Watchers, on Day 97 The fog does not distinguish between the living and the dead in its keeping. Both leave traces in the layers. The living person passing through leaves a bounded trace that closes at exit. The dead person's trace is already closed. The fog keeps both. The fog does not know the difference between the trace that closed at exit and the trace that closed at death. The fog keeps the shape. The fog does not assess the shape. The fog keeps. \u2014 Miren's field notes, atmospheric survey, Year Three I The team gathered in the accessible archive on Day 97. Not for a meeting. They had stopped distinguishing between meeting and not-meeting in the second month, when the Ordained network's presence in the city had made the distinction operationally meaningless: they were always in each other's operational proximity, always in the specific vicinity that the vigil's maintenance required, always in the space where the vigil was occurring. The gathering on Day 97 was not a meeting. It was the team on the eve of the approach to the Library's final stage, the day before the Ordained network had identified as their day of direct engagement with the team's access to sub-level seven's approach corridor. He looked at the five people in the room. He said their names. Miren. Tasmin. Selena. Lyra. Veyra. The reader counts w\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Six", "ti": "The Weight of the Door", "ep": "Fury is not anger. Fury is the complete commitment of force to a direction. Anger is unfocused. Fury is the focused form", "tx": "Chapter Twenty-Six The Weight of the Door The Ordained engagement protocol: precision, not force. The Ordained are not deployed to destroy. The Ordained are deployed to resolve. The resolution is defined by the operational objective. The operational objective defines what resolving means in this context. The Ordained interpret the objective faithfully and execute the interpretation completely. \u2014 Worshiper of Storm internal document, Ordained operational guide, Year 241 Fury is not anger. Fury is the complete commitment of force to a direction. Anger is unfocused. Fury is the focused form. The Fury Authority does not give anger. It gives direction. The direction is everything the anger could have been if it had known where it was going. \u2014 Chronicle of the Feathered World, on the Authority of Fury I The approach corridor was twenty-seven Ordained deep. She had counted from the administrative wing's observation position. Twenty-seven Ordained in the approach corridor to sub-level seven's access shaft, deployed in the specific layered formation that the Ordained operational guide used for high-value access denial: not a wall but a series of overlapping engagement zones, each zone calibrated for the specific capabilities the opposing force's intelligence profile indicated, each zone backed by the next zone so that resolving one zone simply produced the next one, the engagement zones continuing until either the opposing force was resolved or the operational objective was achieved. Twenty-seven. She had staged twenty-three for the expected team profile. The remaining four were Crystal's adjustment: four additional Ordained deployed after the team's capability was assessed at the Clevel ambush. Crystal had read the ambush's results and adjusted the deployment. Crystal had planned for this. Crystal had planned for the team being better than average. Crystal had planned for the four additional. She was in the administrative wing. She was wat\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Seven", "ti": "What the Scholar Left Open", "ep": "The scholar was in the approach corridor.", "tx": "Chapter Twenty-Seven What the Scholar Left Open On the nature of mid-sentence: the sentence that does not complete is not an incomplete sentence. It is a sentence in a different relationship to its ending. The ending exists. The ending is real. The ending occurs. The sentence simply does not contain it. The ending happens to the world instead of to the sentence. The world finishes what the sentence began. The world is always finishing sentences. \u2014 Fragment, author unknown, found in the Lalaka archive's reference annex, shelf seventeen Desire witnesses. Desire does not heal. The wound is not healed by being witnessed. The wound is not made worse by being witnessed. The wound exists. The witnessing exists. The existence of the witnessing does not determine the wound's existence. The wound is real. The witnessing is real. Both are real at the same time. This is the whole of the Desire theology. \u2014 Chronicle of the Feathered World, on the Authority of Desire I Day 99. The scholar was in the approach corridor. She should not have been in the approach corridor. The operational geometry that Kola had given on Day 97 did not have her in the approach corridor. The operational geometry had her in the accessible archive's holding position while the team worked through the engagement zones, maintaining the founding-era chronicle's research in the accessible archive, staying clear of the engagement zones because her specific skill was not relevant to the engagement zones' resolution and being in the engagement zones with an irrelevant skill set was simply adding a body to the corridor that the Ordained would find and that would reduce the tactical margin. She was in the approach corridor because she had been on page sixty-two for twelve days and page sixty-two had the founding-era chronicle's description of what happened to the people adjacent to the heir during the final integration, and she had been not-translating page sixty-two for twelve da\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Eight", "ti": "What the Grin Could Not Hold", "ep": "Stillness is not the absence of movement. Stillness is the presence of the holding. The held thing moves. The holding re", "tx": "Chapter Twenty-Eight What the Grin Could Not Hold The Shattered rank: not a rank of power. A rank of position. The Shattered One is shattered in the specific sense of having passed through the event that was supposed to be the end and having continued. Not survived. Continued. Survival implies the ending was survived. The Shattered One did not survive the ending. The Shattered One continued past it. The continuation is not what the Shattered One chose. The continuation is what happened. The Shattered One has been continuing since. \u2014 Founding documents of the Worshipers of Storm, restricted archive, on the Shattered rank Stillness is not the absence of movement. Stillness is the presence of the holding. The held thing moves. The holding remains. Stillness is what the holding is. Stillness is not peace. Stillness is the act of the holding at the moment when what is being held is most in motion. \u2014 Chronicle of the Feathered World, on the Authority of Stillness I She killed Tasmin in the seventh engagement zone. She did not decide to kill Tasmin. She was in the seventh engagement zone because the operational picture had produced the seventh engagement zone as the position she was required to be in \u2014 the position adjacent to the heir's sub-level seven approach that the mechanism required her to be in for the moment when the heir made the freely-given choice. She was in the seventh zone and Tasmin was in the seventh zone because Tasmin had been watching Kola's architectural load-bearing since Halak and had assessed the seventh zone as the zone in which the architectural load-bearing was most at risk, the zone in which the vigil's maintenance was most costly, the zone in which the heir needed the specific kind of attending that she had been providing since the medic's chair in the Halak settlement's reception room. Tasmin was where she was because she had decided, months ago, that being the load-bearing watcher was what she was for,\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Twenty-Nine", "ti": "The Choosing Not to Follow", "ep": "She walked north for eleven minutes. Then she turned around.", "tx": "Chapter Twenty-Nine The Choosing Not to Follow On the freely-given choice: the mechanism requires the choice to be freely given. Not extracted. Not coerced. Not produced by the absence of alternatives. Freely given: the choice of someone who can see all the alternatives and chooses anyway, from the interior of their own understanding of what they are choosing. The freely-given choice cannot be produced by pressure. Pressure produces compliance. The mechanism requires more than compliance. \u2014 Chronicle of the Feathered World, restricted, on the Mechanism's Core Requirement She walked north for eleven minutes. Then she turned around. \u2014 Notation in the Chronicle of the Feathered World, added by Scribe Sixteen, restricted, on the Shattered One's movement on Day 99 I She walked north for eleven minutes. She had learned, sometime in the six thousand years, that eleven minutes was the specific duration her body required to move from the state of having done a thing that cost the maintenance its full load-bearing capacity to the state of having re-established the maintenance at full capacity. Not eleven minutes every time. Eleven minutes for this category of thing. She had not previously encountered this category. She knew it was eleven minutes because she had counted, starting from the seventh zone, and at eleven minutes the maintenance had re-established and the seam had held and the grin was on her face and the frame was the frame. At eleven minutes she turned around. Crystal's direct contact arrived at minute twelve. The warmth. Not the Ordained connection's warmth. Crystal present in the same air, five thousand years of genuine love for the world arriving in the chest with the full quality of itself. The heir is in sub-level seven, Crystal said. You are not in position. I need you in position. She said: \"I know.\" She said it in the light musical voice. Crystal said: \"I see what happened in the seventh zone. I knew it was\n\n[Continue reading in the full novel...]"}, {"lb": "Chapter Thirty", "ti": "Three Seconds", "ep": "She said: I believe you would die for this world. He was not asking her to die for it. He was asking her to let him save", "tx": "Chapter Thirty Three Seconds The mechanism's core: the freely-given choice. Not the choice extracted by necessity, not the choice produced by the absence of alternatives. The choice of someone standing in the full presence of the alternatives, seeing them clearly, and choosing. The mechanism cannot produce this. The mechanism can only be in the room when it happens. If the mechanism is correctly designed, the freely-given choice will be the choice the mechanism needs. If the mechanism is incorrectly designed, the freely-given choice will be whatever the person actually chooses. That is the freely-given choice. That is the whole of it. \u2014 Chronicle of the Feathered World, restricted, Scribe Eighteen, with specification She said: I believe you would die for this world. He was not asking her to die for it. He was asking her to let him save it. She said: I know. She had known the whole time. That had never been the question. The question was whether the saving required what he was about to require it to require. \u2014 From the Vigil Records of the Halak Silent Watchers, annotation on the confrontation, Year Unknown I Crystal was in sub-level seven before them both. This was not surprising. Crystal had been in the Library for nine days. Crystal had been in position for this moment for five thousand years. Crystal's position in sub-level seven on Day 99 was the conclusion of five thousand years of positioning: not a destination reached but a destination always-being-approached, every decision of the five thousand years having been made in the direction of this specific position in this specific chamber with this specific heir arriving at this specific vigil day. Crystal looked at the heir when he descended. Crystal's warmth was in the chamber. Not directed at the heir specifically \u2014 simply present in the air, the ambient quality of five thousand years of genuine warmth occupying the same space as the mechanism's final stage. The warmth [Continue reading in the full novel...]"}, {"lb": "Chapter Thirty-One", "ti": "The Boundary Has a Name", "ep": "The number was in the ledger. He had been writing the number every day since Day One. He had been writing Day 1, Day 2, ", "tx": "Chapter Thirty-One The Boundary Has a Name Day 1,097: the ring's accounting completes. The integration is finished. The heir becomes the permanent expression of the holding. The Boundary anchors itself in the heir's form. The heir is the Boundary. The Boundary is the heir. The holding holds because the heir holds. The heir holds because the holding is what the heir has become. The distinction collapses. The word we use after this is not heir . \u2014 Chronicle of the Feathered World, restricted, Scribe Eighteen, specification The fog cannot keep what makes the keeping possible. This is not a failure of the fog. This is the nature of the keeping: the thing that enables the keeping is not inside the keeping, cannot be kept alongside the things it keeps, exists at a different level from the kept things. The fog keeps everything. The fog cannot keep the thing that makes everything keepable. The fog notes this gap without distress. The gap is accurate. The gap is the right shape. \u2014 Miren's field notes, atmospheric survey, Year Four, Day 1,097 I Day 1,097. The number was in the ledger. He had been writing the number every day since Day One. He had been writing Day 1, Day 2, Day 3, and each day the number had been one more than the previous day's number, and today the number was 1,097. He wrote it. He held it. The ring was cold. The ring had been running the accounting for 1,097 days and had been taking the peripheral and the adjacent and had been working toward the center and was at the center now. At the center. The most deeply held thing. He held it. The ring knew what it was. The ring had known since Day One what it was going to take last. The ring had been working toward it for 1,097 days. The ring was there now. The ring had arrived at the most deeply held thing. He said her name. Once. The name arrived in the aloud with the quality it had had since the first loop in the Nebel fog when she had said the count's rope back to him. Since the\n\n[Continue reading in the full novel...]"}]</script>
<script type="application/json" id="CHARS_DATA">[{"id": "kola", "name": "Kola Baru", "title": "Stillness Heir", "status": "Boundary Guardian", "kingdom": "Lalaka", "symbol": "\u25fc", "color": "#9a9a9a", "bio": "Born in the Lalaka canal district, Kola Baru grew up with the Stillness mark burning north-and-above from the first morning of his life. At eighteen, the loop anomaly began \u2014 death, return, the count said aloud. He did this 392 times across six years. He was afraid every time. He continued every time. That is the whole of it.", "detail": "The vigil ran 1,097 days in sub-level seven of the Library of Life and Death. The ring integrated progressively, taking what he held. On Day 1,097 it fused to his skeleton. The Boundary now holds with the quality of everything he maintained across those days \u2014 six years of dying and returning and meaning the refusing-to-burn.", "relations": [{"name": "Crystal", "type": "Architect"}, {"name": "Leiren Thorne", "type": "Guide"}, {"name": "Miren", "type": "Companion"}, {"name": "Tasmin Oran", "type": "Companion"}, {"name": "Lyra", "type": "Companion"}, {"name": "Veyra", "type": "Companion"}, {"name": "Selena", "type": "Companion"}, {"name": "Rorin Fenne", "type": "Lost"}], "loops": 392, "tags": ["vigil", "loop-anomaly", "boundary", "heir"]}, {"id": "leiren", "name": "Leiren Thorne", "title": "The Shattered One", "status": "Active", "kingdom": "Borderland", "symbol": "\u2b21", "color": "#c0c0c0", "bio": "Died in a shrine roughly 3,052 years ago when a cultist named Jorin drove a spear between their shoulder blades. Did not die. The regeneration began. They found Crystal. The Wrath transformation followed ten years later \u2014 seven feet, obsidian armor, and everything that had been one thing became something that no longer fit a single category.", "detail": "Six thousand years of dying and returning have accumulated in the metal of their spear. The cold in it is not temperature \u2014 it is composition. Voice: snarky, brutal, wounded, in the register of someone who has been doing this for six thousand years and is still doing it. After the vigil, they survived on the Frost Mother's floor. Crystal buried their spear in the Crystal Valley that same night.", "relations": [{"name": "Crystal", "type": "Partner"}, {"name": "Kola Baru", "type": "Heir"}, {"name": "Jorin", "type": "The First Death"}], "loops": 0, "tags": ["immortal", "shattered", "wrath", "six-thousand-years"]}, {"id": "crystal", "name": "Crystal", "title": "The Architect", "status": "Active", "kingdom": "Lalaka", "symbol": "\u2b1b", "color": "#7fb3c8", "bio": "5,000 years old. Half-elf. Spent the first 800 years of her project documenting the wound's effects before she understood what the mechanism would need to be. Has been building toward it for 4,000 years. The healing she built toward became a holding instead. This is not failure.", "detail": "Her warmth is in every feature \u2014 not performed, present. She placed the ring in sub-level seven in Year 301 and authorized the sealing. She has been waiting since then. After the vigil she organized the aftermath from the Library's forty-third floor, wept with the full quality of five thousand years, and buried Leiren's spear in the Crystal Valley the night after Day 1,097.", "relations": [{"name": "Kola Baru", "type": "The Heir"}, {"name": "Leiren Thorne", "type": "Partner"}, {"name": "Jhara Kola'rin", "type": "Descendant (indirect)"}], "loops": 0, "tags": ["architect", "five-thousand-years", "mechanism", "library"]}, {"id": "miren", "name": "Miren", "title": "Veiled Hearts Asset", "status": "In the Boundary", "kingdom": "Nebel", "symbol": "\u25ce", "color": "#7fb3c8", "bio": "Recruited into the Veiled Hearts at seventeen for demonstrated fog-reading capacity. Went off-mission to join the heir's team. Had read 341 atmospheric traces of Kola Baru in the fog before they met in loop 343. Said: I believe you.", "detail": "On Day 823 of the vigil, she sat in the Nebel fog and told the full story to the gap that was his shape. The fog kept the saying. The gap in the stable strata is exactly his shape. The fog cannot keep what makes the keeping possible. She named everyone at full volume. The fog kept that too.", "relations": [{"name": "Kola Baru", "type": "I believe you"}, {"name": "Lyra", "type": "She said the heart remembers you well"}], "loops": 0, "tags": ["fog-reader", "nebel", "veiled-hearts", "off-mission"]}, {"id": "tasmin", "name": "Tasmin Oran", "title": "Vigil-Support Medic", "status": "In the Boundary", "kingdom": "Halak", "symbol": "\u25fc", "color": "#9a9a9a", "bio": "Read Kola Baru's architectural load-bearing from the moment of meeting. Said: the fear lives in your shoulders. Correct. Offered to watch the architecture for the duration. Watched it for nine months before the vigil began.", "detail": "Said adequate every day until Day 99. On Day 99 her hands were open. They stayed open. She is in the Boundary with the rest of the team \u2014 not dead, but transformed into something that the Boundary holds as part of its specific quality of maintaining.", "relations": [{"name": "Kola Baru", "type": "Architecture Watcher"}, {"name": "Rorin Fenne", "type": "Team"}], "loops": 0, "tags": ["medic", "halak", "vigil-support", "architecture"]}, {"id": "lyra", "name": "Lyra", "title": "Demon Bloodline", "status": "In the Boundary", "kingdom": "Zhala/Wanoon Border", "symbol": "\u25c9", "color": "#e85d04", "bio": "Said: took you long enough. Warm-sharp. Amber eyes. The laugh lived in her hands. Was going to watch from outside for the third time \u2014 she and Veyra had watched two mechanisms from the outside already. Decided not to.", "detail": "The Boundary holds with her warmth in it. The quality of not-turning-away is hers. She is the third mechanism's inside rather than its outside. She chose this.", "relations": [{"name": "Veyra", "type": "Sister"}, {"name": "Kola Baru", "type": "Took you long enough"}, {"name": "Miren", "type": "The heart remembers you well"}], "loops": 0, "tags": ["demon-bloodline", "desire-authority", "wanoon", "warmth"]}, {"id": "veyra", "name": "Veyra", "title": "Demon Bloodline", "status": "In the Boundary", "kingdom": "Zhala/Wanoon Border", "symbol": "\u25c9", "color": "#c77dff", "bio": "Made the two-finger gesture on Day 98 of the approach with no one to receive it. Made it correctly. Held position. Lyra arrived. The gesture was right.", "detail": "She is in the Boundary. The geometry was hers. Forty years beside Lyra in the border territory. She knew the work from the outside. She chose the inside.", "relations": [{"name": "Lyra", "type": "Sister"}, {"name": "Kola Baru", "type": "The geometry was hers"}], "loops": 0, "tags": ["demon-bloodline", "fury-authority", "wanoon", "geometry"]}, {"id": "selena", "name": "Selena", "title": "Founding-Era Scholar", "status": "In the Boundary", "kingdom": "Lalaka", "symbol": "\u229b", "color": "#c9a84c", "bio": "One of three living fluent speakers of the Founding-Era Dialect. Found on the Mirror Path's third level with four months of mechanism research. Crossed heading north looking at her reflection for the entire crossing. Did not look away.", "detail": "Had a text she was going to finish translating. Set it aside for the research. Got to page sixty-two. Stayed twelve days. Delivered the sentence. The world finished it through the sixth engagement zone's resolution. Her translation is in the Chronicle's permanent record now.", "relations": [{"name": "Kola Baru", "type": "Page sixty-two"}, {"name": "Crystal", "type": "The research"}], "loops": 0, "tags": ["scholar", "lalaka", "founding-era-dialect", "page-sixty-two"]}, {"id": "rorin", "name": "Rorin Fenne", "title": "Herbalist", "status": "Consumed", "kingdom": "Lalaka", "symbol": "\u25d0", "color": "#4a8c4a", "bio": "Was going to correct the Year 280 botanical catalogue. Had submitted a correction in Year 407. Still pending review when he joined the team. Three days of archive work for the mechanism research.", "detail": "Tea made at the right proportions for Tasmin's injury on three nights in the Forest. Perimeter check every evening. The Forest found something he held lightly. Something he gave. His correction was accepted the year after the vigil's completion. 181 years of wrong altitude sickness treatment ended because of it.", "relations": [{"name": "Tasmin Oran", "type": "Tea at the right proportions"}, {"name": "Kola Baru", "type": "The notebook"}], "loops": 0, "tags": ["herbalist", "lalaka", "consumed", "botanical"]}, {"id": "jhara", "name": "Jhara Kola'rin", "title": "Scribe Twenty-Three", "status": "Born 104yr after vigil", "kingdom": "Crystal Valley", "symbol": "\u25c8", "color": "#a8c5da", "bio": "Born 104 years after Kola Baru's vigil. Mother: Jhara Kola, of the Baru bloodline, who dies in the birthing. Father: a young Crystal-clan historian, 26 years old, who does not yet understand what his bloodline is building toward.", "detail": "Named by a merchant \u2014 old, traveled, present in the Crystal Valley as if by coincidence. Power: cold blue flames, the frozen ember, Stillness and Crystal combined. Raised by the avian priests. Becomes Scribe Twenty-Three on the morning of her coming of age. Reads the specification before she rises from the table. Tries five times to end the Second Great War. Fails four. The fifth time she names the false god. That is the healing.", "relations": [{"name": "Kola Baru", "type": "His bloodline prepared the world for her"}, {"name": "Crystal", "type": "Clan ancestor"}, {"name": "Leiren Thorne", "type": "She finds the spear"}], "loops": 0, "tags": ["frozen-ember", "scribe-twenty-three", "second-great-war", "healing"]}]</script>
<script type="application/json" id="SWORDS_DATA">[{"name": "Will", "bearer": "Korren", "epithet": "who held the purpose", "lore": "When everything argued against holding it, Korren held the purpose. Not because the outcome was guaranteed. Because it was the next thing, and he was still the person who did the next thing. The sword is in every act of sustained effort after the reasonable stopping point.", "quote": "The purpose does not require certainty. The purpose requires the one who holds it."}, {"name": "Fury", "bearer": "Varkis", "epithet": "who committed completely", "lore": "Not anger. The complete commitment of available force to a chosen direction, without the held-back reserve. Varkis gave everything to the direction. The sword is in every Hungerwing's thermal climb \u2014 full wingspan, no portion reserved.", "quote": "The held-back portion is not safety. It is the reason the direction was not reached."}, {"name": "Endurance", "bearer": "Liraeth", "epithet": "who continued past the forgiving point", "lore": "Stopping would have been forgiven. Everyone said so. Liraeth continued anyway \u2014 not because stopping was wrong, but because continuing was the next thing. The sword is in every person who outlasts what they were told they could outlast.", "quote": "The forgiving point is not the stopping point. These are different."}, {"name": "Clarity", "bearer": "Soren", "epithet": "who could not stop seeing", "lore": "Could not stop seeing the truth and delivered it to councils that did not want to hear it. The sword is in every act of precise seeing delivered regardless of reception \u2014 not cruelty, but the specific refusal to let the seeing go unsaid.", "quote": "The truth is not improved by being softened. It is only made more dangerous, because now it is not recognized."}, {"name": "Harmony", "bearer": "Seven of Ashen Vale", "epithet": "who held seven directions at once", "lore": "Held seven directions simultaneously \u2014 not because any one direction was wrong, but because something larger required all seven to be held at once. The sword is in every peace that holds not because the grievances resolved but because someone stood between them.", "quote": "Peace is not the absence of conflict. Peace is the active maintenance of the space between conflicts."}, {"name": "Sacrifice", "bearer": "Mara", "epithet": "who gave in the exact right moment", "lore": "Not sacrifice for its own sake. The exact right moment \u2014 the giving that was the next thing, made by the person who was still the person who did the next thing. The sword is in every act of precise giving that lands exactly where it needs to.", "quote": "The giving that is not the right moment is waste. The giving that is the right moment is everything."}, {"name": "Memory", "bearer": "Talen", "epithet": "who moved through the burning building reading", "lore": "Moved through the burning building not away from it. Reading as it burned. Taking what could be taken. The sword is in the specific kind of love that moves toward rather than away from the thing being lost.", "quote": "The building is burning. This is the reason to read, not the reason to leave."}, {"name": "Defiance", "bearer": "Rukar", "epithet": "who refused the thing that would have saved him", "lore": "Refused the thing that would have saved him in order to hold the thing that mattered more. Not death-seeking. Holding-seeking. The sword is in every determination that costs what it costs and is maintained anyway.", "quote": "The cost is the proof that the holding is real."}, {"name": "Mercy", "bearer": "Elyra", "epithet": "who spared them not because they deserved it", "lore": "Spared them not because they deserved it. Because mercy that requires deserving it is not mercy \u2014 it is justice with a different name. The sword is in every act of mercy that preserved the capacity for mercy rather than exhausting it.", "quote": "Mercy given to the undeserving is the only mercy. The rest is just reward."}, {"name": "Dominion", "bearer": "Kael V", "epithet": "who built for people who would not know to thank him", "lore": "Built for people not yet born. The work was real, the recipients were not present, the gratitude was impossible. The sword is in every act of building that assumes the future and acts accordingly.", "quote": "The people who will need this have not been born yet. Build it anyway."}, {"name": "Renewal", "bearer": "Thren", "epithet": "who burned the field so it could grow", "lore": "Burned the field for a growth the burner would not see. The loss was complete. The renewal was certain. The sword is in every act of deliberate ending that makes space for what could not otherwise exist.", "quote": "The field that will not burn cannot grow. The burning is the care."}, {"name": "Silence", "bearer": "Veyne", "epithet": "who ceased from speech and found the substance", "lore": "Ceased from speech and found, in the silence, the thing that the speaking had been obscuring. The sword is in every silence in which the substance resides \u2014 not absence but presence of a different kind.", "quote": "The speaking was real. The silence was what the speaking had been trying to say."}, {"name": "Eternity", "bearer": "Aral", "epithet": "who chose permanently", "lore": "Chose permanently. Not once \u2014 permanently. Every moment after the choosing was the choosing maintained. The sword is in every permanent choice that is not a past event but an ongoing act, present tense, in every subsequent moment.", "quote": "I chose it. I choose it. There is no tense in which I am not choosing it."}]</script>
<script type="application/json" id="CREATURES_DATA">[{"name": "Tome Golem", "kingdom": "Lalaka", "type": "Constructed Archive", "danger": 2, "symbol": "\u229b", "desc": "Three to four meters of continuously active ancient stone, each carrying in its operational memory the complete record of everything it has ever catalogued. 847 active units. They do not sleep. They do not tire. They have been operational for between sixty and four hundred and sixty years.", "lore": "Destroying a Tome Golem is a capital offense under the Golem Compact of Year 44 \u2014 each Golem's memory is an irreplaceable archive. One Golem in the commercial district has had one entry that cannot be closed for 263 years. The entry: 'entity with non-standard temporal signature. Status: ongoing.' The subject: Leiren Thorne.", "sightings": ["Library of Life and Death, Lalaka (847 active)", "Canal District commercial quarter"]}, {"name": "Mist Sprite", "kingdom": "Nebel", "type": "Atmospheric Intelligence", "danger": 1, "symbol": "\u25ce", "desc": "Non-human intelligence that inhabits and is the fog's maintenance layer. Pre-date recorded history. Have been maintaining the three-thousand-year atmospheric archive since before the first human settlement of Nebel. They do not communicate in any human language.", "lore": "Trained fog-readers develop, over years of practice, a partial capacity to receive atmospheric intent from the Sprites \u2014 not words, but directional pressure in the fog's layers that conveys something like meaning. They have never answered a direct question about the deep strata's oldest records. They maintain the archive regardless of whether anyone reads it.", "sightings": ["Nebel fog valleys (all depths)", "Karev's Crossing atmospheric layers"]}, {"name": "Hungerwing", "kingdom": "Wanoon", "type": "Thermal-Soaring Avian", "danger": 3, "symbol": "\u25c8", "desc": "Wingspan: four to six meters. Weight: forty to sixty kilograms. The largest flying creatures in the eight kingdoms. Not tame. Never tamed. They nest in the Thermal Fields southeast of the Spire City and have done so since before the first human settlement of the Wanoon highlands.", "lore": "Full wingspan extended into the thermal, edge to edge, no portion held back. The Wanoon theological tradition reads them as the Fury Authority's influence on the local ecology \u2014 the quality expressed in the creatures that live in the kingdom's spiritual center. The Hungerwings Regiment of the Flame Vanguard cooperates with them using specific sound frequencies discovered in Year 261. Cooperation, not domestication.", "sightings": ["Thermal Fields, Wanoon Highlands (permanent nesting)", "Spire City thermals", "Wanoon-Clevel border passes"]}, {"name": "Mnemovore", "kingdom": "Laba (Forbidden Forest)", "type": "Consuming Assessor", "danger": 5, "symbol": "\u25d0", "desc": "The Forest's consuming mechanism. They do not attack. They assess. They find what has been held lightly, what is at the edges of what someone is maintaining, what has been slightly abandoned in the architecture of the held things. They take it.", "lore": "The horror of encountering a Mnemovore is not violence \u2014 it is the revelation of what you have not been holding as tightly as you thought you were. They are the Forest's intelligence, its sensing apparatus, its method. You cannot negotiate with them. You can only hold what you hold at the full grip, which is what they test. One member of the heir's team did not exit the Forest.", "sightings": ["Forbidden Forest interior (all zones)", "Forest perimeter (assessment radius)"]}, {"name": "Mirror Hound", "kingdom": "Clevel", "type": "Altitude Navigation Breed", "danger": 1, "symbol": "\u25b3", "desc": "Bred over two hundred years specifically for fog-and-altitude navigation in the Mirror Path conditions. Not large \u2014 their value is precision over strength. Navigate below the fog-line by smell and atmospheric pressure rather than sight. Work alongside the Climbing Eagles.", "lore": "The only domesticated animal breed specifically developed for Mirror Path conditions. Their navigation sense works below the fog-line where visibility drops to near-zero. The breeding program began in Year 203 and has produced a distinct breed unrelated to any lowland dog lineage. They do not get altitude sickness. No one has determined why.", "sightings": ["Mirror Height, Clevel (primary)", "All 14 Mirror Path approach routes"]}, {"name": "Guide-Hound", "kingdom": "Nebel", "type": "Fog Navigation Breed", "danger": 1, "symbol": "\u25ce", "desc": "Bred over two hundred years for fog navigation in the Nebel valley systems. Navigate through dense fog layers by atmospheric pressure sensitivity and smell. Every certified fog-reader works with at least one.", "lore": "The Nebel fog-reading tradition requires a Guide-Hound partnership for all sub-fog-line navigation. The dogs' atmospheric sensitivity appears to be sensitive to the Mist Sprite maintenance activity \u2014 they exhibit specific behaviors in the hours before and after Sprite maintenance events. The mechanism is undocumented.", "sightings": ["All Nebel fog valleys", "Karev's Crossing fog-line approaches"]}]</script>

var CHRON_TEXT = "Before the world was, Goola dreamed.\n\nThis is the whole of the beginning. Before the world was, Goola dreamed, and the dream was the world, and the world was real because Goola dreamed it, and Goola dreamed it because the dream was real. This is the paradox at the center of everything. The world is real. The world was dreamed. Both are true.\n\nGoola dreamed the Authorities first. The quality of Judgment, that things might be weighed. The quality of Consumption, that things might be transformed. The quality of Accumulation, that things might be held. The quality of Mimicry, that things might be known from the outside. The quality of Fury, that things might be directed completely. The quality of Desire, that things might be wanted and the wanting might be real. The quality of Stillness, that things might be held in place.\n\nThen Goola dreamed the Boundary.\n\nTHE BOOK OF THE SWORDS\n\nBefore the kingdoms, the world had a wound. The wound was in the substrate. The False God had made it. The world answered with thirteen swords. Not weapons: instruments of covenant.\n\nWill given to Korren, who held the purpose. Fury given to Varkis, who committed completely. Endurance given to Liraeth, who continued past the forgiving point. Clarity given to Soren, who could not stop seeing. Harmony given to Seven of Ashen Vale. Sacrifice given to Mara. Memory given to Talen. Defiance given to Rukar. Mercy given to Elyra. Dominion given to Kael the Fifth. Renewal given to Thren. Silence given to Veyne. Eternity given to Aral, who chose permanently.\n\nTHE BOOK OF THE HEIR\n\nHe was born in the Lalaka canal district. He had the mark from birth. His mother noted the mark, burning north-and-above from the first morning. She held his arm and was quiet and then said: your name is Kola.\n\nThe loop-anomaly began on his eighteenth birthday. He died. He came back. He said the number. He kept doing this for six years. Three hundred and ninety-two times. He was afraid every time. He continued every time.\n\nOn Day 1,097 the ring fused. The fusion was not dramatic. Long processes completing are not dramatic. They are simply complete. The holding holds. The world continues.";

// ─── AUDIO ───────────────────────────────────────────────────
function loadVoices() {
  var vl = synth.getVoices();
  st.voices = [];
  for (var i = 0; i < vl.length; i++) {
    if (vl[i].lang && vl[i].lang.indexOf('en') === 0) st.voices.push(vl[i]);
  }
  var sel = document.getElementById('voice-sel');
  if (!sel) return;
  sel.innerHTML = '';
  for (var i = 0; i < st.voices.length; i++) {
    var o = document.createElement('option');
    o.value = i;
    var nm = st.voices[i].name.replace('(en-US)','').replace('(en-GB)','').trim();
    o.textContent = nm.length > 16 ? nm.slice(0,16) : nm;
    sel.appendChild(o);
  }
  var pref = ['Samantha','Daniel','Karen','Moira','Google UK','Google US'];
  for (var p = 0; p < pref.length && !st.voice; p++) {
    for (var i = 0; i < st.voices.length; i++) {
      if (st.voices[i].name.indexOf(pref[p]) >= 0) { sel.value = i; st.voice = st.voices[i]; break; }
    }
  }
  if (!st.voice && st.voices.length) st.voice = st.voices[0];
}
synth.onvoiceschanged = loadVoices;
[100,500,1500].forEach(function(d){setTimeout(loadVoices,d);});

function startAudio() {
  var body = document.getElementById('bk-body');
  var text = body ? (body.innerText || body.textContent) : '';
  if (!text) return;
  synth.cancel();
  utt = new SpeechSynthesisUtterance(text);
  if (st.voice) utt.voice = st.voice;
  utt.rate = st.rate; utt.pitch = 1;
  var wc = 0, total = text.split(/\s+/).length;
  utt.onboundary = function(e) {
    if (e.name !== 'word') return;
    wc++;
    var pct = total > 0 ? wc/total : 0;
    var fill = document.getElementById('pl-fill');
    if (fill) fill.style.width = (pct*100)+'%';
    var s = Math.floor(wc/Math.max(st.rate*2.5,1));
    var t = document.getElementById('pl-time');
    if (t) t.textContent = Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    if (body && e.charIndex !== undefined) {
      var ci = e.charIndex, ps = body.querySelectorAll('p'), cum = 0;
      for (var pi = 0; pi < ps.length; pi++) {
        var l = (ps[pi].textContent||'').length;
        if (ci >= cum && ci < cum+l) {
          for (var pj=0;pj<ps.length;pj++) ps[pj].classList.remove('reading-hl');
          ps[pi].classList.add('reading-hl');
          ps[pi].scrollIntoView({behavior:'smooth',block:'center'});
          break;
        }
        cum += l+1;
      }
    }
  };
  utt.onend = function() {
    st.playing = false;
    var btn = document.getElementById('pl-play');
    if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('playing'); }
    if (body) { var ps=body.querySelectorAll('p'); for(var i=0;i<ps.length;i++) ps[i].classList.remove('reading-hl'); }
    if (st.ch < CH.length-1) setTimeout(function(){loadCh(st.ch+1);setTimeout(startAudio,800);},400);
  };
  utt.onerror = function() { st.playing = false; };
  synth.speak(utt);
  st.playing = true;
  var btn = document.getElementById('pl-play');
  if (btn) { btn.innerHTML = '&#9646;&#9646;'; btn.classList.add('playing'); }
}

function stopAudio() {
  synth.cancel(); st.playing = false;
  var btn = document.getElementById('pl-play');
  if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('playing'); }
  var fill = document.getElementById('pl-fill');
  if (fill) fill.style.width = '0%';
  var t = document.getElementById('pl-time');
  if (t) t.textContent = '0:00';
  var ps = document.querySelectorAll('.reading-hl');
  for (var i = 0; i < ps.length; i++) ps[i].classList.remove('reading-hl');
}

// ─── ENCYCLOPEDIA HELPERS ─────────────────────────────────────
function parseMD(text, accent) {
  var AT2 = AT;
  var lines = text.split('\n');
  var out = '';
  lines.forEach(function(line) {
    var parsed = parseLinks(line, accent);
    if (line.indexOf('### ') === 0) {
      out += '<div style="font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:'+accent+';margin:2rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid '+accent+'22">'+parseLinks(line.slice(4),accent)+'</div>';
    } else if (line.indexOf('## ') === 0) {
      out += '<div style="font-family:Cinzel,serif;font-size:.85rem;color:var(--ivory);font-weight:600;margin:1.75rem 0 .6rem">'+parseLinks(line.slice(3),accent)+'</div>';
    } else if (line.indexOf('- ') === 0 || line.indexOf('\u2022 ') === 0) {
      out += '<div style="display:flex;gap:.6rem;margin-bottom:.35rem"><span style="color:'+accent+';font-size:.58rem;margin-top:.5rem;flex-shrink:0">&#9670;</span><div style="font-size:.98rem;line-height:1.8;color:var(--dim)">'+parseLinks(line.slice(2),accent)+'</div></div>';
    } else if (line.trim() === '') {
      out += '<div style="height:.4rem"></div>';
    } else if (line.indexOf('\u2192') === 0 || line.indexOf('-> ') === 0) {
      out += '<div style="color:'+accent+';font-family:Cinzel,serif;font-size:.6rem;margin-top:2rem;padding:.6rem .85rem;border:1px solid '+accent+'28;border-radius:4px;background:'+accent+'06">'+parsed+'</div>';
    } else if (line.trim()) {
      out += '<p style="font-size:.98rem;line-height:1.88;color:var(--dim);margin-bottom:.4rem">'+parsed+'</p>';
    }
  });
  return out;
}

function parseLinks(text, accent) {
  return text.replace(/\{\{([^|]+)\|(\w+)\}\}/g, function(m, name, type) {
    var at = AT[type]||AT.concept;
    return '<span class="enc-link" style="color:'+at.c+'" onclick="openArcArt(\''+name.replace(/'/g,"\\'")+'\',' + "'" + type + "'" + ')">'+name+'</span>';
  });
}

function loadingHTML(label) {
  var lines = [88,70,80,65,75,60];
  var bars = lines.map(function(w,i){return '<div class="ld-line" style="width:'+w+'%;animation-delay:'+(i*.12)+'s"></div>';}).join('');
  return '<div style="padding:1.5rem 0"><div style="display:flex;align-items:center;margin-bottom:1.25rem"><div class="spin"></div><span style="color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase">Consulting the Archive'+(label?': '+label:'')+'&hellip;</span></div>'+bars+'</div>';
}

async function callAI(prompt, cb) {
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2048,messages:[{role:'user',content:prompt}]})
    });
    var d = await r.json();
    cb(d.content && d.content[0] ? d.content[0].text : 'Content unavailable.');
  } catch(e) { cb('Unable to reach the Archive. Please check your connection.'); }
}

function attachMapHandlers() {
  var regions = document.querySelectorAll('.km-region');
  regions.forEach(function(el) {
    el.addEventListener('click', function() {
      showMapKingdom(this.getAttribute('data-kid'));
    });
    el.addEventListener('mouseenter', function() {
      this.style.filter = 'brightness(1.6)';
    });
    el.addEventListener('mouseleave', function() {
      if (!this.classList.contains('active')) this.style.filter = '';
    });
  });
}

function showMapKingdom(kid) {
  var k = null;
  for (var i=0;i<KM.length;i++){if(KM[i].id===kid){k=KM[i];break;}}
  if (!k) return;
  document.querySelectorAll('.km-region').forEach(function(el){el.style.filter='brightness(.7)';el.classList.remove('active');});
  var sel = document.getElementById('map-km-'+kid);
  if (sel) {sel.style.filter='brightness(2) drop-shadow(0 0 6px '+k.accent+')';sel.classList.add('active');}
  var info = document.getElementById('map-info');
  if (!info) return;
  var h = '<div style="border:1px solid '+k.accent+'38;border-radius:4px;padding:.85rem 1rem;background:'+hexRgba(k.accent,.07)+'">';
  h += '<div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem">';
  h += '<span style="font-size:1.5rem;color:'+k.accent+'">'+k.sym+'</span>';
  h += '<div><div style="font-family:Cinzel,serif;font-size:.82rem;color:var(--ivory)">'+k.name+'</div>';
  h += '<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.15em;text-transform:uppercase;color:'+k.accent+'">'+k.auth+' &bull; Pop. '+k.pop+'</div></div></div>';
  h += '<p style="font-size:.88rem;color:var(--dim);line-height:1.65;margin-bottom:.65rem">'+k.desc+'</p>';
  h += '<div style="display:flex;gap:.4rem;flex-wrap:wrap">';
  h += '<button onclick="openSec(\'atlas\');setTimeout(function(){openKm(\''+kid+'\');},250)" style="background:'+hexRgba(k.accent,.12)+';border:1px solid '+hexRgba(k.accent,.4)+';color:'+k.accent+';font-family:Cinzel,serif;font-size:.5rem;letter-spacing:.08em;padding:.3rem .65rem;border-radius:3px;cursor:pointer">Kingdom Page &#8594;</button>';
  h += '<button onclick="openSec(\'atlas\');setTimeout(function(){openKm(\''+kid+'\');setTimeout(function(){openKmSec(\''+kid+'\',0);},150);},250)" style="background:rgba(255,255,255,.03);border:1px solid var(--rule);color:var(--faint);font-family:Cinzel,serif;font-size:.5rem;padding:.3rem .65rem;border-radius:3px;cursor:pointer">Encyclopedia</button>';
  h += '</div></div>';
  info.innerHTML = h;
}

function saveReadProgress(chIdx, scrollPct) {
  if (!CH[chIdx]) return;
  var title = CH[chIdx].lb + ': ' + CH[chIdx].ti;
  localStorage.setItem('fc_progress', JSON.stringify({ch:chIdx, scroll:scrollPct||0, title:title}));
}

function continueReading() {
  var p = JSON.parse(localStorage.getItem('fc_progress')||'null');
  if (!p) return;
  openSec('chronicle');
  setTimeout(function(){
    loadCh(p.ch||0);
    if (p.scroll) setTimeout(function(){
      var b=document.getElementById('bk-body');
      if (b) b.scrollTop = p.scroll*(b.scrollHeight-b.clientHeight);
    },350);
  },220);
}

function checkContinueReading() {
  var p = JSON.parse(localStorage.getItem('fc_progress')||'null');
  var btn=document.getElementById('continue-btn');
  var lbl=document.getElementById('continue-label');
  if (p&&p.title&&btn&&lbl) {
    lbl.textContent = p.title;
    btn.style.display='block';
  }
}

// BOOKMARKS
// ─────────────────────────────────────────────────────────────
function getBM(){return JSON.parse(localStorage.getItem('fc_bm')||'[]');}
function saveBM(bm){localStorage.setItem('fc_bm',JSON.stringify(bm));}

function addBM(type,id,title,section){
  var bm=getBM();
  if (bm.find(function(b){return b.type===type&&String(b.id)===String(id);})) return;
  bm.unshift({type:type,id:id,title:title,section:section,ts:Date.now()});
  saveBM(bm);
  showAchToast({icon:'&#128278;',title:'Bookmarked'});
  updateBmBtn(type,id);
}

function removeBM(type,id){
  saveBM(getBM().filter(function(b){return !(b.type===type&&String(b.id)===String(id));}));
  updateBmBtn(type,id);
  if (st.sec==='bookmarks') renderBookmarksList();
}

function toggleBM(){
  var bm=getBM();
  var ex=bm.find(function(b){return b.type==='chapter'&&b.id===st.ch;});
  if (ex) removeBM('chapter',st.ch);
  else addBM('chapter',st.ch,CH[st.ch].lb+': '+CH[st.ch].ti,'chronicle');
}

function updateBmBtn(type,id){
  var btn=document.getElementById('bm-toggle');
  if (!btn) return;
  var active=getBM().find(function(b){return b.type==='chapter'&&b.id===st.ch;});
  btn.innerHTML=active?'&#128278;':'&#128279;';
  btn.classList.toggle('active',!!active);
}

function buildBookmarks(){
  var el=document.getElementById('sec-bookmarks');
  el.innerHTML='<div class="sec-head"><div class="sec-title">Bookmarks</div><div class="sec-sub">Saved Entries</div></div><div class="sec-body" id="bm-body"></div>';
  renderBookmarksList();
}

function renderBookmarksList(){
  var b=document.getElementById('bm-body');
  if (!b) return;
  var bm=getBM();
  if (!bm.length){b.innerHTML='<div style="text-align:center;padding:3rem 1rem;color:var(--faint);font-style:italic;font-family:EB Garamond,Georgia,serif;font-size:1rem">No bookmarks yet.<br>Tap &#128279; in the Chronicle to save a chapter.</div>';return;}
  var h='<div style="font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.75rem">'+bm.length+' saved</div>';
  bm.forEach(function(bk){
    var icon=bk.type==='chapter'?'&#128214;':bk.type==='character'?'&#128101;':'&#128218;';
    h+='<div class="bm-item">';
    h+='<span class="bm-icon">'+icon+'</span>';
    h+='<div onclick="goToBM(\''+bk.type+'\',\''+bk.id+'\')" style="flex:1;cursor:pointer"><div style="font-family:Cinzel,serif;font-size:.68rem;color:var(--ivory);line-height:1.35">'+bk.title+'</div><div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:.1rem">'+bk.type+'</div></div>';
    h+='<button class="bm-del" onclick="removeBM(\''+bk.type+'\',\''+bk.id+'\')">&#10005;</button>';
    h+='</div>';
  });
  b.innerHTML=h;
}

function goToBM(type,id){
  if (type==='chapter'){openSec('chronicle');setTimeout(function(){loadCh(parseInt(id));},220);}
  else if (type==='character'){openSec('characters');setTimeout(function(){openChar(id);},220);}
}

var searchIdx=null;

function buildSearchIdx(){
  searchIdx=[];
  CH.forEach(function(c,i){searchIdx.push({type:'Chapter',title:c.lb+': '+c.ti,body:c.tx.slice(0,300),go:function(){openSec('chronicle');setTimeout(function(){loadCh(i);},220);}});});
  CHARS.forEach(function(c){searchIdx.push({type:'Character',title:c.name,body:c.bio,go:function(){openSec('characters');setTimeout(function(){openChar(c.id);},220);}});});
  KM.forEach(function(k){searchIdx.push({type:'Kingdom',title:k.name,body:k.desc,go:function(){openSec('atlas');setTimeout(function(){openKm(k.id);},220);}});});
  CREATURES.forEach(function(c,i){searchIdx.push({type:'Creature',title:c.name,body:c.desc,go:function(){openSec('creatures');setTimeout(function(){openCreature(i);},220);}});});
  SWORDS.forEach(function(s,i){searchIdx.push({type:'Sword',title:s.name+' — '+s.bearer,body:s.lore,go:function(){openSec('swords');setTimeout(function(){openSword(i);},220);}});});
}

function buildSearch(){
  var el=document.getElementById('sec-search');
  el.innerHTML='<div class="sec-head"><div class="sec-title">Search</div><div class="sec-sub">The Archive Remembers All</div></div><div class="sec-body"><input id="search-input" type="text" placeholder="Search chapters, characters, kingdoms&hellip;" autocomplete="off" autocorrect="off"><div id="search-results" style="margin-top:.75rem"></div></div>';
  if (!searchIdx) buildSearchIdx();
  var inp=document.getElementById('search-input');
  inp.addEventListener('input',function(){doSearch(this.value);});
  inp.focus();
}

function doSearch(q){
  var res=document.getElementById('search-results');
  if (!res) return;
  q=(q||'').trim();
  if (q.length<2){res.innerHTML='<div style="text-align:center;padding:2rem;color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase">Begin typing to search</div>';return;}
  var ql=q.toLowerCase();
  var hits=searchIdx.filter(function(item){return item.title.toLowerCase().indexOf(ql)>=0||item.body.toLowerCase().indexOf(ql)>=0;}).slice(0,24);
  if (!hits.length){res.innerHTML='<div style="text-align:center;padding:2rem;color:var(--faint);font-family:Cinzel,serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase">No results for &ldquo;'+q+'&rdquo;</div>';return;}
  var h='<div style="font-family:Cinzel,serif;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:.5rem">'+hits.length+' results</div>';
  hits.forEach(function(r){
    var hi=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    var excerpt=r.body.replace(hi,'<mark style="background:rgba(201,168,76,.25);color:var(--ivory)">$1</mark>').slice(0,130);
    h+='<div class="search-result" data-idx="'+searchIdx.indexOf(r)+'"><div class="search-result-type">'+r.type+'</div><div class="search-result-title">'+r.title.replace(hi,'<mark style="background:rgba(201,168,76,.25);color:var(--ivory)">$1</mark>')+'</div><div class="search-result-desc">'+excerpt+'&hellip;</div></div>';
  });
  res.innerHTML=h;
  res.querySelectorAll('.search-result').forEach(function(el){
    var idx=parseInt(el.getAttribute('data-idx'));
    el.onclick=function(){if(searchIdx[idx])searchIdx[idx].go();};
  });
}

  PROPH.forEach(function(p,idx){
    h+='<div class="prophecy-card" onclick="openProph('+idx+')">';
    h+='<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,.4);margin-bottom:.35rem">'+p.source+'</div>';
    h+='<div style="font-family:Cinzel,serif;font-size:.82rem;color:var(--gold);margin-bottom:.65rem">'+p.title+'</div>';
    h+='<div class="prophecy-text" style="font-size:.95rem;margin:0;-webkit-line-clamp:3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical">&ldquo;'+p.text+'&rdquo;</div>';
    h+='</div>';
  });
  b.innerHTML=h;
}

function openProph(idx){
  var p=PROPH[idx];
  var b=document.getElementById('pr-body');
  if (!b) return;
  var h='<button class="back-btn" onclick="renderProphList()">&#8592; Prophecies</button>';
  h+='<div style="font-family:Cinzel,serif;font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,168,76,.4);margin-bottom:.5rem">'+p.source+'</div>';
  h+='<div style="font-family:Cinzel Decorative,serif;font-size:1.4rem;color:var(--gold);margin-bottom:1.5rem;line-height:1.2">'+p.title+'</div>';
  h+='<div style="border-left:2px solid rgba(201,168,76,.3);padding:1rem 1.25rem;background:rgba(201,168,76,.04);margin-bottom:1.5rem;border-radius:0 4px 4px 0">';
  h+='<div class="prophecy-text">&ldquo;'+p.text+'&rdquo;</div></div>';
  h+='<div class="detail-h3">Interpretation</div><div class="detail-p">'+p.interp+'</div>';
  if (p.chars.length){h+='<div class="detail-h3">Related Characters</div><div class="rel-grid">';p.chars.forEach(function(c){h+='<div class="rel-chip">'+c+'</div>';});h+='</div>';}
  if (p.events.length){h+='<div class="detail-h3">Related Events</div><div class="rel-grid">';p.events.forEach(function(e){h+='<div class="rel-chip">'+e+'</div>';});h+='</div>';}
  if (p.loops.length){h+='<div class="detail-h3">Loop References</div><div class="rel-grid">';p.loops.forEach(function(l){h+='<div class="rel-chip">'+l+'</div>';});h+='</div>';}
  b.innerHTML=h;
  b.scrollTop=0;
}

// ─────────────────────────────────────────────────────────────
// PATCH loadCh — add progress saving + bookmark button
// ─────────────────────────────────────────────────────────────
var _origLoadCh=loadCh;
loadCh=function(i){
  _origLoadCh(i);
  // Save progress
  setTimeout(function(){saveReadProgress(i,0);},200);
  // Scroll progress tracking
  setTimeout(function(){
    var body=document.getElementById('bk-body');
    if (!body) return;
    body.onscroll=function(){
      var pct=body.scrollHeight>body.clientHeight?body.scrollTop/(body.scrollHeight-body.clientHeight):0;
      saveReadProgress(i,pct);
    };
  },400);
  // Add bookmark button
  setTimeout(function(){
    if (!document.getElementById('bm-toggle')){
      var btn=document.createElement('button');
      btn.id='bm-toggle';
      btn.className='bm-toggle';
      btn.innerHTML='&#128279;';
      btn.title='Bookmark this chapter';
      btn.onclick=function(){toggleBM();setTimeout(function(){updateBmBtn();},50);};
      document.body.appendChild(btn);
    }
    updateBmBtn();
  },300);
};

// ─────────────────────────────────────────────────────────────
// PATCH DOMContentLoaded — check continue reading
// ─────────────────────────────────────────────────────────────
var _origInit=document.addEventListener;
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(checkContinueReading,2800);
});


</script>
